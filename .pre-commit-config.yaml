# APEX Quality Firewall: Pre-Commit Hooks
# Ensures code meets minimum standards before commit
#
# Zero-Diff Formatting Pipeline:
# - Code is formatted at write-time (via write_formatted())
# - Pre-commit auto-formats any staged files as a safety net
# - CI performs verification only (no fixing)
#
# Install:
#   make install-hooks
#   # or
#   pre-commit install -f
#
# Manual run:
#   make pre-commit
#   # or
#   pre-commit run --all-files
#
# For the unified quality gate without the pre-commit framework:
#   ./scripts/pre_commit_hook.sh

# `pre-commit install -f` (invoked by `make install-hooks`) installs exactly
# the hook types listed here. The gitleaks hook below declares a `pre-push`
# stage, so pre-push must be installed by default — otherwise `git push` would
# bypass the secrets check when a caller used `git commit --no-verify`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Zero-diff formatting: auto-format changed files before commit
  - repo: local
    hooks:
      - id: auto-format-staged
        name: Auto-format staged Python files
        entry: scripts/setup/run_repo_python.sh scripts/dev/auto_format_changed.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: black-ci-parity
        name: Black (CI parity)
        entry: scripts/setup/run_lint_tool.sh black
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/.*\.pyi?$

      - id: isort-ci-parity
        name: isort (CI parity)
        entry: scripts/setup/run_lint_tool.sh isort
        language: system
        types: [python]
        files: ^(src|tests)/.*\.py$

      - id: check-root-file-placement
        name: Check Root File Placement
        entry: scripts/setup/pre-commit-check.sh
        language: system
        pass_filenames: false

      - id: check-ml-test-isolation
        name: Check ML Test Isolation (ADR-031)
        entry: scripts/check_ml_test_isolation.sh
        language: script
        files: ^tests/.*\.py$
        pass_filenames: false

      - id: validate-dependency-constraints
        name: Validate Dependency Constraints (ADR-032)
        entry: scripts/validate_dependency_constraints.sh
        language: script
        files: ^(requirements/.*\.(in|txt)|pyproject\.toml|scripts/validate_dependency_constraints\.sh)$
        pass_filenames: false

      - id: check-test-markers
        name: Check Test Markers (ADR-044)
        entry: scripts/setup/run_repo_python.sh scripts/validation/check_test_markers.py
        language: system
        files: ^tests/.*\.py$
        types: [python]

      - id: check-unsafe-torch-load
        name: Check Unsafe torch.load() Usage (CVE-2025-32434)
        entry: scripts/setup/run_repo_python.sh scripts/validation/check_unsafe_torch_load.py
        language: system
        files: \.py$
        pass_filenames: false

      - id: ban-tautological-tests
        name: Ban Tautological Test Assertions
        entry: scripts/setup/run_repo_python.sh scripts/ci/check_no_tautological_tests.py
        language: system
        files: ^tests/.*\.py$
        types: [python]
        pass_filenames: false

      - id: check-design-tokens-doc
        name: Validate generated design tokens reference
        entry: scripts/setup/run_repo_python.sh scripts/validation/generate_design_tokens_doc.py --check
        language: system
        files: ^(web/shared/shared-ui-tokens\.css|web/secure-landing/portal-src/styles/tokens\.css|scripts/validation/generate_design_tokens_doc\.py|docs/design/tokens\.md)$
        pass_filenames: false

  # Local parity with ci-quality-firewall.yml "Check for secrets with gitleaks".
  # CI downloads gitleaks v8.21.2 and runs:
  #     gitleaks detect --config .gitleaks.toml --source . --verbose --no-git --exit-code 1
  # Override the upstream hook's default entry (which uses `protect --staged`) so
  # the local verdict matches CI exactly — full-tree scan, ignoring git history,
  # using the repo's .gitleaks.toml allowlist. The args below use the same
  # space-separated tokenization as CI so the two invocations are argv-identical.
  # This prevents secret-shaped test fixtures (the trigger for PR #1508) from
  # reaching origin.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (CI parity)
        entry: gitleaks
        args:
          - detect
          - --config
          - .gitleaks.toml
          - --source
          - .
          - --no-git
          - --verbose
          - --exit-code
          - "1"
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
