# Pre-commit hooks for code quality
# See https://pre-commit.com for more information
# Install: pip install pre-commit && pre-commit install

repos:
  # Security checks (CRITICAL - runs first)
  - repo: local
    hooks:
      - id: security-check
        name: Security Artifact Check
        entry: python3 scripts/security/pre_commit_security_check.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: true
        description: 'Block sensitive files, bidi Unicode, and large artifacts'

  # Ruff - fast Python linter and formatter (replaces flake8, black, isort, pylint)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args:
          - --fix
          - --line-length=127
          - --select=E9,F63,F7,F82  # Critical errors only (matches current flake8)
          - --exclude=deprecated,src/transformation_portal,.venv,lux_depth_v2/__pycache__,depth_anything_3_official
      - id: ruff-format
        args:
          - --line-length=127
          - --exclude=deprecated,src/transformation_portal,.venv,lux_depth_v2/__pycache__,depth_anything_3_official

  # Pre-commit hooks for basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(deprecated/|src/transformation_portal/|\.venv/)
      - id: end-of-file-fixer
        exclude: ^(deprecated/|src/transformation_portal/|\.venv/)
      - id: check-yaml
        exclude: ^(deprecated/|src/transformation_portal/|mkdocs\.yml)$
      - id: check-added-large-files
        args: ['--maxkb=5000']  # Warn on files >5MB
      - id: check-merge-conflict
      - id: check-ast  # Verify Python syntax
        exclude: ^(deprecated/|src/transformation_portal/)
