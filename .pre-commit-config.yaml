# APEX Quality Firewall: Pre-Commit Hooks
# Ensures code meets minimum standards before commit
#
# Zero-Diff Formatting Pipeline:
# - Code is formatted at write-time (via write_formatted())
# - Pre-commit auto-formats any staged files as a safety net
# - CI performs verification only (no fixing)
#
# Install: pre-commit install

repos:
  # Zero-diff formatting: auto-format changed files before commit
  - repo: local
    hooks:
      - id: auto-format-staged
        name: Auto-format staged Python files
        entry: python scripts/dev/auto_format_changed.py
        language: system
        pass_filenames: false
        stages: [commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: black-ci-parity
        name: Black (CI parity)
        entry: scripts/setup/run_lint_tool.sh black
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/.*\.pyi?$

      - id: isort-ci-parity
        name: isort (CI parity)
        entry: scripts/setup/run_lint_tool.sh isort
        language: system
        types: [python]
        files: ^(src|tests)/.*\.py$

      - id: check-root-file-placement
        name: Check Root File Placement
        entry: scripts/setup/pre-commit-check.sh
        language: system
        pass_filenames: false

      - id: check-ml-test-isolation
        name: Check ML Test Isolation (ADR-031)
        entry: scripts/check_ml_test_isolation.sh
        language: script
        files: ^tests/.*\.py$
        pass_filenames: false

      - id: validate-dependency-constraints
        name: Validate Dependency Constraints (ADR-032)
        entry: scripts/validate_dependency_constraints.sh
        language: script
        files: ^requirements/.*\.in$|^requirements/.*\.txt$
        pass_filenames: false

      - id: check-test-markers
        name: Check Test Markers (ADR-044)
        entry: python scripts/validation/check_test_markers.py
        language: system
        files: ^tests/.*\.py$
        types: [python]

# Manual run: pre-commit run --all-files
# Install: pre-commit install
