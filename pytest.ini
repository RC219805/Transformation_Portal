[pytest]
minversion = 8.0
addopts = --strict-markers --tb=short -p no:warnings
testpaths = tests
python_files = test_*.py
pythonpath = . src
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ml: marks tests as requiring ML dependencies like PyTorch (deselect with '-m "not ml"')