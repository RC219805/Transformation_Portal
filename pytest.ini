[pytest]
minversion = 8.0
addopts = --strict-markers --tb=short -p no:warnings
testpaths = tests
python_files = test_*.py
pythonpath = . src
asyncio_mode = auto
norecursedirs = .git .venv .hypothesis __pycache__ build dist .tox .pytest_cache *.egg *.egg-info
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ml: marks tests requiring ML dependencies (torch, diffusers, etc.)
    integration: marks integration tests for Phase 2 and Materials v2
    stress: marks stress tests (run nightly)
    edge_case: marks edge case tests (run on every commit)
    materials_v3: marks MaterialsV3 tests
