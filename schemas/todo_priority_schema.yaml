# TODO Priority Schema v1
# ========================
# Defines priority levels, categories, and exclusions for TODO governance.
#
# This schema is used by:
# - scripts/validation/scan_todo_inventory.py
# - TODO inventory documentation
# - CI governance checks

version: 1

priorities:
  P0:
    definition: "Critical, release blocker"
    sla: "Must resolve before release"
    examples:
      - "Security vulnerabilities"
      - "Data loss risks"
      - "Contract-breaking regressions"
    color: "red"

  P1:
    definition: "High, complete before next release"
    sla: "Within 1 release cycle"
    examples:
      - "Contract-breaking changes"
      - "Governance gaps"
      - "Test coverage gaps for critical paths"
    color: "orange"

  P2:
    definition: "Medium, scheduled"
    sla: "Within 2-3 releases"
    examples:
      - "Feature completeness"
      - "UX improvements"
      - "Documentation updates"
    color: "yellow"

  P3:
    definition: "Low, deferred"
    sla: "Backlog"
    examples:
      - "Experimental features"
      - "Research items"
      - "Technical debt reduction"
    color: "blue"

  P4:
    definition: "Enhancement, nice-to-have"
    sla: "No SLA"
    examples:
      - "Optimization research"
      - "Cosmetic improvements"
      - "Developer ergonomics"
    color: "gray"

categories:
  actionable:
    security:
      description: "Security-related TODOs requiring immediate attention"
      requires_tracking: true

    contract_stability:
      description: "TODOs affecting public API contracts"
      requires_tracking: true

    test_coverage:
      description: "Missing or incomplete test coverage"
      requires_tracking: true

    performance:
      description: "Performance improvements or bottlenecks"
      requires_tracking: true

  non_actionable:
    phase_gated:
      description: "TODOs deliberately deferred to a future phase"
      requires_tracking: true
      tracking_pattern: "TODO(Phase X):"

    security_pattern:
      description: "False positives from security regex patterns"
      requires_tracking: false
      examples:
        - "TODO_REPLACE in model_lock.py"

    observational:
      description: "Notes for future consideration, not actionable now"
      requires_tracking: false

    documentation:
      description: "Historical markers in documentation files"
      requires_tracking: false

exclusions:
  # Patterns that are false positives (not actual TODOs)
  patterns:
    - pattern: "TODO_REPLACE"
      reason: "Security scanner pattern for detecting placeholder credentials"
      locations:
        - "src/transformation_portal/core/security/model_lock.py"
        - "src/transformation_portal/preset_governance.py"

  # Paths excluded from TODO scanning
  paths:
    - path: "docs/"
      reason: "Historical documentation markers are informational"

    - path: "__pycache__/"
      reason: "Generated bytecode"

    - path: "node_modules/"
      reason: "Third-party dependencies"

    - path: ".venv/"
      reason: "Virtual environment"

    - path: ".git/"
      reason: "Git metadata"

    - path: ".runtime/"
      reason: "Runtime environment"

governance:
  # Reference patterns that indicate proper TODO governance
  tracking_patterns:
    - pattern: "(Phase X)"
      description: "Phase-gated work"
      example: "# TODO(Phase 3): Add support for..."

    - pattern: "(ADR-XXX)"
      description: "ADR-linked work"
      example: "# TODO(ADR-044): Implement marker..."

    - pattern: "(#1234)"
      description: "Issue-linked work"
      example: "# TODO(#1234): Fix edge case..."

    - pattern: "(@owner)"
      description: "Owner-assigned work"
      example: "# TODO(@specialist): Review..."

  # Types of TODO markers recognized
  marker_types:
    - marker: "TODO"
      description: "General task marker"

    - marker: "FIXME"
      description: "Bug or issue that needs fixing"

    - marker: "HACK"
      description: "Workaround that should be improved"

    - marker: "XXX"
      description: "Attention needed, potential problem"

    - marker: "NotImplementedError"
      description: "Unimplemented functionality"
