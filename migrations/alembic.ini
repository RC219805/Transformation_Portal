# Alembic configuration for the Transformation Portal orchestrator schema.
#
# The script_location is relative to the directory `alembic` is invoked from
# (the repo root, via `make db-upgrade` / `make db-revision`). The connection
# URL is supplied at runtime from the `TP_DATABASE_URL` env var; see
# `migrations/env.py`.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname  # overridden by env.py


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
