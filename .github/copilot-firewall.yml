# Copilot network allowlist inventory (documentation only)
# No repository automation consumes this file; it does not configure a firewall.
# Actual GitHub controls live in Settings > Copilot > Internet access.
# Review this inventory against current runtime needs before changing those settings.
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall
version: 1

# Historical domain inventory; remote access has not been verified here
allow:
  # Python Package Index (PyPI) - for pip installs
  - pypi.org
  - files.pythonhosted.org
  - pypi.python.org

  # PyTorch downloads - for ML/AI dependencies
  - download.pytorch.org

  # GitHub resources
  - github.com
  - api.github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com

  # npm registry - for Node 22 managed frontdoor dependency installation
  - registry.npmjs.org

  # Hugging Face - for ML models and datasets
  - huggingface.co
  - cdn.huggingface.co
  - cdn-lfs.huggingface.co

  # OpenAI API - for AI summarization workflow
  - api.openai.com

  # Common CDNs and mirrors
  - cdn.jsdelivr.net
  - unpkg.com

  # NVIDIA CUDA toolkit (for GPU support)
  - developer.download.nvidia.com

  # Anaconda/Conda packages
  - repo.anaconda.com
  - conda.anaconda.org
