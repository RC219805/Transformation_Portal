name: Print Issue Info

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read  # Read-only access for issue inspection

jobs:
  print-info:
    runs-on: ubuntu-latest
    steps:

      - name: Print issue info
        env:
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Body: \"$BODY\""
          echo "Title: \"$TITLE\""
