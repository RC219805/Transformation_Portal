name: determinism-gate

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools==69.0.3" "wheel==0.42.0"
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Determinism CLI baseline hash gate
        run: |
          pytest -v tests/cli/test_determinism.py

      - name: FP-state invariance gate
        run: |
          pytest -v tests/determinism/test_fpstate_invariance.py
