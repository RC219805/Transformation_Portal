name: determinism-gate

on:
  pull_request:
    branches: [ "main" ]

# Concurrency control: Cancel outdated runs on new pushes to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determinism:
    name: Determinism Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python 3.11
        id: setup-python-311
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools==69.0.3" "wheel==0.42.0"
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Determinism CLI baseline hash gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/cli/test_determinism.py

      - name: FP-state invariance gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/determinism/test_fpstate_invariance.py

      - name: Bundle root determinism gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_bundle_root.py

      - name: Phase 4 canonicalization fingerprint gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_capture_metadata_fingerprint.py

      - name: Phase 4 deterministic capture metadata extraction gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_extract_capture_metadata.py

      - name: Phase 4 metadata manifest hashing gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_build_metadata_manifest.py

      - name: Phase 4 provenance manifest binding gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_build_provenance_manifest.py

      - name: Phase 4 provenance merkle gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_build_provenance_merkle.py

      - name: Run card integrity unit gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/test_verify_run_card_integrity.py

      - name: Run card trust unit gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" \
            tests/crypto/test_ct_merkle.py \
            tests/lux_depth_v3/test_artifact_tree.py \
            tests/attestation/test_run_card_attestation.py \
            tests/attestation/test_sign_run_card_attestation_cli.py \
            tests/attestation/test_verify_run_card_attestation_cli.py \
            tests/validation/test_assess_run_card_release.py

      - name: Generate minimal runtime run card artifact
        env:
          TP_ALLOW_SYNTHETIC_FALLBACK: "1"
        run: |
          set -euo pipefail
          mkdir -p output/run_card_gate_input output/run_card_gate_output

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          input_path = Path("output/run_card_gate_input/minimal.png")
          input_path.parent.mkdir(parents=True, exist_ok=True)
          Image.new("RGB", (2, 2), color=(128, 128, 128)).save(input_path)
          PY

          python -m transformation_portal.lux_depth_v3 \
            --input-dir output/run_card_gate_input \
            --output-dir output/run_card_gate_output \
            --model-key da3-metric \
            --depth-device cpu \
            --enable-v2 off \
            --emit-run-card on \
            --run-card-version v2 \
            --cache-depth off \
            --pbr off

      - name: Run card artifact integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_run_card_integrity.py tests/golden/run_card/run_card_valid.v1.json --check-canonical-json

          shopt -s globstar nullglob
          run_card_candidates=(output/**/run_card_*.json)
          run_cards=()
          for run_card in "${run_card_candidates[@]}"; do
            case "$run_card" in
              *.self.json|*.attestation.*.json)
                continue
                ;;
            esac
            run_cards+=("$run_card")
          done
          if [ "${#run_cards[@]}" -eq 0 ]; then
            echo "❌ No generated run cards found under output/ for this workflow run."
            echo "Determinism gate requires validating at least one runtime-generated run card."
            exit 1
          else
            for run_card in "${run_cards[@]}"; do
              python scripts/verify_run_card_integrity.py "$run_card" --check-canonical-json
            done
          fi

      - name: Ingest machine-json normalization determinism gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/ingest/test_machine_json_normalization.py

      - name: Ingest linux baseline parity gate (normalized JSON)
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/ingest/test_ingest_linux_baseline_parity.py

      - name: Ingest batch determinism gate (mixed media)
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/ingest/test_batch_determinism.py

      - name: Ingest evidence bundle verification gate
        run: |
          pytest -v -m "not ml and not slow and not benchmark" tests/ingest/test_ingest_bundle_verification.py

      - name: Setup Python 3.12
        id: setup-python-312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies for Python 3.12 parity gates
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools==69.0.3" "wheel==0.42.0"
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Phase 4D manifest cross-runtime parity gate (3.11 vs 3.12)
        env:
          PY311: ${{ steps.setup-python-311.outputs.python-path }}
          PY312: ${{ steps.setup-python-312.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          "$PY312" tools/check_phase4d_manifest_cross_runtime.py \
            --python-a "$PY311" \
            --python-b "$PY312" \
            --project-root "$GITHUB_WORKSPACE"

      - name: Phase 4F verifier cross-runtime parity gate (3.11 vs 3.12)
        env:
          PY311: ${{ steps.setup-python-311.outputs.python-path }}
          PY312: ${{ steps.setup-python-312.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          "$PY312" tools/check_phase4f_verifier_cross_runtime.py \
            --python-a "$PY311" \
            --python-b "$PY312" \
            --project-root "$GITHUB_WORKSPACE"

      - name: Bundle root cross-runtime parity gate (3.11 vs 3.12)
        env:
          PY311: ${{ steps.setup-python-311.outputs.python-path }}
          PY312: ${{ steps.setup-python-312.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          "$PY312" tools/check_bundle_root_cross_runtime.py \
            --python-a "$PY311" \
            --python-b "$PY312" \
            --project-root "$GITHUB_WORKSPACE"

      - name: Governance export cross-runtime parity gate (3.11 vs 3.12)
        env:
          PY311: ${{ steps.setup-python-311.outputs.python-path }}
          PY312: ${{ steps.setup-python-312.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          "$PY312" tools/check_governance_export_cross_runtime.py \
            --python-a "$PY311" \
            --python-b "$PY312" \
            --project-root "$GITHUB_WORKSPACE"
