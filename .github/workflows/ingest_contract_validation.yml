name: Ingest Contract Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Workflow-level permissions with least privilege defaults
permissions:
  contents: read

jobs:
  validate-ingest-contract:
    name: Validate Ingest Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (attempt 1)
        id: checkout_validate_1
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Checkout code (attempt 2)
        id: checkout_validate_2
        if: steps.checkout_validate_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Enforce checkout success
        if: steps.checkout_validate_1.outcome == 'failure' && steps.checkout_validate_2.outcome == 'failure'
        run: |
          echo "Repository checkout failed after two attempts."
          echo "This is often a transient GitHub fetch/API issue; retry the workflow."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Disable broken Azure CLI apt source when present
        run: |
          if ls /etc/apt/sources.list.d/azure-cli*.list >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli*.list
          fi

      - name: Install exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          exiftool -ver

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep the ingest contract lane lightweight and deterministic.
          # The tests exercise ingest schemas/validators, not the full runtime stack.
          python -m pip install "numpy>=1.24,<2.5.0" "pydantic>=2.0,<3" "Pillow>=10.0.0,<13" pytest "jsonschema>=4.23,<5"
          python -m pip install -e . --no-deps
          python -c "import jsonschema; print(jsonschema.__version__)"

      - name: Run ingest contract validation
        run: |
          python scripts/validate_ingest_contract.py --test-dir tests/fixtures/ingest --strict
        continue-on-error: false

      - name: Run ingest contract tests
        run: |
          pytest tests/ingest/ -v --tb=short -m "not ml and not slow and not benchmark"
        continue-on-error: false

  schema-drift-detection:
    name: Schema Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch (attempt 1)
        id: checkout_schema_1
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the PR base commit local so schema drift detection can diff
          # without a second network fetch, which has been flaky in CI.
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Checkout PR branch (attempt 2)
        id: checkout_schema_2
        if: steps.checkout_schema_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Enforce checkout success
        if: steps.checkout_schema_1.outcome == 'failure' && steps.checkout_schema_2.outcome == 'failure'
        run: |
          echo "Repository checkout failed after two attempts."
          echo "This is often a transient GitHub fetch/API issue; retry the workflow."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0,<3"
          python -m pip install -e . --no-deps

      - name: Check for schema changes with policy enforcement
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "❌ Missing PR base commit after checkout: ${BASE_SHA}"
            exit 1
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            echo "❌ Missing PR head commit after checkout: ${HEAD_SHA}"
            exit 1
          fi

          # Check if schema files were modified
          SCHEMA_FILES="src/transformation_portal/ingest/schemas.py"
          CHANGED_FILES=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          SCHEMA_CHANGED=false
          for file in $SCHEMA_FILES; do
            if printf '%s\n' "$CHANGED_FILES" | grep -Fxq "$file"; then
              echo "⚠️  Schema file modified: $file"
              SCHEMA_CHANGED=true
            fi
          done

          if [ "$SCHEMA_CHANGED" = "true" ]; then
            echo ""
            echo "📋 Schema change detected - validating compliance with schema evolution policy:"
            echo ""

            # Check 1: Schema version must be bumped
            echo "✓ Checking schema version bump..."
            VERSION_CHANGED=$(git diff "${BASE_SHA}...${HEAD_SHA}" -- src/transformation_portal/ingest/schemas.py | grep -Ec '^\+.*Literal\["[0-9]+\.[0-9]+\.[0-9]+"\]' || true)

            if [ "$VERSION_CHANGED" -eq 0 ]; then
              echo "❌ POLICY VIOLATION: Schema version not bumped"
              echo "   When modifying schemas.py, you must bump the Literal schema version"
              echo "   Example: Literal[\"1.0.0\"] → Literal[\"1.1.0\"] or Literal[\"2.0.0\"]"
              exit 1
            fi
            echo "   ✅ Schema version appears to be bumped"

            # Check 2: CHANGELOG.md must be updated
            echo ""
            echo "✓ Checking CHANGELOG.md update..."
            if ! printf '%s\n' "$CHANGED_FILES" | grep -Fxq "CHANGELOG.md"; then
              echo "❌ POLICY VIOLATION: CHANGELOG.md not updated"
              echo "   Schema changes require CHANGELOG.md update with migration notes"
              exit 1
            fi
            echo "   ✅ CHANGELOG.md updated"

            # Check 3: Contract docs must be updated
            echo ""
            echo "✓ Checking contract documentation update..."
            if ! printf '%s\n' "$CHANGED_FILES" | grep -Fxq "docs/apex/ingest_contract.md"; then
              echo "❌ POLICY VIOLATION: docs/apex/ingest_contract.md not updated"
              echo "   Schema changes require contract documentation update"
              exit 1
            fi
            echo "   ✅ Contract docs updated"

            echo ""
            echo "✅ All schema evolution policy checks passed"
            echo "   Schema change is properly documented and versioned"
          else
            echo "✅ No schema files modified"
          fi

      - name: Verify schema version consistency
        run: |
          # Ensure all schema versions are consistent
          python -c "
          from transformation_portal.ingest.schemas import ProvenanceSidecar, IngestManifest

          prov_version = ProvenanceSidecar.model_fields['schema_version'].default
          manifest_version = IngestManifest.model_fields['schema_version'].default

          if prov_version != manifest_version:
              print(f'❌ Schema version mismatch:')
              print(f'   ProvenanceSidecar: {prov_version}')
              print(f'   IngestManifest: {manifest_version}')
              exit(1)

          print(f'✅ Schema versions consistent: {prov_version}')
          "
