name: Dataset Governance & Telemetry

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # Weekly: Sunday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GOV_MIN_CLASSIFIED: "0" # Phase 1 default. Raise later (ratchet).

jobs:
  dataset-governance:
    name: Dataset Governance & Telemetry Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-governance-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-governance-

      - name: Install dependencies (telemetry)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Build manifest (Montecito)
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          test -f "$OUT"

      - name: Write manifest_hash.sha256
        run: |
          set -euo pipefail
          sha256sum montecito_manifest.csv > manifest_hash.sha256
          cat manifest_hash.sha256

      - name: Generate deterministic telemetry JSON + audit extract
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py metrics \
            --manifest montecito_manifest.csv \
            --out-json manifest_metrics.json \
            --out-audit-csv manifest_audit_extract.csv

      - name: Generate Merkle roots (per-drive + global)
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py merkle \
            --manifest montecito_manifest.csv \
            --out-json manifest_merkle.json

      - name: Governance completeness gate (optional)
        run: |
          set -euo pipefail
          if [ -f rights_privacy_governance.csv ]; then
            python tools/manifest_telemetry.py governance-gate \
              --governance-csv rights_privacy_governance.csv \
              --min-classified "${GOV_MIN_CLASSIFIED}" \
              --out-json governance_gate_report.json
          else
            echo '{"note":"rights_privacy_governance.csv not present; skipping governance gate"}' > governance_gate_report.json
          fi

      - name: Install GPG
        if: github.event_name != 'pull_request' && secrets.DATASET_SIGNING_KEY != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import signing key
        if: github.event_name != 'pull_request' && secrets.DATASET_SIGNING_KEY != ''
        env:
          DATASET_SIGNING_KEY: ${{ secrets.DATASET_SIGNING_KEY }}
        run: |
          set -euo pipefail
          echo "$DATASET_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Sign manifest_hash.sha256 (detached)
        if: github.event_name != 'pull_request' && secrets.DATASET_SIGNING_KEY != ''
        env:
          DATASET_SIGNING_PASSPHRASE: ${{ secrets.DATASET_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$FPR"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${DATASET_SIGNING_PASSPHRASE:-}" \
            --local-user "$FPR" \
            --armor --detach-sign \
            --output manifest_hash.sha256.asc \
            manifest_hash.sha256
          test -f manifest_hash.sha256.asc

      - name: Mark signing skipped when key is not configured
        if: github.event_name != 'pull_request' && secrets.DATASET_SIGNING_KEY == ''
        run: |
          set -euo pipefail
          echo '{"note":"DATASET_SIGNING_KEY not set; signing skipped for this run"}' > signature_status.json

      - name: Upload governance artifacts (incl signature when present)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dataset-governance-bundle
          retention-days: 30
          if-no-files-found: error
          path: |
            montecito_manifest.csv
            manifest_hash.sha256
            manifest_hash.sha256.asc
            manifest_metrics.json
            manifest_audit_extract.csv
            manifest_merkle.json
            governance_gate_report.json
            signature_status.json
