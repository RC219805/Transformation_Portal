name: Submit to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Upload to Test PyPI instead of production'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build source and wheel distributions
      run: |
        python -m build --wheel --sdist --outdir dist/

    - name: Check distribution
      run: |
        twine check dist/*

    - name: Verify package contents
      run: |
        echo "=== Wheel contents ==="
        python -m zipfile -l dist/*.whl | head -30
        echo ""
        echo "=== Source distribution contents ==="
        tar -tzf dist/*.tar.gz | head -30

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: dist
        path: dist/
        retention-days: 7

  test-pypi:
    name: Upload to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.test_pypi == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi != 'false')
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install twine
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Upload to Test PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --skip-existing

  pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install twine
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing

  cleanup:
    name: Cleanup
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Clean up build artifacts
      run: |
        echo "Cleaning up build artifacts..."
        rm -rf dist/ || true
        # Force cleanup of any cached files
        docker system prune -f || true
        sudo apt-get clean || true
        
    - name: Final cleanup verification
      run: |
        echo "Disk usage after cleanup:"
        df -h
        echo "Workflow completed successfully!"
