name: Submit to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Upload to Test PyPI instead of production'
        required: false
        default: false
        type: boolean

# Concurrency control: Global mutual exclusion for all releases
# Only one release can run at a time across all tags/refs to prevent PyPI conflicts
# Note: cancel-in-progress is false for release workflows to ensure completion
concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

# Workflow-level permissions with least privilege defaults
# Individual jobs may request additional permissions as needed
permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build source and wheel distributions
      run: |
        python -m build --wheel --sdist --outdir dist/

    - name: Check distribution
      run: |
        twine check dist/*

    - name: Verify package contents
      run: |
        echo "=== Wheel contents ==="
        python -m zipfile -l dist/*.whl | head -30
        echo ""
        echo "=== Source distribution contents ==="
        tar -tzf dist/*.tar.gz | head -30

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dist
        path: dist/
        retention-days: 7

  test-pypi:
    name: Upload to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    environment:
      # Configure this environment with required reviewers for release approvals.
      name: testpypi
      url: https://test.pypi.org/p/transformation-portal

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: dist
        path: dist/

    - name: Publish to Test PyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      # Configure this environment with required reviewers for release approvals.
      name: pypi
      url: https://pypi.org/p/transformation-portal

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
      with:
        skip-existing: true

  cleanup:
    name: Cleanup
    needs: [build, test-pypi, pypi]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()

    steps:
    - name: Clean up build artifacts
      continue-on-error: true
      run: |
        echo "No cleanup required: this job runs on a fresh GitHub Actions runner."
        # Cleanup commands removed because each job runs on a new VM and there are no artifacts to clean.

    - name: Final cleanup verification
      continue-on-error: true
      run: |
        echo "Disk usage after cleanup:"
        df -h || true
        echo "Workflow completed successfully!"
