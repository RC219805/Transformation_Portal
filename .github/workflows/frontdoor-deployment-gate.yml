name: Frontdoor Deployment Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Shared environment being validated
        required: true
        type: choice
        options:
          - staging
          - production
      frontdoor_url:
        description: Public frontdoor base URL
        required: true
        type: string
      cf_access_team_domain:
        description: Cloudflare Access team domain
        required: true
        type: string
      deployment_target:
        description: Deployment surface to validate
        required: false
        default: cloudflare-worker
        type: choice
        options:
          - cloudflare-worker
          - vercel
      deployment_url:
        description: Cloudflare Worker or Vercel deployment URL
        required: false
        type: string
      vercel_deployment_url:
        description: Legacy Vercel deployment or preview URL alias
        required: false
        type: string
      fastapi_public_url:
        description: Public FastAPI base URL (leave blank when none exists)
        required: false
        type: string
      confirm_fastapi_non_public:
        description: Confirm no public FastAPI URL exists
        required: false
        default: false
        type: boolean
      timeout_seconds:
        description: Per-request timeout in seconds
        required: false
        default: "8"
        type: string
      user_agent:
        description: Validator user agent override
        required: false
        default: TransformationPortalFrontdoorDeploymentGate/1.0
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Frontdoor shared-deployment gate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'frontdoor-production' || 'frontdoor-staging' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          set -euo pipefail
          make install-core

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/secure-landing/.nvmrc
          cache: npm
          cache-dependency-path: web/secure-landing/package-lock.json

      - name: Install frontdoor dependencies
        run: |
          set -euo pipefail
          cd web/secure-landing
          npm ci

      - name: Run frontdoor contract checks
        run: |
          set -euo pipefail
          make test-frontdoor-contract

      - name: Run deployment-gate unit tests
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q tests/validation/test_frontdoor_deployment_gate.py

      - name: Run orchestrator contract checks
        run: |
          set -euo pipefail
          make test-orchestrator-contract

      - name: Validate live shared-deployment posture
        env:
          TP_FRONTDOOR_GATE_ENVIRONMENT: ${{ github.event.inputs.environment }}
          TP_FRONTDOOR_GATE_FRONTDOOR_URL: ${{ github.event.inputs.frontdoor_url }}
          TP_FRONTDOOR_GATE_CF_ACCESS_TEAM_DOMAIN: ${{ github.event.inputs.cf_access_team_domain }}
          TP_FRONTDOOR_GATE_DEPLOYMENT_TARGET: ${{ github.event.inputs.deployment_target }}
          TP_FRONTDOOR_GATE_DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url }}
          TP_FRONTDOOR_GATE_VERCEL_DEPLOYMENT_URL: ${{ github.event.inputs.vercel_deployment_url }}
          TP_FRONTDOOR_GATE_FASTAPI_PUBLIC_URL: ${{ github.event.inputs.fastapi_public_url }}
          TP_FRONTDOOR_GATE_CONFIRM_FASTAPI_NON_PUBLIC: ${{ github.event.inputs.confirm_fastapi_non_public && '1' || '' }}
          TP_FRONTDOOR_GATE_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds }}
          TP_FRONTDOOR_GATE_USER_AGENT: ${{ github.event.inputs.user_agent }}
        run: |
          set -euo pipefail
          make validate-frontdoor-deployment-gate
