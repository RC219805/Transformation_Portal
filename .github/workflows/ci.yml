name: CI Quality Firewall (push)

on:
  push:
    branches: [main, develop]
  # pull_request disabled - CI Gate in build.yml is the required governance check
  # This workflow provides post-merge validation only

# Concurrency control: Cancel outdated runs on new pushes to the same branch
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION_LINT: "3.12"
  PYTHON_VERSION_TEST_MIN: "3.11"
  PYTHON_VERSION_TEST_MAX: "3.12"
  PYTHON_VERSION_ML: "3.11"

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-lint.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Lint with flake8 (critical errors)
        run: |
          # Stop build on syntax errors, undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: JSON serialization guardrails
        run: |
          python scripts/validation/check_raw_json_usage.py

      - name: pip-tools cache guardrails
        run: |
          python scripts/validation/check_piptools_cache_tracked.py

      - name: Lint with flake8 (style warnings)
        continue-on-error: true
        run: |
          flake8 src/ tests/ --count --max-line-length=127 --statistics

      - name: Check formatting with black
        continue-on-error: true
        run: |
          black --check --line-length=127 src/ tests/

      - name: Check import sorting with isort
        continue-on-error: true
        run: |
          isort --check-only --profile=black --line-length=127 src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML
          pip install -e . --no-deps

      - name: Type check with mypy (critical modules)
        # ADR-044: mypy now hard-fails for critical modules (was soft-fail)
        # This enforces type safety as a blocking gate
        run: |
          mypy src/transformation_portal/lux_depth_v3/ --config-file=mypy.ini

  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # gitleaks-action scans the push commit range (<before>..<after>).
          # Shallow clones can miss the "before" commit and cause false failures.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('requirements*.txt', 'requirements/**/*.txt', 'requirements/**/*.in') }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          # Install from locked requirements file for deterministic, governed security tooling
          pip install -r requirements/security.txt

      - name: Run bandit security scan
        run: |
          # Generate JSON report for artifacts (may contain low-severity issues)
          bandit -r src/ -f json -o bandit-report.json --exit-zero
          # Fail on issues with severity >= LOW and confidence >= MEDIUM (Bandit flags: -ll -ii)
          bandit -r src/ -ll -ii -f screen

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          # Fail on known vulnerabilities (exit non-zero)
          # CVE-2026-4539 (pygments): No fix available yet - temporary exception
          # See: https://github.com/pygments/pygments/issues/3058
          # Remove --ignore-vuln when fixed pygments version is released
          pip-audit --desc -r requirements-ci.txt --ignore-vuln CVE-2026-4539

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: security-reports
          path: |
            bandit-report.json

  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt', 'requirements/tools-archive.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements/tools-archive.txt
          python -m pip install -e . --no-deps
          python -c "import numpy, pandas; print('archive tool deps OK')"

      - name: Verify test environment
        run: |
          python --version
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -m pytest --version

      - name: Run core tests (no ML)
        run: |
          # ADR-044: Enable parallel test execution with pytest-xdist for faster CI
          # -n auto: use all available CPU cores
          # Positive marker selection: explicitly select core test categories (unit, security, regression, golden, integration)
          python -m pytest -v tests/ \
            -n auto \
            -m "(unit or security or regression or golden or integration) and not ml and not slow and not benchmark and not stress" \
            --cov=src/transformation_portal \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --cov-config=pyproject.toml \
            --maxfail=3 \
            --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTHONNOUSERSITE: 1

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          files: ./coverage.xml
          flags: core-tests
          name: core-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Rename coverage file for combining
        if: matrix.python-version == '3.12'
        run: |
          # Rename .coverage to include job identifier for later combining
          if [ -f .coverage ]; then
            mv .coverage .coverage.core-py${{ matrix.python-version }}
            echo "Coverage file renamed successfully"
            ls -la .coverage.core-py${{ matrix.python-version }}
          else
            echo "ERROR: .coverage file not found!"
            ls -la .coverage* || echo "No coverage files found"
            exit 1
          fi

      - name: Verify coverage file before upload
        if: matrix.python-version == '3.12'
        run: |
          echo "Files in current directory before upload:"
          ls -la .coverage* || echo "No .coverage files found"
          if [ -f .coverage.core-py${{ matrix.python-version }} ]; then
            echo "✓ .coverage.core-py${{ matrix.python-version }} exists ($(stat -f%z .coverage.core-py${{ matrix.python-version }} 2>/dev/null || stat -c%s .coverage.core-py${{ matrix.python-version }}) bytes)"
          else
            echo "✗ .coverage.core-py${{ matrix.python-version }} NOT FOUND"
          fi

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-core-py${{ matrix.python-version }}
          include-hidden-files: true
          path: .coverage.core-py${{ matrix.python-version }}

  test-ml:
    name: ML Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python 3.11
        id: setup-python-ml
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('requirements-ci.txt') }}

      - name: Cache ML models
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cache/huggingface
            models
          key: ${{ runner.os }}-models-v4-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-models-v4-

      - name: Install ML test dependencies
        run: |
          bash scripts/ci/install_ml_test_dependencies.sh --include-rawpy
          df -h

      - name: Verify test environment
        run: |
          python --version
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -m pytest --version

      - name: Run ML tests
        run: |
          # ADR-044: Enable parallel test execution with pytest-xdist for faster CI
          # -n auto: use all available CPU cores
          python -m pytest -v tests/ \
            -n auto \
            -m "ml and not slow and not benchmark and not stress" \
            --cov=src/transformation_portal \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --durations=25 --durations-min=1.0 \
            --maxfail=3 \
            --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTHONNOUSERSITE: 1
          TRANSFORMERS_OFFLINE: 1
          # Prevent thread oversubscription on shared CI runners
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          files: ./coverage.xml
          flags: ml-tests
          name: ml-py3.11
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Rename coverage file for combining
        run: |
          # Rename .coverage to include job identifier for later combining
          if [ -f .coverage ]; then
            mv .coverage .coverage.ml-py3.11
            echo "Coverage file renamed successfully"
            ls -la .coverage.ml-py3.11
          else
            echo "ERROR: .coverage file not found!"
            ls -la .coverage* || echo "No coverage files found"
            exit 1
          fi

      - name: Verify coverage file before upload
        run: |
          echo "Files in current directory before upload:"
          ls -la .coverage* || echo "No .coverage files found"
          if [ -f .coverage.ml-py3.11 ]; then
            echo "✓ .coverage.ml-py3.11 exists ($(stat -f%z .coverage.ml-py3.11 2>/dev/null || stat -c%s .coverage.ml-py3.11) bytes)"
          else
            echo "✗ .coverage.ml-py3.11 NOT FOUND"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-ml-py3.11
          include-hidden-files: true
          path: .coverage.ml-py3.11

  coverage-gate:
    name: Coverage Quality Gate
    needs: [test-core, test-ml]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Install coverage tools
        run: |
          pip install coverage diff-cover

      - name: List and consolidate downloaded artifacts
        run: |
          echo "=== Downloaded coverage artifact structure ==="
          find coverage-artifacts -type f -name ".coverage*" || true
          echo ""
          echo "=== Moving coverage files to root ==="
          # Move all .coverage.* files from subdirectories to root
          find coverage-artifacts -type f -name ".coverage*" -exec mv {} . \;
          echo ""
          echo "=== Files in root after consolidation ==="
          ls -la .coverage* 2>/dev/null || echo "ERROR: No .coverage files found after consolidation"

      - name: Combine coverage data
        run: |
          # Verify we have at least one coverage file
          if ! ls .coverage* 1> /dev/null 2>&1; then
            echo "ERROR: No .coverage files found to combine"
            exit 1
          fi

          echo "=== Combining coverage files ==="
          ls -la .coverage*

          # Combine all .coverage.* files from different test runs
          coverage combine --keep .coverage*
          echo "✓ Coverage files combined successfully"

          # Generate XML report for diff-cover
          coverage xml
          echo "✓ coverage.xml generated"

          # Generate text report for verification
          echo ""
          echo "=== Combined coverage report ==="
          coverage report

      - name: Check coverage thresholds
        run: |
          # Coverage floor: prevent regression below 25%
          # Current combined: 25.44% (as of 2026-02-04 after PR #832)
          # Target: 33% by Q2 2026 (requires ~1,877 more covered statements)
          # Note: --fail-under uses integer %, cannot enforce 25.44% exactly
          # See docs/guides/coverage-improvement-plan.md for roadmap
          coverage report --fail-under=25

      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          # Diff coverage: new/changed lines must be covered at 85%
          # Aligns with docs/testing/test_coverage_improvement_plan.md and
          # the `make coverage-diff` Make target. This is the key ratcheting
          # mechanism - fail if not met.
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=85

  build:
    name: Build & Package Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Test wheel install
        run: |
          pip install dist/*.whl
          python -c "import transformation_portal; print(transformation_portal.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist-packages
          path: dist/

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Check for root clutter
        run: |
          # Check for workflow markers
          if ls DEFER MERGE ROLLBACK SUCCESS Continue SKIP INVESTIGATE "=" 2>/dev/null; then
            echo "ERROR: Workflow marker files found in root"
            exit 1
          fi

          # Check for coverage artifacts
          if ls .coverage coverage.json 2>/dev/null; then
            echo "ERROR: Coverage artifacts in root (should be gitignored)"
            exit 1
          fi

          # Check markdown file count (max 15 in root)
          markdown_count=$(find . -maxdepth 1 -name "*.md" -type f | wc -l)
          if [ "$markdown_count" -gt 15 ]; then
            echo "ERROR: Too many markdown files in root ($markdown_count). Maximum: 15"
            exit 1
          fi

      - name: Check for directories with spaces
        run: |
          # Fail if any directories contain spaces (breaks many tools)
          if find . -type d -name "* *" | grep -v ".git" | grep .; then
            echo "ERROR: Directories with spaces found"
            exit 1
          fi

      - name: Check .gitignore coverage
        run: |
          # Verify critical patterns are ignored
          patterns=(".coverage" "coverage.json" "htmlcov/" "*.pyc" "__pycache__/" "dist/" "*.egg-info")
          for pattern in "${patterns[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "WARNING: Pattern '$pattern' not in .gitignore"
            fi
          done

  quality-summary:
    name: Quality Gate Summary
    needs: [lint, typecheck, security, test-core, test-ml, coverage-gate, build, repo-hygiene]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all gates passed
        run: |
          echo "Quality Gate Status:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Type Check: ${{ needs.typecheck.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo "  Core Tests: ${{ needs.test-core.result }}"
          echo "  ML Tests: ${{ needs.test-ml.result }}"
          echo "  Coverage Gate: ${{ needs.coverage-gate.result }}"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Repo Hygiene: ${{ needs.repo-hygiene.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test-core.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.repo-hygiene.result }}" != "success" ]; then
            echo "FAILED: Critical quality gates did not pass"
            exit 1
          fi

          echo "SUCCESS: All critical quality gates passed"
