name: Determinism Harness / Cross-ISA Parity

on:
  pull_request:
    paths:
      - "src/transformation_portal/determinism/**"
      - "src/transformation_portal/spatial_ai/ingest/phase2_camera_native_linear.py"
      - "src/transformation_portal/spatial_ai/ingest/contracts.py"
      - "pyproject.toml"
      - "policy/**"
      - ".github/workflows/determinism-cross-isa.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  baseline-x86:
    name: Baseline (x86_64)
    runs-on: ubuntu-latest
    container:
      image: python:3.11.8-slim-bookworm
    outputs:
      artifact_id: ${{ steps.capture.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system compiler toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools==69.0.3" "wheel==0.42.0"

      - name: Install pinned numpy (binary only, no BLAS drift)
        run: |
          pip install "numpy==1.26.4" --only-binary=:all:

      - name: Install typer, pillow, and pydantic
        run: |
          pip install typer pillow pydantic

      - name: Install package (no deps, just compile extension + wire package)
        run: |
          pip install -e . --no-deps

      - name: Generate synthetic tensor input
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          p = Path("synthetic_xyz.npy")
          # Fully deterministic across ISA: integer sequence cast to float32 (no math).
          arr = np.arange(4 * 4 * 3, dtype=np.float32).reshape((4, 4, 3), order="C")
          np.save(p, arr, allow_pickle=False)
          print("wrote", p)
          PY

      - name: Run determinism harness
        run: |
          python -m transformation_portal.determinism run \
            --input synthetic_xyz.npy \
            --contract npy_tensor \
            --cas-root cas \
            --include-env \
            > run_result.json

      - name: Capture artifact id
        id: capture
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("run_result.json", "r", encoding="utf-8"))
          print(f"artifact_id={data['artifact_id']}")
          PY

      - name: Upload harness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: harness-report-x86_64
          path: run_result.json
          if-no-files-found: error

  candidate-arm:
    name: Candidate (arm64)
    runs-on: ubuntu-24.04-arm
    container:
      image: python:3.11.8-slim-bookworm
    outputs:
      artifact_id: ${{ steps.capture.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system compiler toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Install pinned build tools
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools==69.0.3" "wheel==0.42.0"

      - name: Install pinned numpy (binary only, no BLAS drift)
        run: |
          pip install "numpy==1.26.4" --only-binary=:all:

      - name: Install typer, pillow, and pydantic
        run: |
          pip install typer pillow pydantic

      - name: Install package (no deps, just compile extension + wire package)
        run: |
          pip install -e . --no-deps

      - name: Generate synthetic tensor input
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          p = Path("synthetic_xyz.npy")
          arr = np.arange(4 * 4 * 3, dtype=np.float32).reshape((4, 4, 3), order="C")
          np.save(p, arr, allow_pickle=False)
          print("wrote", p)
          PY

      - name: Run determinism harness
        run: |
          python -m transformation_portal.determinism run \
            --input synthetic_xyz.npy \
            --contract npy_tensor \
            --cas-root cas \
            --include-env \
            > run_result.json

      - name: Capture artifact id
        id: capture
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("run_result.json", "r", encoding="utf-8"))
          print(f"artifact_id={data['artifact_id']}")
          PY

      - name: Upload harness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: harness-report-arm64
          path: run_result.json
          if-no-files-found: error

  verify:
    name: Verify (artifact-id parity)
    runs-on: ubuntu-latest
    needs:
      - baseline-x86
      - candidate-arm
    steps:
      - name: Download harness reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: harness-report-*
          merge-multiple: true
          path: reports

      - name: Compare artifact ids across ISAs
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.baseline-x86.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.candidate-arm.outputs.artifact_id }}
        run: |
          # Artifact IDs are SHA-256 over the canonical tensor preimage, so parity
          # across ISAs is a direct content-equivalence check for this gate.
          echo "baseline=${BASELINE_ARTIFACT_ID}"
          echo "candidate=${CANDIDATE_ARTIFACT_ID}"
          if [ -z "${BASELINE_ARTIFACT_ID}" ] || [ -z "${CANDIDATE_ARTIFACT_ID}" ]; then
            echo "Missing artifact id output from baseline or candidate job."
            exit 1
          fi
          if [ "${BASELINE_ARTIFACT_ID}" != "${CANDIDATE_ARTIFACT_ID}" ]; then
            echo "Cross-ISA parity check failed: artifact ids differ."
            exit 1
          fi
          echo "Cross-ISA parity check passed."
