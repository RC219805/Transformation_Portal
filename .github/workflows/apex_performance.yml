name: APEX Performance Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'synthetic'
        type: choice
        options:
          - synthetic
          - real
      backend_id:
        description: 'Depth backend (da3, mock)'
        required: false
        default: 'da3'
        type: string
      sample_size:
        description: 'Number of test images'
        required: false
        default: '3'
        type: string
      device:
        description: 'Device (cpu, cuda, mps)'
        required: false
        default: 'cpu'
        type: string
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday 00:00 UTC

concurrency:
  group: apex-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workflow-level permissions with least privilege defaults
permissions:
  contents: read

env:
  APEX_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  APEX_COMMIT_SHA: ${{ github.sha }}
  APEX_RESULTS_DIR: ./apex_results
  APEX_LEDGER_DB: ./apex_performance.db

jobs:
  apex_matrix:
    name: Run (${{ matrix.workflow_version }} / ${{ matrix.zone }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workflow_version: [v1, v2]
        zone: [local]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (core)
        run: |
          set -euo pipefail
          # Install package with all core dependencies
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify core dependencies
        run: |
          set -euo pipefail
          # Fail fast if critical imports are broken
          python -c "import yaml; print('✅ PyYAML OK')"
          python -c "import numpy; print('✅ NumPy OK')"
          pip check

      - name: Install dependencies (ML tier)
        if: github.event.inputs.mode == 'real' || github.event_name == 'schedule'
        run: |
          set -euo pipefail
          # Real execution requires ML dependencies (torch + transformers + backend-specific)
          python -m pip install -e ".[ml]"

      - name: Run APEX Matrix
        env:
          APEX_ZONE: ${{ matrix.zone }}
        run: |
          set -euo pipefail
          # Determine execution mode based on event type
          MODE="${{ github.event.inputs.mode || 'synthetic' }}"
          BACKEND_ID="${{ github.event.inputs.backend_id || 'da3' }}"
          SAMPLE_SIZE="${{ github.event.inputs.sample_size || '3' }}"
          DEVICE="${{ github.event.inputs.device || 'cpu' }}"
          INPUT_DIR="./tests/fixtures/apex_images"

          # PR/push events: always synthetic (fast, deterministic)
          # workflow_dispatch with mode=real: real execution (manual testing)
          # schedule (nightly): real execution (continuous monitoring)
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="synthetic"
            echo "ℹ️ PR/push lane: forcing synthetic mode (fast validation)"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="real"
            echo "ℹ️ Scheduled run: using real execution (nightly monitoring)"
          fi

          # Build command with conditional flags
          CMD=(
            python scripts/apex_matrix_runner.py
            --run-id "${{ env.APEX_RUN_ID }}"
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"
            --workflow-versions ${{ matrix.workflow_version }}
            --zones ${{ matrix.zone }}
            --output-dir "${{ env.APEX_RESULTS_DIR }}"
            --ledger-db "${{ env.APEX_LEDGER_DB }}"
            --device "${DEVICE}"
            --backend-id "${BACKEND_ID}"
          )

          if [[ "${MODE}" == "synthetic" ]]; then
            CMD+=(--dry-run --synthetic)
            echo "🔹 Running in SYNTHETIC mode (no ML deps required)"
          else
            CMD+=(--input-dir "${INPUT_DIR}" --sample-size "${SAMPLE_SIZE}")
            echo "🔸 Running in REAL mode (backend=${BACKEND_ID}, samples=${SAMPLE_SIZE})"
          fi

          # Execute
          "${CMD[@]}"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apex-results-${{ matrix.workflow_version }}-${{ matrix.zone }}
          path: ${{ env.APEX_RESULTS_DIR }}/
          retention-days: 3

  apex_gate:
    name: APEX Gate & Report
    needs: apex_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify core dependencies
        run: |
          set -euo pipefail
          python -c "import yaml; print('✅ PyYAML OK')"
          pip check

      - name: Download Results
        id: download_results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: apex_downloaded_results
          pattern: apex-results-*
          merge-multiple: true

      - name: Check downloaded results
        id: results_check
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d apex_downloaded_results ]; then
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "file_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No APEX result artifacts downloaded (directory missing)."
            exit 0
          fi

          result_count=$(find apex_downloaded_results -type f | wc -l | tr -d ' ')
          echo "file_count=${result_count}" >> "$GITHUB_OUTPUT"

          if [ "${result_count}" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            echo "Downloaded ${result_count} APEX artifact file(s)."
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APEX result artifacts found after download; skipping ledger rebuild."
          fi

      - name: Rebuild Ledger
        if: steps.results_check.outputs.has_results == 'true'
        run: |
          set -euo pipefail
          python scripts/apex_rebuild_ledger.py \
            --input-dir apex_downloaded_results \
            --ledger-db "${{ env.APEX_LEDGER_DB }}"

      - name: Aggregate Stats
        if: steps.results_check.outputs.has_results == 'true'
        run: |
          set -euo pipefail
          python scripts/apex_aggregate_ledger.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --run-id "${{ env.APEX_RUN_ID }}" \
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"

      - name: Generate PR Comment
        if: always()
        run: |
          set -euo pipefail
          # Always create apex_comment.md (even on error) to prevent downstream failures
          : > apex_comment.md

          if [[ "${{ steps.results_check.outputs.has_results }}" != "true" ]]; then
            cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ⚠️ **APEX results artifacts were unavailable** (transient Actions artifact issue).
          Gate/report steps were skipped for this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          ERREOF
            echo "::warning::APEX artifacts unavailable; generated partial report and continuing."
            exit 0
          fi

          # Determine if run was synthetic based on event type
          MODE="${{ github.event.inputs.mode || 'synthetic' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="synthetic"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="real"
          fi

          # Build comment generation command with conditional --synthetic flag
          CMD=(
            python scripts/apex_pr_comment.py
            --run-id "${{ env.APEX_RUN_ID }}"
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"
            --ledger-db "${{ env.APEX_LEDGER_DB }}"
            --output apex_comment.md
          )

          if [[ "${MODE}" == "synthetic" ]]; then
            CMD+=(--synthetic)
          fi

          # Execute with fallback on error
          "${CMD[@]}" || {
            cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [ERROR]

          ⚠️ **Comment generation failed** - check workflow logs for details.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          ERREOF
            echo "::warning::APEX comment generation failed; continuing in shadow mode."
          }

      - name: Write to Job Summary
        if: always()
        run: cat apex_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR Comment (idempotent)
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"

          # Find existing APEX comment by unique header (pagination-safe)
          marker="# 🎯 APEX Performance Report"

          comment_id=$(gh api "repos/$repo/issues/$pr_number/comments" --paginate \
            | jq -s 'add | map(select(.body | startswith("'"$marker"'"))) | .[0].id // empty')

          if [ -n "$comment_id" ]; then
            echo "Updating existing APEX comment (id=$comment_id)"
            gh api "repos/$repo/issues/comments/$comment_id" \
              --method PATCH \
              -F body=@apex_comment.md
          else
            echo "Creating new APEX comment"
            gh pr comment "$pr_number" --body-file apex_comment.md
          fi

      - name: Enforce Gate (Shadow Mode - Informational Only)
        if: steps.results_check.outputs.has_results == 'true'
        run: |
          set -euo pipefail
          # NOTE: Gate is in SHADOW MODE for initial real-data rollout.
          # Reports failures but does not block merge. Switch to enforcing once baseline is stable.
          python scripts/apex_enforce_gate.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --run-id "${{ env.APEX_RUN_ID }}" \
            --commit-sha "${{ env.APEX_COMMIT_SHA }}" \
            --mode shadow

      - name: Upload Ledger Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apex-ledger
          path: ${{ env.APEX_LEDGER_DB }}
          retention-days: 90

  dashboard_deploy:
    name: Deploy Dashboard to GitHub Pages
    needs: apex_gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -e .

      - name: Download Ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apex-ledger

      - name: Generate Dashboard Site
        run: |
          set -euo pipefail
          python scripts/apex_dashboard_generator.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --output-dir _site \
            --days 90

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Dashboard smoke check (warn-only)
        if: always()
        run: |
          set +e
          PAGE_URL="${{ steps.deploy_pages.outputs.page_url }}"
          if [ -z "${PAGE_URL}" ]; then
            echo "::warning::Dashboard smoke check skipped: deploy-pages did not expose page_url output."
            exit 0
          fi

          check_url() {
            url="$1"
            label="$2"
            status=$(curl -fsSL -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "::warning::${label} returned HTTP ${status}: ${url}"
            else
              echo "✅ ${label} returned HTTP 200: ${url}"
            fi
          }

          check_url "${PAGE_URL}" "Dashboard index"
          check_url "${PAGE_URL%/}/latest.html" "Dashboard latest metrics"
          exit 0

  weekly_backup:
    name: Weekly Ledger Backup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      actions: read # Required for dawidd6/action-download-artifact

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Latest Ledger
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: apex-ledger
          workflow: apex_performance.yml
          branch: main

      - name: Compress Ledger
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          gzip -c "${{ env.APEX_LEDGER_DB }}" > "apex_ledger_${DATE}.db.gz"

      - name: Create Release Backup
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ledger-backup-${{ github.run_number }}
          name: APEX Ledger Backup ${{ github.run_number }}
          body: |
            Automated weekly performance ledger backup

            Date: ${{ github.event.repository.updated_at }}
            Workflow: APEX Performance Matrix
            Branch: main
          files: apex_ledger_*.db.gz
