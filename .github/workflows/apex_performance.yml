name: APEX Performance Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'synthetic'
        type: choice
        options:
          - synthetic
          - real
      backend_id:
        description: 'Depth backend (da3, mock)'
        required: false
        default: 'da3'
        type: string
      sample_size:
        description: 'Number of test images'
        required: false
        default: '3'
        type: string
      device:
        description: 'Device (cpu, cuda, mps)'
        required: false
        default: 'cpu'
        type: string
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday 00:00 UTC

concurrency:
  group: apex-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workflow-level permissions with least privilege defaults
permissions:
  contents: read

env:
  APEX_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  APEX_COMMIT_SHA: ${{ github.sha }}
  APEX_RESULTS_DIR: ./apex_results
  APEX_LEDGER_DB: ./apex_performance.db

jobs:
  apex_matrix:
    name: Run (${{ matrix.workflow_version }} / ${{ matrix.zone }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workflow_version: [v1, v2]
        zone: [local]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (core)
        run: |
          set -euo pipefail
          # Install package with all core dependencies
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify core dependencies
        run: |
          set -euo pipefail
          # Fail fast if critical imports are broken
          python -c "import yaml; print('✅ PyYAML OK')"
          python -c "import numpy; print('✅ NumPy OK')"
          pip check

      - name: Install dependencies (ML tier)
        if: github.event.inputs.mode == 'real' || github.event_name == 'schedule'
        run: |
          set -euo pipefail
          BACKEND_ID="${{ github.event.inputs.backend_id || 'da3' }}"

          if [[ "${BACKEND_ID}" == "da3" ]]; then
            # DA3 owns its ML stack in the governed isolated runtime. Keeping
            # Torch out of the host environment avoids installing the CUDA
            # stack twice on CPU-only hosted runners.
            ./scripts/setup/install_da3_runtime.sh --profile baseline
            DA3_PYTHON="${GITHUB_WORKSPACE}/.runtime/Depth-Anything-3/.venv-da3/bin/python"
            test -x "${DA3_PYTHON}"
            printf 'TRANSFORMATION_PORTAL_DA3_PYTHON=%s\n' "${DA3_PYTHON}" >> "${GITHUB_ENV}"
            printf 'TP_STRICT_MODEL_LOCK=1\n' >> "${GITHUB_ENV}"
          else
            # Non-isolated real backends still use the host ML dependency tier.
            python -m pip install -e ".[ml]"
          fi

      - name: Run APEX Matrix
        id: run_apex
        env:
          APEX_ZONE: ${{ matrix.zone }}
        run: |
          set -euo pipefail
          # Determine execution mode based on event type
          MODE="${{ github.event.inputs.mode || 'synthetic' }}"
          BACKEND_ID="${{ github.event.inputs.backend_id || 'da3' }}"
          SAMPLE_SIZE="${{ github.event.inputs.sample_size || '3' }}"
          DEVICE="${{ github.event.inputs.device || 'cpu' }}"
          INPUT_DIR="./tests/fixtures/apex_images"

          # PR/push events: always synthetic (fast, deterministic)
          # workflow_dispatch with mode=real: real execution (manual testing)
          # schedule (nightly): real execution (continuous monitoring)
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="synthetic"
            echo "ℹ️ PR/push lane: forcing synthetic mode (fast validation)"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="real"
            echo "ℹ️ Scheduled run: using real execution (nightly monitoring)"
          fi

          # Build command with conditional flags
          CMD=(
            python scripts/apex_matrix_runner.py
            --run-id "${{ env.APEX_RUN_ID }}"
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"
            --workflow-versions ${{ matrix.workflow_version }}
            --zones ${{ matrix.zone }}
            --output-dir "${{ env.APEX_RESULTS_DIR }}"
            --ledger-db "${{ env.APEX_LEDGER_DB }}"
            --device "${DEVICE}"
            --backend-id "${BACKEND_ID}"
          )

          if [[ "${MODE}" == "synthetic" ]]; then
            CMD+=(--dry-run --synthetic)
            echo "🔹 Running in SYNTHETIC mode (no ML deps required)"
          else
            CMD+=(--input-dir "${INPUT_DIR}" --sample-size "${SAMPLE_SIZE}")
            echo "🔸 Running in REAL mode (backend=${BACKEND_ID}, samples=${SAMPLE_SIZE})"
          fi

          # Execute
          "${CMD[@]}"

      - name: Upload Results
        id: upload_results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apex-results-${{ matrix.workflow_version }}-${{ matrix.zone }}
          path: ${{ env.APEX_RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 3

  apex_gate:
    name: APEX Gate & Report
    needs: apex_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    outputs:
      evidence_complete: ${{ steps.results_check.outputs.evidence_complete }}
      runner_outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
      upload_outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
      download_outcome: ${{ steps.results_check.outputs.download_outcome }}
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify core dependencies
        run: |
          set -euo pipefail
          python -c "import yaml; print('✅ PyYAML OK')"
          pip check

      - name: Resolve Matrix Stage Outcomes
        id: matrix_stages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MATRIX_JOBS: "2"
        run: |
          set -euo pipefail
          {
            echo "runner_outcome=unknown"
            echo "upload_outcome=unknown"
            echo "matrix_job_count=0"
          } >> "${GITHUB_OUTPUT}"

          jobs_json="${RUNNER_TEMP}/apex-matrix-jobs.json"
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > "${jobs_json}"; then
            echo "::warning::Unable to inspect current-run APEX matrix stage outcomes."
            exit 0
          fi

          if ! JOBS_JSON="${jobs_json}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["JOBS_JSON"]).read_text(encoding="utf-8"))
          expected_jobs = int(os.environ["EXPECTED_MATRIX_JOBS"])
          matrix_jobs = [
              job
              for job in payload.get("jobs", [])
              if str(job.get("name", "")).startswith("Run (")
          ]

          def aggregate_step(step_name: str) -> str:
              conclusions = []
              for job in matrix_jobs:
                  matching_step = next(
                      (step for step in job.get("steps", []) if step.get("name") == step_name),
                      None,
                  )
                  conclusion = matching_step.get("conclusion") if matching_step else None
                  if isinstance(conclusion, str) and conclusion:
                      conclusions.append(conclusion)
              if len(matrix_jobs) != expected_jobs or len(conclusions) != expected_jobs:
                  return "unknown"
              return "success" if all(value == "success" for value in conclusions) else "failure"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"runner_outcome={aggregate_step('Run APEX Matrix')}\n")
              output.write(f"upload_outcome={aggregate_step('Upload Results')}\n")
              output.write(f"matrix_job_count={len(matrix_jobs)}\n")
          PY
          then
            echo "::warning::Unable to parse current-run APEX matrix stage outcomes."
          fi

      - name: Download Results
        id: download_results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: apex_downloaded_results
          pattern: apex-results-*
          merge-multiple: true

      - name: Check downloaded results
        id: results_check
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download_results.outcome }}
          MATRIX_RESULT: ${{ needs.apex_matrix.result }}
          RUNNER_OUTCOME: ${{ steps.matrix_stages.outputs.runner_outcome }}
          UPLOAD_OUTCOME: ${{ steps.matrix_stages.outputs.upload_outcome }}
        run: |
          set -euo pipefail
          {
            echo "download_outcome=${DOWNLOAD_OUTCOME:-unknown}"
            echo "runner_outcome=${RUNNER_OUTCOME:-unknown}"
            echo "upload_outcome=${UPLOAD_OUTCOME:-unknown}"
          } >> "$GITHUB_OUTPUT"

          if [ ! -d apex_downloaded_results ]; then
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "evidence_complete=false" >> "$GITHUB_OUTPUT"
            echo "file_count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No APEX result artifacts downloaded (directory missing)."
            exit 0
          fi

          result_count=$(find apex_downloaded_results -type f | wc -l | tr -d ' ')
          echo "file_count=${result_count}" >> "$GITHUB_OUTPUT"

          if [ "${result_count}" -gt 0 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            echo "Downloaded ${result_count} APEX artifact file(s)."
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APEX result artifacts found after download; skipping ledger rebuild."
          fi

          missing_results=()
          for expected_result in observation_v1_local.json observation_v2_local.json; do
            if [ ! -f "apex_downloaded_results/${expected_result}" ]; then
              missing_results+=("${expected_result}")
            fi
          done

          if [[ "${RUNNER_OUTCOME}" == "success" && \
                "${UPLOAD_OUTCOME}" == "success" && \
                "${DOWNLOAD_OUTCOME}" == "success" && \
                ${#missing_results[@]} -eq 0 ]]; then
            echo "evidence_complete=true" >> "$GITHUB_OUTPUT"
            echo "Complete V1/V2 APEX evidence downloaded."
          else
            echo "evidence_complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Incomplete APEX evidence (runner=${RUNNER_OUTCOME:-unknown}, upload=${UPLOAD_OUTCOME:-unknown}, download=${DOWNLOAD_OUTCOME:-unknown}, matrix=${MATRIX_RESULT}, missing=${missing_results[*]:-none})."
          fi

      - name: Rebuild Ledger
        id: rebuild_ledger
        if: steps.results_check.outputs.evidence_complete == 'true'
        run: |
          set -euo pipefail
          python scripts/apex_rebuild_ledger.py \
            --input-dir apex_downloaded_results \
            --ledger-db "${{ env.APEX_LEDGER_DB }}"

      - name: Aggregate Stats
        id: aggregate_stats
        if: steps.results_check.outputs.evidence_complete == 'true'
        run: |
          set -euo pipefail
          python scripts/apex_aggregate_ledger.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --run-id "${{ env.APEX_RUN_ID }}" \
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"

      - name: Generate PR Comment
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.results_check.outputs.download_outcome }}
          MATRIX_RESULT: ${{ needs.apex_matrix.result }}
          RUNNER_OUTCOME: ${{ steps.matrix_stages.outputs.runner_outcome }}
          UPLOAD_OUTCOME: ${{ steps.matrix_stages.outputs.upload_outcome }}
        run: |
          set -euo pipefail
          # Always create apex_comment.md (even on error) to prevent downstream failures
          : > apex_comment.md

          if [[ "${{ steps.results_check.outputs.evidence_complete }}" != "true" ]]; then
            if [[ "${RUNNER_OUTCOME:-unknown}" == "failure" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ❌ **The `Run APEX Matrix` stage did not complete successfully.**
          Review the matrix runner and prerequisite logs before trusting this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            elif [[ "${RUNNER_OUTCOME:-unknown}" != "success" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ⚠️ **The current-run matrix runner outcome could not be resolved.**
          Review the gate's `Resolve Matrix Stage Outcomes` logs and the matrix jobs before attributing this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            elif [[ "${UPLOAD_OUTCOME:-unknown}" == "failure" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ❌ **APEX result upload failed after successful matrix execution.**
          Review the failed `Upload Results` step; the matrix runner itself succeeded.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            elif [[ "${UPLOAD_OUTCOME:-unknown}" != "success" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ⚠️ **The current-run result upload outcome could not be resolved.**
          Review the gate's `Resolve Matrix Stage Outcomes` logs before attributing this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            elif [[ "${DOWNLOAD_OUTCOME:-unknown}" == "failure" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ❌ **APEX result download failed after successful matrix execution and upload.**
          Review the failed `Download Results` step before trusting this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            elif [[ "${DOWNLOAD_OUTCOME:-unknown}" != "success" ]]; then
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ⚠️ **The current-run result download outcome could not be resolved.**
          Review the `Download Results` and gate logs before attributing this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            else
              cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [PARTIAL]

          ⚠️ **Complete V1/V2 APEX evidence was not present after successful transfer.**
          Review the produced result set before trusting this run.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          Runner outcome: ${{ steps.matrix_stages.outputs.runner_outcome }}
          Upload outcome: ${{ steps.matrix_stages.outputs.upload_outcome }}
          Download outcome: ${{ steps.results_check.outputs.download_outcome }}
          Matrix result: ${{ needs.apex_matrix.result }}
          ERREOF
            fi
            echo "::warning::Complete APEX evidence unavailable (runner=${RUNNER_OUTCOME:-unknown}, upload=${UPLOAD_OUTCOME:-unknown}, download=${DOWNLOAD_OUTCOME:-unknown}, matrix=${MATRIX_RESULT}); generated partial report."
            exit 0
          fi

          # Determine if run was synthetic based on event type
          MODE="${{ github.event.inputs.mode || 'synthetic' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="synthetic"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="real"
          fi

          # Build comment generation command with conditional --synthetic flag
          CMD=(
            python scripts/apex_pr_comment.py
            --run-id "${{ env.APEX_RUN_ID }}"
            --commit-sha "${{ env.APEX_COMMIT_SHA }}"
            --ledger-db "${{ env.APEX_LEDGER_DB }}"
            --output apex_comment.md
          )

          if [[ "${MODE}" == "synthetic" ]]; then
            CMD+=(--synthetic)
          fi

          # Execute with fallback on error
          "${CMD[@]}" || {
            cat > apex_comment.md <<'ERREOF'
          # 🎯 APEX Performance Report [ERROR]

          ⚠️ **Comment generation failed** - check workflow logs for details.

          Run ID: ${{ env.APEX_RUN_ID }}
          Commit: ${{ env.APEX_COMMIT_SHA }}
          ERREOF
            echo "::warning::APEX comment generation failed; continuing in shadow mode."
          }

      - name: Write to Job Summary
        if: always()
        run: cat apex_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR Comment (idempotent)
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"

          # Find existing APEX comment by unique header (pagination-safe)
          marker="# 🎯 APEX Performance Report"

          comment_id=$(gh api "repos/$repo/issues/$pr_number/comments" --paginate \
            | jq -s 'add | map(select(.body | startswith("'"$marker"'"))) | .[0].id // empty')

          if [ -n "$comment_id" ]; then
            echo "Updating existing APEX comment (id=$comment_id)"
            gh api "repos/$repo/issues/comments/$comment_id" \
              --method PATCH \
              -F body=@apex_comment.md
          else
            echo "Creating new APEX comment"
            gh pr comment "$pr_number" --body-file apex_comment.md
          fi

      - name: Enforce Gate (Shadow Mode - Informational Only)
        if: steps.results_check.outputs.evidence_complete == 'true'
        run: |
          set -euo pipefail
          # NOTE: Gate is in SHADOW MODE for initial real-data rollout.
          # Reports failures but does not block merge. Switch to enforcing once baseline is stable.
          python scripts/apex_enforce_gate.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --run-id "${{ env.APEX_RUN_ID }}" \
            --commit-sha "${{ env.APEX_COMMIT_SHA }}" \
            --mode shadow

      - name: Upload Ledger Artifact
        if: >-
          always() &&
          steps.results_check.outputs.evidence_complete == 'true' &&
          steps.rebuild_ledger.outcome == 'success' &&
          steps.aggregate_stats.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: apex-ledger
          path: ${{ env.APEX_LEDGER_DB }}
          retention-days: 90

  dashboard_deploy:
    name: Deploy Dashboard to GitHub Pages
    needs: apex_gate
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.apex_gate.outputs.evidence_complete == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'real'))
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -e .

      - name: Download Ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apex-ledger

      - name: Generate Dashboard Site
        run: |
          set -euo pipefail
          python scripts/apex_dashboard_generator.py \
            --ledger-db "${{ env.APEX_LEDGER_DB }}" \
            --output-dir _site \
            --days 90

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Dashboard smoke check (warn-only)
        if: always()
        run: |
          set +e
          PAGE_URL="${{ steps.deploy_pages.outputs.page_url }}"
          if [ -z "${PAGE_URL}" ]; then
            echo "::warning::Dashboard smoke check skipped: deploy-pages did not expose page_url output."
            exit 0
          fi

          check_url() {
            url="$1"
            label="$2"
            status=$(curl -fsSL -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "::warning::${label} returned HTTP ${status}: ${url}"
            else
              echo "✅ ${label} returned HTTP 200: ${url}"
            fi
          }

          check_url "${PAGE_URL}" "Dashboard index"
          check_url "${PAGE_URL%/}/latest.html" "Dashboard latest metrics"
          exit 0

  weekly_backup:
    name: Weekly Ledger Backup
    needs: apex_gate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && needs.apex_gate.outputs.evidence_complete == 'true'
    permissions:
      contents: write
      actions: read # Required for current-run artifact download

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Current Run Ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apex-ledger

      - name: Compress Ledger
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          gzip -c "${{ env.APEX_LEDGER_DB }}" > "apex_ledger_${DATE}.db.gz"

      - name: Create Release Backup
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ledger-backup-${{ github.run_number }}
          name: APEX Ledger Backup ${{ github.run_number }}
          body: |
            Automated weekly performance ledger backup

            Date: ${{ github.event.repository.updated_at }}
            Workflow: APEX Performance Matrix
            Branch: main
          files: apex_ledger_*.db.gz
