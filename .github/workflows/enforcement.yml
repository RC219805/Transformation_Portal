name: Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  action-pins:
    name: Verify Action Pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check action pinning
        run: python scripts/ci/verify_action_pins.py

  banned-dependencies:
    name: Verify No Banned Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tomli for TOML parsing
        run: pip install tomli

      - name: Check for banned packages
        run: python scripts/security/verify_banned_dependencies.py --strict

  hf-revision-policy:
    name: Validate HuggingFace Revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyYAML for preset parsing
        run: pip install PyYAML

      - name: Validate HF revisions (no placeholders in non-experimental presets)
        run: python scripts/validation/validate_hf_revisions.py --experimental-ok

  test-layer1:
    name: Layer 1 Tests (Fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          python -m pip install -c requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run unit and regression tests
        run: pytest tests/ -m "not ml and not slow and not benchmark" --maxfail=3

  test-layer2-ml:
    name: Layer 2 Tests (ML Tier)
    runs-on: ubuntu-latest
    # Only run ML tests when ML code changes or on schedule
    if: |
      contains(github.event.head_commit.modified, 'src/transformation_portal/ml/') ||
      contains(github.event.head_commit.modified, 'requirements/ml.') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Install ML dependencies with constraints
        run: |
          pip install -e ".[ml]" -c requirements/constraints.txt

      - name: Run ML tests
        run: pytest tests/ -m "ml" --maxfail=3

  golden-regression:
    name: Golden Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -c requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run golden tests
        run: pytest tests/ -m "not ml and not slow and not benchmark" --maxfail=1

  artifact-boundary:
    name: Verify Artifact Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check no artifacts in git
        run: |
          if git ls-files | grep -E '^(outputs|artifacts|renders)/.*\.(exr|tif|tiff|mp4|mov)$'; then
            echo "❌ Large artifacts found in git"
            exit 1
          fi
          echo "✅ No large artifacts in git"
