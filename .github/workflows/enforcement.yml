name: Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Allow nightly runs to trigger ML tier
    - cron: '15 4 * * *'

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Change classifier: reliably detect file changes across all event types
  # This replaces unreliable github.event.head_commit.modified which doesn't work for PRs
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      ml_changed: ${{ steps.filter.outputs.ml }}
      core_changed: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Need history for change detection

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            ml:
              - 'src/transformation_portal/ml/**'
              - 'src/transformation_portal/lux_depth_v3/**'
              - 'src/transformation_portal/depth/**'
              - 'requirements/ml*.txt'
              - 'requirements/ml*.in'
            core:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'requirements/*.txt'

  action-pins:
    name: Verify Action Pins
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Check action pinning
        run: python scripts/ci/verify_action_pins.py

  no-tautological-tests:
    name: Ban Tautological Test Assertions
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Reject `assert True` (and similar tautologies) in tests/
        run: python scripts/ci/check_no_tautological_tests.py tests

  banned-dependencies:
    name: Verify No Banned Dependencies
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install tomli for TOML parsing
        run: pip install tomli

      - name: Check for banned packages
        run: python scripts/security/verify_banned_dependencies.py --strict

  hf-revision-policy:
    name: Validate HuggingFace Revisions
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for preset parsing
        run: pip install PyYAML

      - name: Validate HF revisions (no placeholders in non-experimental presets)
        run: python scripts/validation/validate_hf_revisions.py --experimental-ok

      - name: Validate materials preset schema locations
        run: python scripts/validation/validate_materials_preset_schema.py

      - name: Check YAML governance boundary
        run: python scripts/validation/check_yaml_governance_boundary.py

      - name: Check TODO governance (no ungoverned TODO/FIXME/HACK/XXX/NotImplementedError in src/, tests/, scripts/, tools/, web/)
        run: python scripts/validation/scan_todo_inventory.py --check-governance

  test-layer1:
    name: Layer 1 Tests (Fast)
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run unit and regression tests
        run: pytest tests/ -m "not ml and not slow and not benchmark" --maxfail=3

  test-layer2-ml:
    name: Layer 2 Tests (ML Tier)
    runs-on: ubuntu-latest
    needs: [changes]
    # Only run ML tests when ML code changes or on schedule
    # Using outputs from the dedicated changes job for reliable PR detection
    if: needs.changes.outputs.ml_changed == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Install ML dependencies with constraints
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          # Keep exact-state golden output on the repository's audited ML
          # baseline; pyproject extras intentionally remain lower-bound
          # metadata for operator-managed environments.
          python -m pip install "torch==2.13.0" "torchvision==0.28.0"
          python -m pip install -e ".[ml]" -c requirements/constraints.txt --build-constraint requirements/constraints.txt
          python -m pip check

      - name: Run ML tests
        # Exclude slow/benchmark markers to keep PR runtime predictable
        run: pytest tests/ -m "ml and not slow and not benchmark" --maxfail=3

  golden-regression:
    name: Golden Regression Tests
    runs-on: ubuntu-latest
    needs: [changes]
    # Run when core code changes OR on scheduled nightly runs
    if: needs.changes.outputs.core_changed == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run golden regression tests
        # Uses same marker as test-layer1 to ensure contract/regression coverage
        run: pytest tests/ -m "not ml and not slow and not benchmark" --maxfail=1

  artifact-boundary:
    name: Verify Artifact Boundary
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Check no artifacts in git
        run: |
          if git ls-files | grep -E '^(outputs|artifacts|renders)/.*\.(exr|tif|tiff|mp4|mov)$'; then
            echo "❌ Large artifacts found in git"
            exit 1
          fi
          echo "✅ No large artifacts in git"
