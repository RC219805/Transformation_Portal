name: Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Allow nightly runs to trigger ML tier
    - cron: '15 4 * * *'

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Change classifier: reliably detect file changes across all event types
  # This replaces unreliable github.event.head_commit.modified which doesn't work for PRs
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists PR files through the GitHub API
    outputs:
      ml_changed: ${{ steps.filter.outputs.ml }}
      core_changed: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Need history for change detection

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            ml:
              - 'src/transformation_portal/ml/**'
              - 'src/transformation_portal/lux_depth_v3/**'
              - 'src/transformation_portal/depth/**'
              - 'requirements/ml*.txt'
              - 'requirements/ml*.in'
            core:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'requirements/*.txt'

  action-pins:
    name: Verify Action Pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Check action pinning
        run: python scripts/ci/verify_action_pins.py

  no-tautological-tests:
    name: Ban Tautological Test Assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Reject `assert True` (and similar tautologies) in tests/
        run: python scripts/ci/check_no_tautological_tests.py tests

  banned-dependencies:
    name: Verify No Banned Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Check for banned packages
        run: python scripts/security/verify_banned_dependencies.py --strict

  hf-revision-policy:
    name: Validate HuggingFace Revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for preset parsing
        run: pip install PyYAML

      - name: Validate HF revisions (no placeholders in non-experimental presets)
        run: python scripts/validation/validate_hf_revisions.py --experimental-ok

      - name: Validate materials preset schema locations
        run: python scripts/validation/validate_materials_preset_schema.py

      - name: Check YAML governance boundary
        run: python scripts/validation/check_yaml_governance_boundary.py

      - name: Check TODO governance (no ungoverned TODO/FIXME/HACK/XXX/NotImplementedError in src/, tests/, scripts/, tools/, web/)
        run: python scripts/validation/scan_todo_inventory.py --check-governance

  test-layer1:
    name: Layer 1 Tests (Fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
            requirements.txt
            requirements/base.txt
            requirements/constraints.txt
            pyproject.toml
            .github/workflows/enforcement.yml

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run unit and regression tests
        run: pytest tests/ -m "not ml and not slow and not benchmark" --maxfail=3

  orchestrator-services:
    name: Orchestrator Service Contracts (advisory)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # This password is used only inside the disposable CI runner.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
            requirements.txt
            requirements/base.txt
            requirements/constraints.txt
            pyproject.toml
            .github/workflows/enforcement.yml

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check

      - name: Create isolated Postgres test databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" createdb --username postgres tp_orchestrator_plain_test
          docker exec "$POSTGRES_CONTAINER_ID" createdb --username postgres tp_orchestrator_migrated_test

      - name: Run live Postgres and Redis contracts
        env:
          TP_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tp_orchestrator_plain_test
          TP_DISPATCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tp_orchestrator_migrated_test
          TP_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
        run: python scripts/validation/run_orchestrator_service_contracts.py ci --evidence-out "$RUNNER_TEMP/orchestrator-service-contracts.json"

      - name: Upload service contract evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: orchestrator-service-contracts
          path: ${{ runner.temp }}/orchestrator-service-contracts.json
          if-no-files-found: error
          retention-days: 7

  test-layer2-ml:
    name: Layer 2 Tests (ML Tier)
    runs-on: ubuntu-latest
    needs: [changes]
    # Only run ML tests when ML code changes or on schedule
    # Using outputs from the dedicated changes job for reliable PR detection
    if: needs.changes.outputs.ml_changed == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
            requirements.txt
            requirements/base.txt
            requirements/constraints.txt
            pyproject.toml
            .github/workflows/enforcement.yml

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Install ML dependencies with constraints
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          # Keep exact-state golden output on the repository's audited ML
          # baseline; pyproject extras intentionally remain lower-bound
          # metadata for operator-managed environments.
          python -m pip install "torch==2.13.0" "torchvision==0.28.0"
          python -m pip install -e ".[ml]" -c requirements/constraints.txt --build-constraint requirements/constraints.txt
          python -m pip check

      - name: Run ML tests
        # Exclude slow/benchmark markers to keep PR runtime predictable
        run: pytest tests/ -m "ml and not slow and not benchmark" --maxfail=3

  golden-regression:
    name: Golden Regression Tests
    runs-on: ubuntu-latest
    needs: [changes]
    # Run when core code changes OR on scheduled nightly runs
    if: needs.changes.outputs.core_changed == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
            requirements.txt
            requirements/base.txt
            requirements/constraints.txt
            pyproject.toml
            .github/workflows/enforcement.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -c requirements/constraints.txt --build-constraint requirements/constraints.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip install numpy==2.2.6 pandas==2.2.3 jsonschema==4.23.0
          python -m pip check
          python -c "import numpy, pandas, jsonschema"

      - name: Run golden regression tests
        # Layer 1 retains the full non-ML suite; this check owns explicit golden contracts.
        run: pytest tests/ -m "golden and not ml and not slow and not benchmark" --maxfail=1

  artifact-boundary:
    name: Verify Artifact Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Check no artifacts in git
        run: |
          if git ls-files | grep -E '^(outputs|artifacts|renders)/.*\.(exr|tif|tiff|mp4|mov)$'; then
            echo "❌ Large artifacts found in git"
            exit 1
          fi
          echo "✅ No large artifacts in git"
