name: Quality Gate

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".pre-commit-config.yaml"
      - "**/*.py"
      - "**/*.pyi"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements/**"
      - ".github/workflows/**"
      - "*.md"
  push:
    branches: [ main ]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full history needed for diff mode)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install -U pip
          python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-py310-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-py310-

      - name: Run pre-commit (PR = diff mode, main = all files)
        shell: bash
        env:
          PRE_COMMIT_COLOR: always
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running pre-commit on changed files only (diff mode)..."
            pre-commit run \
              --from-ref "${{ github.event.pull_request.base.sha }}" \
              --to-ref   "${{ github.event.pull_request.head.sha }}" \
              --show-diff-on-failure
          else
            echo "Running pre-commit on all files..."
            pre-commit run --all-files --show-diff-on-failure
          fi

      - name: Enforce root markdown file limit (<= 10)
        run: |
          markdown_count=$(find . -maxdepth 1 -name "*.md" -type f | wc -l | tr -d ' ')
          if [ "$markdown_count" -gt 10 ]; then
            echo "❌ ERROR: Too many markdown files in root ($markdown_count / max 10)"
            echo "Consider moving documentation to docs/ directory"
            exit 1
          else
            echo "✓ Root markdown files: $markdown_count / 10"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "- **Mode**: Diff (changed files only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Mode**: Full scan (all files)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Python**: 3.10" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter**: Ruff (critical errors only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Benefits**: ~10x faster than previous flake8/pylint/autopep8" >> $GITHUB_STEP_SUMMARY
