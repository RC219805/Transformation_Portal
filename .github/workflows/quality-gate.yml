name: Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Workflow only checks formatting; does not push commits
  pull-requests: read

jobs:
  pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt

      - name: Run advisory lint checks
        run: |
          PYTHON_BIN=python ./scripts/lint_runner.sh advisory

      - name: Check root file placement
        run: |
          ./scripts/setup/pre-commit-check.sh --all
