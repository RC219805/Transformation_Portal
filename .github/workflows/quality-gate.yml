name: Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Workflow only checks formatting; does not push commits
  pull-requests: read

jobs:
  pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt

      - name: Run advisory lint checks
        run: |
          PYTHON_BIN=python ./scripts/lint_runner.sh advisory

      - name: Check root file placement
        run: |
          ./scripts/setup/pre-commit-check.sh --all
