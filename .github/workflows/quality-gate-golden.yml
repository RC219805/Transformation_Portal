name: Quality Gate (Golden Images) - Manual

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"  # weekly Monday 07:00 UTC

permissions:
  contents: read

jobs:
  golden-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lux_depth_v2/requirements-repo.txt

      - name: Run (local gate driver)
        run: |
          python scripts/hardening/quality_gate_local.py
