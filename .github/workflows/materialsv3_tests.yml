name: MaterialsV3 Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run stress tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  edge-case-tests:
    name: MaterialsV3 Edge Case Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    
    - name: Run MaterialsV3 Edge Case Tests
      run: |
        pytest tests/test_materials_v3_edge_cases.py -v --tb=short
      continue-on-error: false
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: edge-case-test-results-${{ matrix.python-version }}
        path: |
          test-results/
          .pytest_cache/

  stress-tests:
    name: MaterialsV3 Stress Tests (Nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-stress]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    
    - name: Run MaterialsV3 Stress Tests
      run: |
        pytest tests/test_materials_v3_stress.py -v --tb=short --slow
      timeout-minutes: 45
    
    - name: Upload stress test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-results
        path: |
          test-results/
          .pytest_cache/

  verification:
    name: Phase 1 Safety Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    
    - name: Run MaterialsV3 Safety Tests
      run: |
        pytest tests/test_materials_v3_edge_cases.py tests/test_materials_v3_stress.py -v -k "not stress_1000" --tb=short
    
    - name: Verify Exception Handling in Pipeline
      run: |
        python -c "
        from lux_depth_v2.pipeline import DepthPipeline
        from pathlib import Path
        
        # Verify MaterialsV3 exception handling is present
        pipeline_code = Path('lux_depth_v2/pipeline.py').read_text()
        assert 'try:' in pipeline_code and 'materials_v3_engine' in pipeline_code, 'MaterialsV3 exception handling missing'
        print('✓ MaterialsV3 exception handling verified')
        
        # Verify killswitch environment variable support
        assert 'DISABLE_MATERIALS_V3' in pipeline_code or 'disable_materials_v3' in pipeline_code, 'Killswitch missing'
        print('✓ MaterialsV3 killswitch verified')
        print('✓ Phase 1 safety verification complete')
        "
