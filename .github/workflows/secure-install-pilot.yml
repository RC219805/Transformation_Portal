name: Secure Install Pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - "requirements/**"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "scripts/validation/**"
      - ".github/workflows/secure-install-pilot.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/dependency-update.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secure-install-pilot:
    name: Secure Install Pilot (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install lock generation tools
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install "pip-tools==7.6.1" "click==8.4.2"

      - name: Compile secure-install pilot lockfiles
        working-directory: requirements
        run: |
          make compile-hash-pilot LOCK_PYTHON_VERSION=3.11 HASH_PILOT_OUT_DIR="${GITHUB_WORKSPACE}/requirements/.hash-pilot"

      - name: Validate secure-install pilot lockfiles
        working-directory: requirements
        run: |
          make check-hash-pilot LOCK_PYTHON_VERSION=3.11 HASH_PILOT_OUT_DIR="${GITHUB_WORKSPACE}/requirements/.hash-pilot"

      - name: Upload secure-install pilot artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secure-install-pilot-locks
          path: requirements/.hash-pilot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
