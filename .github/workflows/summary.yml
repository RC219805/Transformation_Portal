name: Issue Summarizer

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

concurrency:
  group: summarizer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-api-key:
    name: Check OpenAI API Key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ OPENAI_API_KEY not configured - skipping AI summarization"
          fi

  summarize:
    runs-on: ubuntu-latest
    needs: check-api-key
    if: always()
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # marker used to detect previously-posted diagnostic comments
      DIAGNOSTIC_MARKER: "<!-- ai-summarizer-missing-key -->"
      # short, non-sensitive message to post when key is missing
      DIAGNOSTIC_MSG: |
        AI summarizer skipped: OPENAI_API_KEY is not configured in CI.
        Repository maintainers can enable automated summaries by configuring the `OPENAI_API_KEY` secret.
        <!-- ai-summarizer-missing-key -->
    steps:
      - name: Prepare pip cache key
        run: |
          cat > requirements-ai-summarizer.txt <<'REQ'
          openai>=1.0.0,<2
          REQ

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai-summarizer.txt

      - name: Install OpenAI package
        if: needs.check-api-key.outputs.has_key == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai-summarizer.txt

      - name: Run summarizer (safe Option B)
        id: summarizer
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          # BUG FIX 1: Corrected fallback chain priority for content sources
          # Priority: comment.body → review.body → issue.body → pull_request.body
          # This ensures issue_comment events on PRs get the actual comment body, not PR body
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.head_commit.message || '' }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.pull_request.body || github.event.head_commit.message || '' }}
          REVIEW_STATE: ${{ github.event.review.state || '' }}
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          python - <<'PY'
          import os, sys, textwrap
          RESPONSE_FILE = os.environ["RESPONSE_FILE"]
          OPENAI_API_KEY = os.getenv("OPENAI_API_KEY")

          # When the key is missing, write only a short, safe message and exit 0
          if not OPENAI_API_KEY:
              msg = os.environ["DIAGNOSTIC_MSG"]
              with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
                  f.write(msg)
              print("AI summarizer skipped; diagnostic message written to RESPONSE_FILE.")
              sys.exit(0)

          # If key present: perform summarization
          from openai import OpenAI
          client = OpenAI(api_key=OPENAI_API_KEY)

          title = (os.getenv("ISSUE_TITLE") or "").strip()
          body  = (os.getenv("ISSUE_BODY") or "").strip()[:4000]
          review_state = (os.getenv("REVIEW_STATE") or "").strip()
          event_name = (os.getenv("EVENT_NAME") or "").strip()

          # BUG FIX 3: Make prompts generic to match the consolidated content variable
          # Since ISSUE_BODY now contains the correct content for all events,
          # we use generic prompts that work with any content type
          if event_name == "pull_request_review":
              prompt = textwrap.dedent(f"""
              Summarize this pull request review in one concise paragraph (neutral tone).
              Review state: {review_state}
              PR title: {title}
              Review content:
              {body}
              """)
          elif event_name == "issue_comment":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub comment in one concise paragraph (neutral tone).
              Thread title: {title}
              Comment content:
              {body}
              """)
          elif event_name == "pull_request":
              prompt = textwrap.dedent(f"""
              Summarize this pull request in one concise paragraph (neutral tone).
              PR title: {title}
              Description:
              {body}
              """)
          elif event_name == "issues":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub issue in one concise paragraph (neutral tone).
              Issue title: {title}
              Description:
              {body}
              """)
          else:
              # Generic fallback for unexpected event types
              prompt = textwrap.dedent(f"""
              Summarize this GitHub event in one concise paragraph (neutral tone).
              Title: {title}
              Content:
              {body}
              """)

          # BUG FIX 4: Add proper rate limit handling
          try:
              completion = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role":"user","content":prompt}],
                  max_tokens=160, temperature=0.2
              )
              summary = (completion.choices[0].message.content or "").strip()
          except Exception as e:
              # Check if it's a rate limit error (status code 429)
              error_str = str(e)
              if "429" in error_str or "rate_limit" in error_str.lower():
                  summary = "AI summarization temporarily unavailable: OpenAI rate limit exceeded. Please try again later."
              else:
                  # Generic error message for other failures
                  summary = "AI summarization failed: an internal error occurred. See CI logs for details."
              # Log detailed error to stderr (visible in CI logs but not posted as comment)
              print("Detailed error (redacted for posting):", file=sys.stderr)
              print(repr(e), file=sys.stderr)

          with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
              f.write(summary)
          print(f"Summary generated: {len(summary)} chars")
          PY

      - name: Post comment only if present and not previously posted
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          MARKER: ${{ env.DIAGNOSTIC_MARKER }}
        run: |
          set -euo pipefail

          # Skip if no issue/PR number is available
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No ISSUE_NUMBER detected; skipping comment post."
            exit 0
          fi

          # Skip if response file is empty
          if [ ! -s "$RESPONSE_FILE" ]; then
            echo "No response to post."
            exit 0
          fi

          # BUG FIX 2: Only deduplicate when the current response contains the marker
          # This prevents one diagnostic comment from blocking all future real summaries
          if grep -Fq "$MARKER" "$RESPONSE_FILE"; then
            # Only check for existing diagnostic comments when we're about to post one
            echo "Checking existing comments for diagnostic marker..."
            EXISTING=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --jq '.[].body' 2>/dev/null || echo "")
            if echo "$EXISTING" | grep -Fq "$MARKER"; then
              echo "A diagnostic comment has already been posted; skipping to avoid duplicates."
              exit 0
            fi
          fi

          # Post the comment using --repo flag (no git context needed)
          echo "Posting comment to issue/PR #$ISSUE_NUMBER"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$RESPONSE_FILE"
