name: Issue Summarizer

on:
  issue_comment: {}
  pull_request: {}
  issues:
    types: [opened, edited]

# Concurrency control: Cancel outdated runs on new events for the same issue/PR
# This reduces CI minutes and API costs by only processing the latest state
# Includes event_name so pull_request and issue_comment runs do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Workflow-level permissions with least privilege defaults
# Individual jobs may request additional permissions as needed
permissions:
  contents: read

jobs:
  summarize:
    name: AI Advisory / Summary
    # Avoid blocked/required PR checks for bot-authored PR events.
    if: ${{ !(github.event_name == 'pull_request' && (github.actor == 'Copilot' || github.actor == 'copilot-swe-agent[bot]')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Marker used to identify fallback diagnostics that should stay log-only.
      DIAGNOSTIC_MARKER: "<!-- ai-summarizer-diagnostic -->"
      DIAGNOSTIC_MSG_MISSING_KEY: |
        AI summarizer skipped: OPENAI_API_KEY is not configured in CI.
        Repository maintainers can enable automated summaries by configuring the `OPENAI_API_KEY` secret.
        <!-- ai-summarizer-diagnostic -->
      DIAGNOSTIC_MSG_RATE_LIMIT: |
        AI summarizer skipped after bounded retries due to OpenAI rate limiting.
        This is non-blocking and intentionally does not fail CI.
        <!-- ai-summarizer-diagnostic -->
      DIAGNOSTIC_MSG_FAILURE: |
        AI summarization failed: an internal error occurred. See CI logs for details.
        <!-- ai-summarizer-diagnostic -->
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run summarizer (safe Option B)
        id: summarizer
        timeout-minutes: 4
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.head_commit.message || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body || github.event.review.body || github.event.comment.body || github.event.head_commit.message || '' }}
          REVIEW_STATE: ${{ github.event.review.state || '' }}
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          python - <<'PY'
          import json, os, random, sys, textwrap, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          RESPONSE_FILE = os.environ["RESPONSE_FILE"]
          OPENAI_API_KEY = os.getenv("OPENAI_API_KEY")

          # When the key is missing, write only a short, safe message and exit 0
          if not OPENAI_API_KEY:
              msg = os.environ["DIAGNOSTIC_MSG_MISSING_KEY"]
              with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
                  f.write(msg)
              # DEBUG: print only the non-sensitive message to runner logs
              print("AI summarizer skipped; diagnostic message written to RESPONSE_FILE.")
              sys.exit(0)

          title = (os.getenv("ISSUE_TITLE") or "").strip()
          body  = (os.getenv("ISSUE_BODY") or "").strip()[:4000]
          review_state = (os.getenv("REVIEW_STATE") or "").strip()
          event_name = (os.getenv("EVENT_NAME") or "").strip()

          # Adjust prompt based on event type
          if event_name == "pull_request_review":
              prompt = textwrap.dedent(f"""
              Summarize this pull request review in one concise paragraph (neutral tone).
              Review state: {review_state}
              PR title: {title}
              Review comment:
              {body}
              """)
          elif event_name == "issue_comment":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub issue comment in one concise paragraph (neutral tone).
              Issue title: {title}
              Comment:
              {body}
              """)
          elif event_name == "pull_request":
              prompt = textwrap.dedent(f"""
              Summarize this pull request in one concise paragraph (neutral tone).
              PR title: {title}
              Description:
              {body}
              """)
          elif event_name == "issues":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub issue in one concise paragraph (neutral tone).
              Issue title: {title}
              Description:
              {body}
              """)
          else:
              prompt = textwrap.dedent(f"""
              Summarize this GitHub event in one concise paragraph (neutral tone).
              Title: {title}
              Body:
              {body}
              """)
          def compute_backoff_seconds(attempt):
              return min(20.0, 2 ** attempt + random.uniform(0.1, 1.0))

          def compute_retry_wait_seconds(exc, attempt):
              retry_after = ""
              if getattr(exc, "headers", None):
                  retry_after = exc.headers.get("Retry-After", "").strip()
              if retry_after:
                  try:
                      return max(0.0, min(30.0, float(retry_after)))
                  except ValueError:
                      try:
                          retry_at = parsedate_to_datetime(retry_after)
                          if retry_at.tzinfo is None:
                              retry_at = retry_at.replace(tzinfo=timezone.utc)
                          delta = (retry_at - datetime.now(timezone.utc)).total_seconds()
                          return max(0.0, min(30.0, delta))
                      except Exception:
                          pass
              return compute_backoff_seconds(attempt)

          def call_openai_with_retries(api_key, prompt_text, max_retries=3):
              payload = {
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": prompt_text}],
                  "max_tokens": 160,
                  "temperature": 0.2,
              }
              body = json.dumps(payload).encode("utf-8")
              for attempt in range(1, max_retries + 1):
                  req = urllib.request.Request(
                      "https://api.openai.com/v1/chat/completions",
                      data=body,
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Content-Type": "application/json",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code == 429:
                          if attempt < max_retries:
                              wait = compute_retry_wait_seconds(exc, attempt)
                              print(
                                  f"::warning::Issue Summarizer rate limited "
                                  f"(attempt {attempt}/{max_retries}); retrying in {wait:.1f}s."
                              )
                              time.sleep(wait)
                              continue
                          raise RuntimeError("rate_limited") from exc
                      # Retry 5xx responses only; 4xx are treated as terminal.
                      if 500 <= exc.code <= 599 and attempt < max_retries:
                          wait = compute_retry_wait_seconds(exc, attempt)
                          print(
                              f"::warning::Issue Summarizer server error HTTP {exc.code} "
                              f"(attempt {attempt}/{max_retries}); retrying in {wait:.1f}s."
                          )
                          time.sleep(wait)
                          continue
                      raise RuntimeError(f"http_{exc.code}") from exc
                  except urllib.error.URLError as exc:
                      if attempt < max_retries:
                          wait = compute_backoff_seconds(attempt)
                          print(
                              f"::warning::Issue Summarizer network error "
                              f"(attempt {attempt}/{max_retries}); retrying in {wait:.1f}s."
                          )
                          time.sleep(wait)
                          continue
                      raise RuntimeError("network_error") from exc
              raise RuntimeError("unknown_error")

          try:
              response_json = call_openai_with_retries(OPENAI_API_KEY, prompt, max_retries=3)
              summary = (
                  response_json.get("choices", [{}])[0]
                  .get("message", {})
                  .get("content", "")
                  .strip()
              )
          except RuntimeError as e:
              if str(e) == "rate_limited":
                  summary = os.environ["DIAGNOSTIC_MSG_RATE_LIMIT"]
              else:
                  summary = os.environ["DIAGNOSTIC_MSG_FAILURE"]
              print("::warning::Issue Summarizer OpenAI request failed (non-blocking). See job logs for details.")
              print("Detailed error classification (exception type only):", file=sys.stderr)
              print(f"Exception type: {type(e).__name__}", file=sys.stderr)
          except Exception as e:  # pragma: no cover - defensive fallback in CI runtime
              summary = os.environ["DIAGNOSTIC_MSG_FAILURE"]
              print("::warning::Issue Summarizer OpenAI request failed (non-blocking). See job logs for details.")
              print("Detailed error classification (exception type only):", file=sys.stderr)
              print(f"Exception type: {type(e).__name__}", file=sys.stderr)

          with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Debug RESPONSE_FILE (safe)
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
        run: |
          echo "RESPONSE_FILE size:"
          stat -c "%s bytes" "$RESPONSE_FILE" || true
          echo "First 5 lines of RESPONSE_FILE:"
          head -n 5 "$RESPONSE_FILE" || true

      - name: Post successful summary comment only
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          MARKER: ${{ env.DIAGNOSTIC_MARKER }}
        run: |
          set -euo pipefail

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No ISSUE_NUMBER detected; skipping comment post."
            exit 0
          fi

          if [ ! -s "$RESPONSE_FILE" ]; then
            echo "No response to post."
            exit 0
          fi

          # Fallback diagnostics are visible in CI logs but should not add PR noise.
          if grep -Fq "$MARKER" "$RESPONSE_FILE"; then
            echo "Diagnostic fallback response is log-only; skipping PR comment post."
            exit 0
          fi

          # Post the comment using --body-file to avoid quoting issues.
          # NOTE: use GH_TOKEN with minimal scope (issues:write)
          echo "Posting comment to issue/PR #$ISSUE_NUMBER"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RESPONSE_FILE"

      - name: Report non-blocking AI failure
        if: failure()
        run: |
          echo "::warning::Issue Summarizer failed (non-blocking). See job logs."

      - name: AI Summary Status
        if: always()
        run: |
          echo "AI summarizer job completed (non-blocking)."
