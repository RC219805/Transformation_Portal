name: Issue Summarizer

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

concurrency:
  group: summarizer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-api-key:
    name: Check OpenAI API Key
    runs-on: ubuntu-latest
    permissions: {}  # No permissions needed - only checks secret existence
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ OPENAI_API_KEY not configured - skipping AI summarization"
          fi

  summarize:
    runs-on: ubuntu-latest
    needs: check-api-key
    if: always()
    continue-on-error: true
    timeout-minutes: 5
    # ARCHITECTURE: Repository-wide OpenAI API serialization
    # Prevents RPM limit contention across ai-code-review, smart-issue-management, and summarizer
    # cancel-in-progress: false ensures jobs queue instead of canceling
    concurrency:
      group: openai-api-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # marker used to detect previously-posted diagnostic comments
      DIAGNOSTIC_MARKER: "<!-- ai-summarizer-missing-key -->"
      # short, non-sensitive message to post when key is missing
      DIAGNOSTIC_MSG: |
        AI summarizer skipped: OPENAI_API_KEY is not configured in CI.
        Repository maintainers can enable automated summaries by configuring the `OPENAI_API_KEY` secret.
        <!-- ai-summarizer-missing-key -->
    steps:
      - name: Prepare pip cache key
        run: |
          cat > requirements-ai-summarizer.txt <<'REQ'
          openai>=1.0.0,<2
          REQ

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai-summarizer.txt

      - name: Install OpenAI package
        if: needs.check-api-key.outputs.has_key == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai-summarizer.txt

      - name: Run summarizer (safe Option B)
        id: summarizer
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          # BUG FIX 1: Corrected fallback chain priority for content sources
          # Priority: comment.body → review.body → issue.body → pull_request.body
          # This ensures issue_comment events on PRs get the actual comment body, not PR body
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.head_commit.message || '' }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.pull_request.body || github.event.head_commit.message || '' }}
          REVIEW_STATE: ${{ github.event.review.state || '' }}
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          python - <<'PY'
          import os, sys, textwrap
          RESPONSE_FILE = os.environ["RESPONSE_FILE"]
          # HARDENING: Strip whitespace from API key to prevent configuration errors
          OPENAI_API_KEY = (os.getenv("OPENAI_API_KEY") or "").strip()

          # When the key is missing, write only a short, safe message and exit 0
          if not OPENAI_API_KEY:
              msg = os.environ["DIAGNOSTIC_MSG"]
              with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
                  f.write(msg)
              print("AI summarizer skipped; diagnostic message written to RESPONSE_FILE.")
              sys.exit(0)

          # If key present: perform summarization
          from openai import OpenAI
          client = OpenAI(api_key=OPENAI_API_KEY)

          title = (os.getenv("ISSUE_TITLE") or "").strip()
          body  = (os.getenv("ISSUE_BODY") or "").strip()[:4000]
          review_state = (os.getenv("REVIEW_STATE") or "").strip()
          event_name = (os.getenv("EVENT_NAME") or "").strip()

          # BUG FIX 3: Make prompts generic to match the consolidated content variable
          # Since ISSUE_BODY now contains the correct content for all events,
          # we use generic prompts that work with any content type
          if event_name == "pull_request_review":
              prompt = textwrap.dedent(f"""
              Summarize this pull request review in one concise paragraph (neutral tone).
              Review state: {review_state}
              PR title: {title}
              Review content:
              {body}
              """)
          elif event_name == "issue_comment":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub comment in one concise paragraph (neutral tone).
              Thread title: {title}
              Comment content:
              {body}
              """)
          elif event_name == "pull_request":
              prompt = textwrap.dedent(f"""
              Summarize this pull request in one concise paragraph (neutral tone).
              PR title: {title}
              Description:
              {body}
              """)
          elif event_name == "issues":
              prompt = textwrap.dedent(f"""
              Summarize this GitHub issue in one concise paragraph (neutral tone).
              Issue title: {title}
              Description:
              {body}
              """)
          else:
              # Generic fallback for unexpected event types
              prompt = textwrap.dedent(f"""
              Summarize this GitHub event in one concise paragraph (neutral tone).
              Title: {title}
              Content:
              {body}
              """)

          # ARCHITECTURE: Enhanced error differentiation for operational clarity
          # Distinguishes quota/billing, rate limits, auth failures, and generic errors
          try:
              completion = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role":"user","content":prompt}],
                  max_tokens=160, temperature=0.2
              )
              summary = (completion.choices[0].message.content or "").strip()
          except Exception as e:
              error_str = str(e).lower()
              # Check for quota/billing errors (distinct from rate limits)
              if "insufficient_quota" in error_str or "billing details" in error_str or "exceeded your current quota" in error_str:
                  summary = "AI summarization unavailable: OpenAI quota/billing limit reached. Check plan/billing for the API key's org."
              # Check for rate limit errors (429 status)
              elif "429" in error_str or "rate_limit" in error_str:
                  summary = "AI summarization temporarily unavailable: OpenAI rate limit exceeded. Please try again later."
              # Check for authentication errors
              elif "401" in error_str or "invalid_api_key" in error_str or "incorrect api key" in error_str:
                  summary = "AI summarization failed: invalid OPENAI_API_KEY. Verify the secret value."
              else:
                  # Generic error message for other failures
                  summary = "AI summarization failed: an internal error occurred. See CI logs for details."
              # Log detailed error to stderr (visible in CI logs but not posted as comment)
              print("Detailed error (redacted for posting):", file=sys.stderr)
              print(repr(e), file=sys.stderr)

          # ARCHITECTURE: Add summary marker for comment update functionality
          # This allows us to update existing summaries instead of spamming new comments
          SUMMARY_MARKER = "<!-- ai-summarizer-summary -->"
          summary_with_marker = f"{summary}\n\n{SUMMARY_MARKER}"

          with open(RESPONSE_FILE, "w", encoding="utf-8") as f:
              f.write(summary_with_marker)
          print(f"Summary generated: {len(summary)} chars")
          PY

      - name: Post or update summary comment intelligently
        env:
          RESPONSE_FILE: ${{ runner.temp }}/issue_summary.txt
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          MARKER: ${{ env.DIAGNOSTIC_MARKER }}
        run: |
          set -euo pipefail

          # BUG FIX 2: Fixed diagnostic marker scope
          # Only skip duplicate diagnostics if THIS response contains the marker
          response_body="$(cat "$RESPONSE_FILE")"

          # If the response contains the diagnostic marker, check if we've already posted it
          if echo "$response_body" | grep -Fq "$MARKER"; then
            existing_comment_id=$(gh api \
              --method GET \
              "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
              | head -n 1)

            if [ -n "$existing_comment_id" ]; then
              echo "Diagnostic comment already exists (ID: $existing_comment_id). Skipping duplicate."
              exit 0
            fi
          fi

          # ARCHITECTURE: Intelligent comment update strategy
          # Try to find and update existing summary comment to reduce noise
          SUMMARY_MARKER="<!-- ai-summarizer-summary -->"

          # Check if response contains summary marker (not diagnostic)
          if echo "$response_body" | grep -Fq "$SUMMARY_MARKER"; then
            # Try to find existing summary comment
            existing_summary_id=$(gh api \
              --method GET \
              "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$SUMMARY_MARKER\")) | .id" \
              | head -n 1)

            if [ -n "$existing_summary_id" ]; then
              echo "Updating existing summary comment (ID: $existing_summary_id)"
              gh api \
                --method PATCH \
                "repos/$REPO/issues/comments/$existing_summary_id" \
                -f body="$response_body" || {
                echo "Update failed, posting new comment instead"
                gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$response_body"
              }
              exit 0
            fi
          fi

          # No existing comment found or not a summary - post new comment
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$response_body"
