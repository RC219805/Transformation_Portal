name: CI Quality Firewall (post-CI)

on:
  workflow_run:
    workflows: ["CI (Lint, Tests & Manifest)"]
    branches: [main, develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (SHA, branch, or tag)'
        required: false
        type: string
      force:
        description: 'Force run even if upstream CI failed'
        required: false
        type: boolean
        default: false

# CRITICAL: workflow_run uses github.event.workflow_run.head_sha, NOT github.sha
# Concurrency key must use head_branch, not ref (which is always 'main')
concurrency:
  group: ci-firewall-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION_LINT: "3.12"
  PYTHON_VERSION_TEST_MIN: "3.11"
  PYTHON_VERSION_TEST_MAX: "3.12"
  PYTHON_VERSION_ML: "3.11"

jobs:
  # PREFLIGHT: Resolve exact ref to test and skip if upstream failed
  preflight:
    name: Resolve Ref & Skip Logic
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      head_sha: ${{ steps.resolve-ref.outputs.head_sha }}
      head_branch: ${{ steps.resolve-ref.outputs.head_branch }}
    steps:
      - name: Check upstream CI result
        id: check
        run: |
          # For workflow_run: skip if upstream failed (unless forced)
          # For workflow_dispatch: always run
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            upstream_result="${{ github.event.workflow_run.conclusion }}"
            force_run="${{ github.event.inputs.force || 'false' }}"

            if [ "$upstream_result" != "success" ] && [ "$force_run" != "true" ]; then
              echo "Skipping: upstream CI $upstream_result (use workflow_dispatch with force=true to override)"
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "Running: upstream CI $upstream_result"
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Running: workflow_dispatch"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve exact ref
        id: resolve-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Use exact SHA from upstream workflow_run
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "head_branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            echo "Testing commit: ${{ github.event.workflow_run.head_sha }} (branch: ${{ github.event.workflow_run.head_branch }})"
          else
            # Use user-provided ref or current ref
            ref="${{ github.event.inputs.ref || github.sha }}"
            echo "head_sha=$ref" >> $GITHUB_OUTPUT
            echo "head_branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Testing commit: $ref (branch: ${{ github.ref_name }})"
          fi

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-lint.txt'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Lint with flake8 (critical errors)
        run: |
          # Stop build on syntax errors, undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (style warnings)
        continue-on-error: true
        run: |
          flake8 src/ tests/ --count --max-line-length=127 --statistics

      - name: Check formatting with black
        continue-on-error: true
        run: |
          black --check --line-length=127 src/ tests/

      - name: Check import sorting with isort
        continue-on-error: true
        run: |
          isort --check-only --profile=black --line-length=127 src/ tests/

  typecheck:
    name: Type Check
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The API whitelist imports pydantic; editable install uses --no-deps,
          # so install the same pinned runtime dependency as build.yml.
          pip install mypy types-PyYAML "pydantic==2.13.3"
          pip install -e . --no-deps

      - name: Type check with mypy (critical modules)
        # Advisory mirror of the canonical PR gate whitelist in build.yml.
        # Keep this list in sync with docs/ci/TYPE_CHECKING_POLICY.md.
        continue-on-error: true
        run: |
          mypy --config-file=mypy.ini \
            src/transformation_portal/api/ \
            src/transformation_portal/lux_depth_v3/ \
            src/transformation_portal/orchestrator/queue/ \
            src/transformation_portal/orchestrator/storage/ \
            src/transformation_portal/orchestrator/artifact_store/ \
            src/transformation_portal/core/geometry/ \
            src/transformation_portal/core/processing/ \
            src/transformation_portal/core/ml_dependency_health.py \
            src/transformation_portal/core/da3_runtime.py

  security:
    name: Security Scans
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          # Install from locked requirements file for deterministic, governed security tooling
          pip install -r requirements/security.txt

      - name: Run bandit security scan
        run: |
          # Generate JSON report for artifacts (may contain low-severity issues)
          bandit -r src/ -f json -o bandit-report.json --exit-zero
          # Fail on issues with severity >= LOW and confidence >= MEDIUM (Bandit flags: -ll -ii)
          bandit -r src/ -ll -ii -f screen

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          # Fail on known vulnerabilities (exit non-zero)
          pip-audit --desc -r requirements-ci.txt

      - name: Check for secrets with gitleaks
        run: |
          set -euo pipefail

          # Install only the gitleaks binary to avoid scanning extracted archive docs/examples.
          # SHA256 pinned to the upstream gitleaks_8.21.2_checksums.txt entry; rejecting a
          # mismatched download keeps a hijacked release asset out of the secret-scan path.
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          mv gitleaks "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          rm -f "${archive}"

          # Run gitleaks scan on repository
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" detect --config .gitleaks.toml --source . --verbose --no-git --exit-code 1 || {
            echo "⚠️  Secrets detected - review gitleaks output above"
            exit 1
          }

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: security-reports
          path: |
            bandit-report.json

  test-isolation:
    name: Validate Test Isolation (ADR-031)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION_TEST_MIN }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_TEST_MIN }}
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check ML test isolation (pre-commit hook)
        run: |
          # Pre-commit hook uses git diff --cached, so stage test files
          # In CI, no files are staged by default (working tree is clean)
          git add tests/ || true

          # Run pre-commit hook validation
          bash scripts/check_ml_test_isolation.sh

      - name: Verify core tests don't import ML dependencies
        run: |
          # Collect core tests and check for ML imports
          # This catches violations that escaped the pre-commit hook

          echo "🔍 Collecting core tests (without ML marker)..."
          CORE_TEST_OUTPUT=$(python -m pytest tests/ -m "not ml" --collect-only -q 2>&1 || true)

          echo "📋 Collection output:"
          echo "$CORE_TEST_OUTPUT"

          # Check for ML dependency imports in collection output
          if echo "$CORE_TEST_OUTPUT" | grep -qi "ModuleNotFoundError.*\(transformers\|torch\|diffusers\)"; then
            echo ""
            echo "❌ ERROR: Core tests attempted to import ML dependencies!"
            echo ""
            echo "Tests NOT marked with @pytest.mark.ml must not import:"
            echo "  - transformers"
            echo "  - torch (except via safe utilities)"
            echo "  - diffusers"
            echo "  - ML backend packages"
            echo ""
            echo "These dependencies are not installed in core CI environment."
            echo ""
            echo "See: docs/architecture/ADR-031-test-dependency-isolation.md"
            exit 1
          fi

          echo "✅ Core test isolation verified"

  validate-dependency-constraints:
    name: Validate Dependency Constraints (ADR-032)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION_TEST_MIN }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_TEST_MIN }}
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging
          python -m pip install "pip-tools==7.5.2"

      - name: Validate dependency constraints
        run: |
          echo "🔍 Validating dependency constraints (ADR-032)..."
          bash scripts/validate_dependency_constraints.sh --verbose
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "⚠️  Dependency constraints validation completed with warnings (non-blocking)."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "❌ Dependency constraints validation failed with exit code $status."
            exit "$status"
          fi

      - name: Validate requirements lock contract
        run: |
          set -euo pipefail
          python scripts/validation/check_requirements_lock_contract.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dependency-validation-report
          path: |
            requirements/*.in
            requirements/*.txt
          retention-days: 7

  validate-python-compatibility:
    name: Validate Python Resolution (ADR-032, py${{ matrix.python-version }})
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Resolver simulation for requirements-ci
        run: |
          echo "🔍 Simulating dependency resolution for Python ${{ matrix.python-version }}..."
          python -m pip install --upgrade pip
          python -m pip install --dry-run --report "resolver-report-py${{ matrix.python-version }}.json" -r requirements-ci.txt
          echo "✅ Resolution succeeded for Python ${{ matrix.python-version }}"

      - name: Upload resolver report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: resolver-report-py${{ matrix.python-version }}
          path: resolver-report-py${{ matrix.python-version }}.json
          retention-days: 7

  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    needs: [preflight, test-isolation, validate-dependency-constraints, validate-python-compatibility]
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-ci.txt
            requirements/tools-archive.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements/tools-archive.txt
          python -m pip install -e . --no-deps
          python -c "import numpy, pandas; print('archive tool deps OK')"

      - name: Verify test environment
        run: |
          python --version
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -m pytest --version

      - name: Run core tests (no ML / benchmark / stress)
        run: |
          mkdir -p test-results
          # ADR-044: Positive marker selection for core tests
          python -m pytest -v tests/ \
            -m "(unit or security or regression or golden or integration) and not ml and not slow and not benchmark and not stress" \
            --cov=src/transformation_portal \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --cov-config=pyproject.toml \
            --json-report \
            --json-report-file=test-results/core-py${{ matrix.python-version }}.json \
            --maxfail=3 \
            --tb=short
        env:
          PYTHONNOUSERSITE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-core-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          files: ./coverage.xml
          flags: core-tests
          name: core-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Rename coverage file for combining
        if: matrix.python-version == '3.12'
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.core-py${{ matrix.python-version }}
            echo "Coverage file renamed successfully"
            ls -la .coverage.core-py${{ matrix.python-version }}
          else
            echo "ERROR: .coverage file not found!"
            ls -la .coverage* || echo "No coverage files found"
            exit 1
          fi

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-core-py${{ matrix.python-version }}
          include-hidden-files: true
          path: |
            .coverage.core-py${{ matrix.python-version }}
            htmlcov/

  test-ml:
    name: ML Tests (Python 3.11)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Cache ML models
        id: cache-models
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cache/huggingface
            models
          key: ${{ runner.os }}-models-v4-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-models-v4-

      - name: Install ML test dependencies
        run: |
          bash scripts/ci/install_ml_test_dependencies.sh --include-rawpy
          df -h

      - name: Verify test environment
        run: |
          python --version
          python -c "import pytest; print('pytest', pytest.__version__)"
          python -m pytest --version

      - name: Run ML tests (exclude benchmark / stress)
        run: |
          mkdir -p test-results
          python -m pytest -v tests/ \
            -m "ml and not slow and not benchmark and not stress" \
            --cov=src/transformation_portal \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --json-report \
            --json-report-file=test-results/ml-py3.11.json \
            --durations=25 --durations-min=1.0 \
            --maxfail=3 \
            --tb=short
        env:
          PYTHONNOUSERSITE: 1
          # CRITICAL FIX: Only force offline mode if cache was restored
          # Prevents cold-cache failures on first run
          TRANSFORMERS_OFFLINE: ${{ steps.cache-models.outputs.cache-hit == 'true' && '1' || '0' }}
          HF_HUB_OFFLINE: ${{ steps.cache-models.outputs.cache-hit == 'true' && '1' || '0' }}
          # Prevent thread oversubscription on shared CI runners
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-ml-py3.11
          path: test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          files: ./coverage.xml
          flags: ml-tests
          name: ml-py3.11
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Rename coverage file for combining
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.ml-py3.11
            echo "Coverage file renamed successfully"
            ls -la .coverage.ml-py3.11
          else
            echo "ERROR: .coverage file not found!"
            ls -la .coverage* || echo "No coverage files found"
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-ml-py3.11
          include-hidden-files: true
          path: |
            .coverage.ml-py3.11

  coverage-gate:
    name: Coverage Quality Gate
    needs: [preflight, test-core, test-ml]
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Install coverage tools
        run: |
          pip install coverage

      - name: List and consolidate downloaded artifacts
        run: |
          echo "=== Downloaded coverage artifact structure ==="
          find coverage-artifacts -type f -name ".coverage*" || true
          echo ""
          echo "=== Moving coverage files to root ==="
          find coverage-artifacts -type f -name ".coverage*" -exec mv {} . \;
          echo ""
          echo "=== Files in root after consolidation ==="
          ls -la .coverage* 2>/dev/null || echo "ERROR: No .coverage files found after consolidation"

      - name: Combine coverage data
        run: |
          if ! ls .coverage* 1> /dev/null 2>&1; then
            echo "ERROR: No .coverage files found to combine"
            exit 1
          fi

          echo "=== Combining coverage files ==="
          ls -la .coverage*

          coverage combine --keep .coverage*
          echo "✓ Coverage files combined successfully"

          coverage xml
          echo "✓ coverage.xml generated"

          echo ""
          echo "=== Combined coverage report ==="
          coverage report

      - name: Check coverage thresholds
        run: |
          # Coverage floor: prevent regression below 25%
          # Note: diff-cover not applicable for workflow_run (no PR context)
          coverage report --fail-under=25

  build:
    name: Build & Package Check
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION_LINT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION_LINT }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Test wheel install
        run: |
          pip install dist/*.whl
          python -c "import transformation_portal; print(transformation_portal.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist-packages
          path: dist/

  repo-hygiene:
    name: Repository Hygiene
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Check for root clutter
        run: |
          marker_found=0
          for marker in DEFER MERGE ROLLBACK SUCCESS Continue SKIP INVESTIGATE "="; do
            if [ -e "$marker" ]; then
              echo "ERROR: Workflow marker file found: $marker"
              marker_found=1
            fi
          done
          if [ "$marker_found" -eq 1 ]; then
            exit 1
          fi

          if [ -e .coverage ] || [ -e coverage.json ]; then
            echo "ERROR: Coverage artifacts in root (should be gitignored)"
            exit 1
          fi

          markdown_count=$(find . -maxdepth 1 -name "*.md" -type f | wc -l)
          if [ "$markdown_count" -gt 15 ]; then
            echo "ERROR: Too many markdown files in root ($markdown_count). Maximum: 15"
            exit 1
          fi

      - name: Check for directories with spaces
        run: |
          if find . -type d -name "* *" | grep -v ".git" | grep .; then
            echo "ERROR: Directories with spaces found"
            exit 1
          fi

      - name: Check .gitignore coverage
        run: |
          patterns=(".coverage" ".coverage.*" "coverage.json" "htmlcov/" "*.pyc" "__pycache__/" "dist/" "*.egg-info")
          for pattern in "${patterns[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "WARNING: Pattern '$pattern' not in .gitignore"
            fi
          done

  flake-analysis:
    name: Flake Rate Analysis
    needs: [test-core, test-ml]
    if: always() && (needs.test-core.result == 'success' || needs.test-ml.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Locate previous flake ledger artifact on main
        id: find-ledger
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = "ci-quality-firewall.yml";

            try {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id,
                  branch: "main",
                  status: "completed",
                  per_page: 100
                },
                (response) => response.data?.workflow_runs ?? []
              );

              for (const run of runs) {
                if (!run || !run.id) continue;
                if (run.id === context.runId) continue;
                if (run.conclusion !== "success") continue;

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                });

                const artifactList = artifacts.data?.artifacts ?? [];
                const flakeLedger = artifactList.find(
                  (artifact) => artifact?.name === "flake-ledger" && !artifact?.expired
                );

                if (flakeLedger) {
                  core.info(`Found prior flake ledger in workflow run ${run.id}`);
                  core.setOutput("found", "true");
                  core.setOutput("run_id", String(run.id));
                  return;
                }
              }

              core.info("No prior flake-ledger artifact found on main; using repository baseline.");
              core.setOutput("found", "false");
            } catch (error) {
              core.warning(`Unable to query previous flake ledger artifacts: ${error?.message ?? error}`);
              core.setOutput("found", "false");
            }

      - name: Download previous flake ledger
        if: steps.find-ledger.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: flake-ledger
          run-id: ${{ steps.find-ledger.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-ledger

      - name: Restore previous flake ledger
        if: steps.find-ledger.outputs.found == 'true'
        run: |
          mkdir -p tests
          if [ -f previous-ledger/flake_ledger.json ]; then
            cp previous-ledger/flake_ledger.json tests/flake_ledger.json
            echo "✅ Restored flake ledger from previous-ledger/flake_ledger.json"
          elif [ -f previous-ledger/tests/flake_ledger.json ]; then
            cp previous-ledger/tests/flake_ledger.json tests/flake_ledger.json
            echo "✅ Restored flake ledger from previous-ledger/tests/flake_ledger.json"
          else
            echo "::warning::Previous flake ledger artifact did not include flake_ledger.json; using repository baseline."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install tracking script dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: test-results-*
          path: test-results/
          merge-multiple: true

      - name: Track flakes
        id: track
        continue-on-error: true
        run: |
          for report in test-results/*.json; do
            if [ -f "$report" ]; then
              echo "Processing $report..."
              python scripts/track_test_flakes.py "$report"
            fi
          done

      - name: Generate flake report
        if: always()
        run: |
          python scripts/analyze_flakes.py --format=markdown > flake-report.md
          python scripts/analyze_flakes.py --format=text

      - name: Upload flake ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: flake-ledger
          path: tests/flake_ledger.json
          retention-days: 30

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: flake-report
          path: flake-report.md
          retention-days: 30

      - name: Check flake threshold
        if: always()
        run: |
          # Extract repo-wide flake rate
          FLAKE_RATE=$(python scripts/analyze_flakes.py --format=json | python -c "import sys, json; print(json.load(sys.stdin).get('repo_flake_rate', 0.0))")
          THRESHOLD=0.01  # 1%

          echo "Repository flake rate: $FLAKE_RATE"
          echo "Threshold: $THRESHOLD"

          # Non-blocking for now - just report
          # Use Python for robust float comparison (handles empty/invalid values)
          if python3 -c "import sys; flake_rate = float('${FLAKE_RATE}' or '0.0'); threshold = float('${THRESHOLD}' or '0.01'); sys.exit(1 if flake_rate > threshold else 0)" 2>/dev/null; then
            echo "✅ Flake rate within threshold"
          else
            echo "::warning::Flake rate ($FLAKE_RATE) exceeds threshold ($THRESHOLD)"
          fi

  quality-summary:
    name: Quality Gate Summary
    needs: [preflight, lint, typecheck, security, validate-python-compatibility, test-core, test-ml, coverage-gate, build, repo-hygiene]
    runs-on: ubuntu-latest
    if: always() && needs.preflight.outputs.should_run == 'true'
    timeout-minutes: 5

    steps:
      - name: Check all gates passed
        run: |
          echo "Quality Gate Status:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Type Check: ${{ needs.typecheck.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo "  Python Resolution: ${{ needs.validate-python-compatibility.result }}"
          echo "  Core Tests: ${{ needs.test-core.result }}"
          echo "  ML Tests: ${{ needs.test-ml.result }}"
          echo "  Coverage Gate: ${{ needs.coverage-gate.result }}"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Repo Hygiene: ${{ needs.repo-hygiene.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.validate-python-compatibility.result }}" != "success" ] || \
             [ "${{ needs.test-core.result }}" != "success" ] || \
             [ "${{ needs.test-ml.result }}" != "success" ] || \
             [ "${{ needs.coverage-gate.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.repo-hygiene.result }}" != "success" ]; then
            echo "FAILED: Critical quality gates did not pass"
            exit 1
          fi

          echo "SUCCESS: All critical quality gates passed"
