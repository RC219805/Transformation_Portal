name: Architecture Hardening (Security + Guardrails)

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime deps (safe baseline)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lux_depth_v2/requirements-repo.txt
          python -m pip install pytest ruff bandit pip-audit

      - name: Dependency ban guard (basicsr/realesrgan/gfpgan)
        run: |
          python scripts/hardening/check_banned_deps.py

      - name: Unit tests (hardening layer only)
        run: |
          python -m pytest lux_depth_v2/tests/test_hardening_*.py -q

      - name: Ruff (new hardening layer only)
        run: |
          ruff check lux_depth_v2/hardening scripts/hardening

      - name: Bandit (new hardening layer only)
        run: |
          bandit -q -r lux_depth_v2/hardening scripts/hardening -ll

      - name: pip-audit (requirements file only)
        run: |
          # Audit only our managed dependencies from requirements-repo.txt
          # Excludes system packages (certifi, cryptography, etc.) that are
          # pre-installed in the GitHub Actions Ubuntu image.
          # TEMP ALLOWLIST (expires 2026-02-15): protobuf CVE-2026-0994 has no fixed version published yet.
          pip-audit -r lux_depth_v2/requirements-repo.txt --ignore-vuln CVE-2026-0994
