# .github/workflows/dependency-update.yml
# Phase 2: Automated Dependency Management
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"

      # Free up disk space before dependency operations
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true

          # Clean Docker
          sudo docker image prune --all --force || true
          sudo docker container prune --force || true

          # Clean apt cache
          sudo apt-get clean || true

          echo "Disk space after cleanup:"
          df -h

      - name: Install lock generation tools
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install "pip-tools==7.5.2"
          # Install pip-audit from governed security lockfile
          python -m pip install -r requirements/security.txt

      - name: Update dependencies
        env:
          PIP_NO_CACHE_DIR: "1"  # Disable pip caching to save disk space
        run: |
          set -euo pipefail

          if [ ! -d "requirements" ]; then
            echo "requirements/ directory not found"
            exit 1
          fi

          echo "Updating generic governed requirements with pip-compile..."
          cd requirements
          make update-generic LOCK_PYTHON_VERSION=3.11
          make check-generic LOCK_PYTHON_VERSION=3.11
          cd ..

      - name: Check lock ownership authority
        run: |
          set -euo pipefail

          changed_files_path="$(mktemp)"
          trap 'rm -f "${changed_files_path}"' EXIT

          git diff --name-only -- requirements > "${changed_files_path}"

          python3 scripts/validation/check_lock_ownership.py \
            --context ubuntu-x64-generic \
            --changed-files-file "${changed_files_path}"

          if grep -Eq '^requirements/ml-core-darwin-arm64.txt$' "${changed_files_path}"; then
            echo "ERROR: scheduled dependency automation must not modify target-owned ML locks."
            exit 1
          fi

      - name: Verify lockfile contract
        run: |
          python3 scripts/validation/check_requirements_lock_contract.py

      - name: Check for vulnerabilities
        run: |
          set -euo pipefail

          audit_reports_dir="${{ runner.temp }}/dependency-update-audit-reports"
          rm -rf "${audit_reports_dir}"
          mkdir -p "${audit_reports_dir}"
          audit_targets=(
            requirements/all.txt
            requirements/base.txt
            requirements/dev.txt
            requirements/ci.txt
            requirements/security.txt
            requirements/tools-archive.txt
          )

          for requirement_file in "${audit_targets[@]}"; do
            report_path="${audit_reports_dir}/$(basename "${requirement_file%.txt}").json"
            echo "Auditing ${requirement_file} -> ${report_path}"
            pip-audit \
              -r "${requirement_file}" \
              --format json \
              --output "${report_path}" || true
          done

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pip-audit-report
          path: ${{ runner.temp }}/dependency-update-audit-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (automated)"
          title: "🔄 Automated Dependency Updates"
          body: |
            ## 📦 Dependency Updates

            This PR contains automated dependency updates using the layered requirements system.

            ### 📁 Updated Files
            - `requirements/base.txt` - Core runtime dependencies
            - `requirements/dev.txt` - Development tools
            - `requirements/ci.txt` - CI/CD tools
            - `requirements/security.txt` - Governed security scanning toolchain
            - `requirements/tools-archive.txt` - Archive reporting toolchain
            - `requirements/all.txt` - Combined requirements

            ### 🎯 ML Layer Strategy
            scheduled automation updates generic locks only
            - `ml-core-darwin-arm64.txt` remains a manual Apple Silicon authoritative lane
            - retired Linux/macOS Intel ML lanes are not checked-in installable requirements
            - **ml-sam2.in** remains scripted-only and is not a standard checked-in lockfile

            ### 🔍 Security Report
            View the `pip-audit-report` artifact in the workflow run for vulnerability scan results.

            ### ⚠️ Review Required
            - [ ] Check for breaking changes
            - [ ] Review security report
            - [ ] Validate tests pass
            - [ ] Verify compatibility
            - [ ] Confirm target-owned ML lock contracts still match ADR-032 and `requirements/lock_ownership.yml`

            **Generated automatically by GitHub Actions**
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
