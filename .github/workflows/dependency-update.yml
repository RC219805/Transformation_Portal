# .github/workflows/dependency-update.yml
# Phase 2: Automated Dependency Management
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10.15"
          cache: 'pip'

      # Free up disk space before dependency operations
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true

          # Clean Docker
          sudo docker image prune --all --force || true
          sudo docker container prune --force || true

          # Clean apt cache
          sudo apt-get clean || true

          echo "Disk space after cleanup:"
          df -h

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Update dependencies
        env:
          PIP_NO_CACHE_DIR: "1"  # Disable pip caching to save disk space
          PIP_INDEX_URL: "https://download.pytorch.org/whl/cpu"  # Force CPU-only PyTorch
          PIP_EXTRA_INDEX_URL: "https://pypi.org/simple"  # Fallback to PyPI for non-torch packages
        run: |
          # Use the new layered requirements system
          if [ -d "requirements" ]; then
            echo "Updating layered requirements with pip-compile..."
            cd requirements

            # Update all requirements to latest versions within constraints
            make update || echo "Warning: Failed to update all requirements"

            cd ..
          else
            echo "Warning: requirements/ directory not found. Skipping update."
          fi

      - name: Check for vulnerabilities
        run: |
          python -m pip install -U safety==3.7.0
          # Use Safety 3.x scan (replaces deprecated check)
          # Scans requirements/all.txt as defined in .safety-policy.yml
          # Report-only scan: does not block PR merges (|| true)
          safety scan --output json > safety-report.json || true

      - name: Upload Security Report as Artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: safety-report
          path: safety-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks
        run: |
          # Run pre-commit on all files that changed
          pre-commit run --all-files || echo "Pre-commit warnings detected (non-blocking)"

      - name: Test Python 3.10 compatibility
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Validate dependency installation (Python 3.10)
        run: |
          echo "Testing installation with Python 3.10..."
          pip install -c requirements/constraints.txt -r requirements/base.txt
          pip install -c requirements/constraints.txt -r requirements/dev.txt
          python -c "import sys; print(f'✅ Python {sys.version} - base + dev installed successfully')"

      - name: Test Python 3.12 compatibility
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Validate Python 3.12 installation
        run: |
          echo "Testing installation with Python 3.12..."
          pip install -c requirements/constraints.txt -r requirements/base.txt
          pip install -c requirements/constraints.txt -r requirements/dev.txt
          python -c "import sys; print(f'✅ Python {sys.version} - base + dev installed successfully')"

      - name: Smoke test - YAML config parsing (ruamel-yaml)
        run: |
          echo "Testing YAML parsing with updated ruamel-yaml..."
          python -c "
          from ruamel.yaml import YAML
          yaml = YAML()
          # Test load/round-trip with sample config
          test_data = {'pipeline': {'name': 'test', 'version': '1.0'}}
          import io
          # Dump to string
          stream = io.StringIO()
          yaml.dump(test_data, stream)
          # Load from string (using getvalue() to get full content)
          yaml_str = stream.getvalue()
          loaded = yaml.load(yaml_str)
          assert loaded == test_data, 'YAML round-trip failed'
          print('✅ ruamel-yaml smoke test passed')
          "

      - name: Smoke test - Import checks
        run: |
          echo "Testing core imports..."
          python -c "
          import sys
          print(f'Python version: {sys.version}')

          # Test that backports-asyncio-runner is only installed on Python < 3.11
          import importlib.util
          has_asyncio_runner = importlib.util.find_spec('asyncio_runner') is not None

          if sys.version_info >= (3, 11):
              if has_asyncio_runner:
                  print('❌ ERROR: backports-asyncio-runner should NOT be installed on Python 3.11+')
                  sys.exit(1)
              else:
                  print('✅ backports-asyncio-runner correctly not installed on Python 3.11+')
          else:
              print(f'ℹ️  Python {sys.version_info.major}.{sys.version_info.minor} - backports check skipped')

          # Test core imports
          import numpy
          import PIL
          import yaml
          print('✅ Core imports successful')
          "

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (automated)"
          title: "🔄 Automated Dependency Updates"
          body: |
            ## 📦 Dependency Updates

            This PR contains automated dependency updates using the layered requirements system.

            ### 📁 Updated Files
            - `requirements/base.txt` - Core runtime dependencies
            - `requirements/ml.txt` - ML and deep learning packages
            - `requirements/dev.txt` - Development tools
            - `requirements/ci.txt` - CI/CD tools
            - `requirements/all.txt` - Combined requirements

            ### 🔍 Security Report
            Security scan results are available as a **workflow artifact** (not committed to the PR).
            Download the `safety-report` artifact from the workflow run to review vulnerability scan results.

            ### ✅ Automated Validation
            This PR has been automatically validated with:
            - ✅ Pre-commit checks
            - ✅ Python 3.10 installation test
            - ✅ Python 3.12 installation test
            - ✅ YAML config parsing (ruamel-yaml smoke test)
            - ✅ Core import checks (backports-asyncio-runner Python version gating)

            ### ⚠️ Manual Review Required
            - [ ] Check for breaking changes in updated packages
            - [ ] Review security report artifact for vulnerabilities
            - [ ] Validate CI tests pass on the PR
            - [ ] Test YAML-heavy workflows (pipeline configs, orchestrator settings)
            - [ ] Verify compatibility with production workloads

            **Generated automatically by GitHub Actions**
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
