# .github/workflows/dependency-update.yml
# Phase 2: Automated Dependency Management
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"

      # Free up disk space before dependency operations
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true

          # Clean Docker
          sudo docker image prune --all --force || true
          sudo docker container prune --force || true

          # Clean apt cache
          sudo apt-get clean || true

          echo "Disk space after cleanup:"
          df -h

      - name: Install lock generation tools
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install "pip-tools==7.5.2"
          # Install pip-audit from governed security lockfile
          python -m pip install -r requirements/security.txt

      - name: Update dependencies
        env:
          PIP_NO_CACHE_DIR: "1"  # Disable pip caching to save disk space
        run: |
          set -euo pipefail

          if [ ! -d "requirements" ]; then
            echo "requirements/ directory not found"
            exit 1
          fi

          echo "Updating generic and Linux x86_64 target-owned requirements with pip-compile..."
          cd requirements
          make update-generic LOCK_PYTHON_VERSION=3.11
          make check-generic LOCK_PYTHON_VERSION=3.11
          make update-ml-linux-x86_64 LOCK_PYTHON_VERSION=3.11
          make check-ml-linux-x86_64 LOCK_PYTHON_VERSION=3.11
          cd ..

      - name: Check lock ownership authority
        run: |
          set -euo pipefail

          changed_files_path="$(mktemp)"
          trap 'rm -f "${changed_files_path}"' EXIT

          git diff --name-only -- requirements > "${changed_files_path}"

          python3 scripts/validation/check_lock_ownership.py \
            --context ubuntu-x64-generic \
            --context ubuntu-x64-linux \
            --changed-files-file "${changed_files_path}"

          if grep -Eq '^requirements/ml-core-darwin-arm64.txt$|^requirements/ml-core-darwin-x86_64.txt$' "${changed_files_path}"; then
            echo "ERROR: scheduled dependency automation must not modify Darwin-owned or frozen ML locks."
            exit 1
          fi

      - name: Verify lockfile contract
        run: |
          python3 scripts/validation/check_requirements_lock_contract.py

      - name: Check for vulnerabilities
        run: |
          set -euo pipefail

          mkdir -p audit-reports
          audit_targets=(
            requirements/all.txt
            requirements/base.txt
            requirements/dev.txt
            requirements/ci.txt
            requirements/security.txt
            requirements/tools-archive.txt
            requirements/ml-core-linux.txt
          )

          # CVE-2026-4539 (pygments): No fix available yet - temporary exception
          for requirement_file in "${audit_targets[@]}"; do
            report_path="audit-reports/$(basename "${requirement_file%.txt}").json"
            echo "Auditing ${requirement_file} -> ${report_path}"
            pip-audit \
              --ignore-vuln CVE-2026-4539 \
              -r "${requirement_file}" \
              --format json \
              --output "${report_path}" || true
          done

      - name: Upload pip-audit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
        with:
          name: pip-audit-report
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (automated)"
          title: "🔄 Automated Dependency Updates"
          body: |
            ## 📦 Dependency Updates

            This PR contains automated dependency updates using the layered requirements system.

            ### 📁 Updated Files
            - `requirements/base.txt` - Core runtime dependencies
            - `requirements/dev.txt` - Development tools
            - `requirements/ci.txt` - CI/CD tools
            - `requirements/security.txt` - Governed security scanning toolchain
            - `requirements/tools-archive.txt` - Archive reporting toolchain
            - `requirements/all.txt` - Combined requirements
            - `requirements/ml-core-linux.txt` - Linux x86_64 ML core contract

            ### 🎯 ML Layer Strategy
            scheduled automation updates generic locks + `ml-core-linux.txt`
            - `ml-core-linux.txt` is the Linux x86_64 target-owned ML baseline
            - `ml-core-darwin-arm64.txt` is not updated by scheduled automation
            - `ml-core-darwin-x86_64.txt` is frozen pending an authoritative lane decision
            - **ml-sam2.in** remains scripted-only and is not a standard checked-in lockfile

            ### 🔍 Security Report
            View the `pip-audit-report` artifact in the workflow run for vulnerability scan results.

            ### ⚠️ Review Required
            - [ ] Check for breaking changes
            - [ ] Review security report
            - [ ] Validate tests pass
            - [ ] Verify compatibility
            - [ ] Confirm target-owned ML lock contracts still match ADR-032 and `requirements/lock_ownership.yml`

            **Generated automatically by GitHub Actions**
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
