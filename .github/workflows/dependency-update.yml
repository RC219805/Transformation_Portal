# .github/workflows/dependency-update.yml
# Phase 2: Automated Dependency Management
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Free up disk space before dependency operations
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true

          # Clean Docker
          sudo docker image prune --all --force || true
          sudo docker container prune --force || true

          # Clean apt cache
          sudo apt-get clean || true

          echo "Disk space after cleanup:"
          df -h

      - name: Install lock generation tools
        run: |
          python -m pip install --upgrade pip
          pip install "pip-tools==7.5.2"
          # Install pip-audit from governed security lockfile
          pip install -r requirements/security.txt

      - name: Update dependencies
        env:
          PIP_NO_CACHE_DIR: "1"  # Disable pip caching to save disk space
        run: |
          set -euo pipefail

          if [ ! -d "requirements" ]; then
            echo "requirements/ directory not found"
            exit 1
          fi

          echo "Updating layered requirements with pip-compile..."
          cd requirements
          make update LOCK_PYTHON_VERSION=3.11
          make check LOCK_PYTHON_VERSION=3.11
          cd ..

      - name: Verify lockfile contract
        run: |
          python3 scripts/validation/check_requirements_lock_contract.py

      - name: Check for vulnerabilities
        run: |
          # Check all requirement files for vulnerabilities using governed pip-audit
          # CVE-2026-4539 (pygments): No fix available yet - temporary exception
          pip-audit --ignore-vuln CVE-2026-4539 -r requirements/all.txt --format json --output audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
        with:
          name: pip-audit-report
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (automated)"
          title: "🔄 Automated Dependency Updates"
          body: |
            ## 📦 Dependency Updates

            This PR contains automated dependency updates using the layered requirements system.

            ### 📁 Updated Files
            - `requirements/base.txt` - Core runtime dependencies
            - `requirements/ml.txt` - ML umbrella (all ML capabilities)
            - `requirements/ml-core.txt` - ML core layer (cross-platform baseline)
            - `requirements/ml-raw.txt` - ML RAW ingest layer
            - `requirements/ml-coreml.txt` - ML CoreML layer (macOS)
            - `requirements/ml-research.txt` - ML research/experimental layer
            - `requirements/dev.txt` - Development tools
            - `requirements/ci.txt` - CI/CD tools
            - `requirements/all.txt` - Combined requirements

            ### 🎯 ML Layer Strategy
            ML dependencies are now organized into capability layers:
            - **ml-core**: Cross-platform ML baseline (torch, diffusers, transformers)
            - **ml-raw**: RAW camera file ingest (rawpy)
            - **ml-sam2**: SAM2 segmentation backend (scripted install only - not compiled)
            - **ml-coreml**: Apple CoreML acceleration (macOS only)
            - **ml-research**: Reserved for experimental features

            ### 🔍 Security Report
            View the `pip-audit-report` artifact in the workflow run for vulnerability scan results.

            ### ⚠️ Review Required
            - [ ] Check for breaking changes
            - [ ] Review security report
            - [ ] Validate tests pass
            - [ ] Verify compatibility
            - [ ] Confirm ML layer contracts (CPU-only PyTorch in ml-core.txt, ml.txt)

            **Generated automatically by GitHub Actions**
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
