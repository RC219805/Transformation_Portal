# .github/workflows/dependency-update.yml
# Phase 2: Automated Dependency Management
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Free up disk space before dependency operations
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove large unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          
          # Clean Docker
          sudo docker image prune --all --force || true
          sudo docker container prune --force || true
          
          # Clean apt cache
          sudo apt-get clean || true
          
          echo "Disk space after cleanup:"
          df -h

      - name: Install pip-tools
        run: |
          pip install pip-tools

      - name: Update dependencies
        env:
          PIP_NO_CACHE_DIR: "1"  # Disable pip caching to save disk space
        run: |
          # Note: This repository manages dependencies directly in requirements.txt files
          # If .in files exist, compile them; otherwise skip this step
          if [ -f "requirements.in" ]; then
            pip-compile requirements.in -o requirements.txt --upgrade || echo "Warning: Failed to compile requirements.txt"
          fi
          
          if [ -f "requirements-dev.in" ]; then
            pip-compile requirements-dev.in -o requirements-dev.txt --upgrade || echo "Warning: Failed to compile requirements-dev.txt"
          fi
          
          if [ -f "requirements-ci.in" ]; then
            pip-compile requirements-ci.in -o requirements-ci.txt --upgrade || echo "Warning: Failed to compile requirements-ci.txt"
          fi
          
          # If no .in files exist, check for dependency updates differently
          if [ ! -f "requirements.in" ] && [ ! -f "requirements-dev.in" ] && [ ! -f "requirements-ci.in" ]; then
            echo "No .in files found. Skipping pip-compile."
            echo "This repository manages dependencies directly in pyproject.toml and requirements.txt files."
          fi

      - name: Check for vulnerabilities
        run: |
          pip install safety
          safety check -r requirements.txt --json > safety-report.json || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (automated)"
          title: "🔄 Automated Dependency Updates"
          body: |
            ## 📦 Dependency Updates

            This PR contains automated dependency updates from pip-compile.

            ### 🔍 Security Report
            See attached safety-report.json for vulnerability scan results.

            ### ⚠️ Review Required
            - [ ] Check for breaking changes
            - [ ] Review security report
            - [ ] Validate tests pass
            - [ ] Verify compatibility

            **Generated automatically by GitHub Actions**
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
