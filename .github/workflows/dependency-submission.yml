name: Dependency Submission

# This workflow submits dependencies to GitHub's dependency graph.
# It includes aggressive disk space management to handle large ML dependencies
# and overrides GitHub's automatic dependency submission.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  # Allow manual triggers for testing
  workflow_dispatch:

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-pypi:
    name: Submit Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to submit dependencies to the dependency graph

    steps:
      - name: Maximize available disk space
        run: |
          echo "=== Initial disk usage ==="
          df -h
          echo ""

          echo "Removing unnecessary tools and libraries..."
          # Aggressive cleanup - free up a lot of disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/sqlpackage

          echo "Cleaning package manager caches..."
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y

          echo "Cleaning Docker..."
          docker system prune -af --volumes || true
          sudo rm -rf /var/lib/docker || true

          echo "Cleaning temporary directories..."
          sudo rm -rf /tmp/* || true
          sudo rm -rf /var/tmp/* || true

          echo "Cleaning pip cache..."
          rm -rf ~/.cache/pip || true

          echo ""
          echo "=== Disk usage after cleanup ==="
          df -h
          echo ""
          echo "Available space: $(df -h / | awk 'NR==2 {print $4}')"

      - name: Checkout repository (attempt 1)
        id: checkout_attempt_1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Shallow clone to save space
          fetch-depth: 1

      - name: Checkout repository (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Enforce checkout success
        if: steps.checkout_attempt_1.outcome == 'failure' && steps.checkout_attempt_2.outcome == 'failure'
        run: |
          echo "Repository checkout failed after two attempts."
          echo "This is often a transient GitHub fetch/API issue; retry the workflow."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Configure pip for minimal disk usage
        run: |
          echo "Configuring pip for space efficiency..."

          # Upgrade pip without cache
          python -m pip install --upgrade pip --no-cache-dir

          # Install only pip-tools (minimal dependency, if needed later)
          pip install --no-cache-dir "pip-tools<8"

          echo ""
          echo "=== Disk usage after pip setup ==="
          df -h
          echo ""

      - name: Validate requirements files
        run: |
          echo "Validating requirements files..."

          if [ -f "requirements.txt" ]; then
            echo "✓ requirements.txt exists ($(wc -l < requirements.txt) lines)"
          fi

          if [ -d "requirements/" ]; then
            echo "✓ requirements/ directory exists"
            ls -lh requirements/*.txt 2>/dev/null || true
          fi

          if [ -f "pyproject.toml" ]; then
            echo "✓ pyproject.toml exists"
          fi

      - name: Cache Python dependencies metadata (not packages)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/pip/http
          key: ${{ runner.os }}-pip-metadata-${{ hashFiles('requirements*.txt', 'requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-metadata-

      - name: Submit dependencies to GitHub (attempt 1)
        id: dependency_submission_attempt_1
        uses: advanced-security/component-detection-dependency-submission-action@323c31e9ce03ff590dca3d2e24bf4a7e11c42872 # v2
        env:
          # Critical: Disable pip caching to save disk space
          PIP_NO_CACHE_DIR: '1'
          # Skip downloading full packages when possible
          GH_DEPENDENCY_SUBMISSION_SKIP_CACHE: 'true'
          # Set temporary directory with more space
          TMPDIR: '/tmp'
          # Limit pip's download retries to fail faster
          PIP_RETRIES: '2'
          # Don't build wheels from source (saves space)
          PIP_NO_BUILD_ISOLATION: '1'
        with:
          # Process from repository root
          filePath: '.'
          # Scan for Python dependencies
          detectorsCategories: 'Pip'
          # Exclude directories that don't contain dependencies
          directoryExclusionList: '.git,node_modules,deprecated,archive,tests,docs,examples,.pytest_cache,__pycache__,.tox,.mypy_cache'
        continue-on-error: true

      - name: Submit dependencies to GitHub (attempt 2)
        id: dependency_submission_attempt_2
        if: steps.dependency_submission_attempt_1.outcome == 'failure'
        uses: advanced-security/component-detection-dependency-submission-action@323c31e9ce03ff590dca3d2e24bf4a7e11c42872 # v2
        env:
          # Critical: Disable pip caching to save disk space
          PIP_NO_CACHE_DIR: '1'
          # Skip downloading full packages when possible
          GH_DEPENDENCY_SUBMISSION_SKIP_CACHE: 'true'
          # Set temporary directory with more space
          TMPDIR: '/tmp'
          # Limit pip's download retries to fail faster
          PIP_RETRIES: '2'
          # Don't build wheels from source (saves space)
          PIP_NO_BUILD_ISOLATION: '1'
        with:
          # Process from repository root
          filePath: '.'
          # Scan for Python dependencies
          detectorsCategories: 'Pip'
          # Exclude directories that don't contain dependencies
          directoryExclusionList: '.git,node_modules,deprecated,archive,tests,docs,examples,.pytest_cache,__pycache__,.tox,.mypy_cache'
        continue-on-error: true

      - name: Handle dependency submission result
        if: steps.dependency_submission_attempt_1.outcome == 'failure' && steps.dependency_submission_attempt_2.outcome == 'failure'
        run: |
          echo "::warning::Dependency submission failed after two attempts."
          echo ""
          echo "This is typically caused by a transient GitHub API issue and does not"
          echo "indicate a problem with the code or dependencies themselves."
          echo ""
          echo "The dependency graph update will be retried on the next push or can be"
          echo "manually triggered via workflow_dispatch."
          echo ""
          echo "This workflow is intentionally non-blocking to avoid failing PRs due to"
          echo "GitHub infrastructure issues outside the repository's control."
          # Exit with success to not block PRs due to transient GitHub API errors
          exit 0

      - name: Cleanup after submission
        if: always()
        run: |
          echo "Cleaning up temporary files..."

          # Purge all pip caches
          pip cache purge || true
          rm -rf ~/.cache/pip || true

          # Clean build artifacts
          rm -rf build/ dist/ ./*.egg-info || true

          # Clean Python cache
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true

          # Clean temp
          sudo rm -rf /tmp/* || true

          echo ""
          echo "=== Final disk usage ==="
          df -h
          echo ""
          echo "Dependency submission cleanup completed."

      - name: Report submission status
        if: always()
        run: |
          attempt1="${{ steps.dependency_submission_attempt_1.outcome }}"
          attempt2="${{ steps.dependency_submission_attempt_2.outcome }}"

          if [ "$attempt1" = "success" ] || [ "$attempt2" = "success" ]; then
            echo "✅ Dependency submission completed successfully."
          else
            echo "::warning::⚠️ Dependency submission encountered issues (non-blocking)"
            echo ""
            echo "Both submission attempts did not succeed:"
            echo "  - Attempt 1: $attempt1"
            echo "  - Attempt 2: $attempt2"
            echo ""
            echo "This is typically caused by:"
            echo "  1. Transient GitHub API errors (most common)"
            echo "  2. Network timeouts"
            echo "  3. GitHub infrastructure issues"
            echo ""
            echo "No action required - dependency graph updates are non-critical"
            echo "and will be retried on the next push."
          fi
