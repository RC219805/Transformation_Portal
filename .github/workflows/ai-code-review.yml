name: AI Code Review (Enhanced v3.0)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  ai-review:
    name: AI-Powered Code Review (GPT-4o Enhanced)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RESPONSE_FILE: ${{ runner.temp }}/ai_review.txt

    steps:
      - name: Check API Key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "❌ OPENAI_API_KEY is not set. Skipping AI code review."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v47
        with:
          files: "**/*.{py,js,ts,jsx,tsx,md,json,yml,yaml}"

      - name: Set up Python
        if: steps.changes.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          pip install --upgrade pip
          pip install openai requests

      - name: Run Enhanced AI Code Review
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          python << 'PY'
          import os
          import sys
          import json
          import random
          import requests
          import time
          from datetime import datetime
          from openai import OpenAI

          api_key = os.getenv("OPENAI_API_KEY", "").strip()
          gh_token = os.getenv("GH_TOKEN")
          pr_number = os.getenv("PR_NUMBER")
          repo = os.getenv("REPO")
          out_file = os.getenv("RESPONSE_FILE")

          if not api_key:
              print("No OPENAI_API_KEY provided; skipping.")
              sys.exit(0)

          client = OpenAI(api_key=api_key)

          headers = {
              "Authorization": f"token {gh_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # --- Fetch PR files ---------------------------------------------------
          files_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          print(f"📥 Fetching file list from {files_url}")
          r = requests.get(files_url, headers=headers)

          if r.status_code != 200:
              print("GitHub API error fetching PR files:", r.status_code, r.text)
              sys.exit(1)

          all_files = r.json()

          # Filter allowable extensions
          allow = {".py", ".js", ".ts", ".jsx", ".tsx", ".yml", ".yaml", ".json", ".md"}
          code_files = [f for f in all_files if any(f["filename"].endswith(ext) for ext in allow)]

          if not code_files:
              print("No reviewable code files found.")
              sys.exit(0)

          # Build changes text and stats
          changes_text = ""
          total_additions = 0
          total_deletions = 0

          for f in code_files[:15]:  # Limit to 15 files to avoid token limits
              filename = f.get("filename", "unknown")
              patch = f.get("patch", "")
              additions = f.get("additions", 0)
              deletions = f.get("deletions", 0)
              total_additions += additions
              total_deletions += deletions

              changes_text += f"\n{'='*80}\n"
              changes_text += f"File: {filename}\n"
              changes_text += f"Changes: +{additions} -{deletions}\n"
              changes_text += f"{'='*80}\n"
              changes_text += patch + "\n"

          if len(code_files) > 15:
              changes_text += f"\n... and {len(code_files) - 15} more files\n"

          # Enhanced system prompt for GPT-4o
          system_prompt = """You are an expert code reviewer with deep knowledge of software engineering best practices, security, performance optimization, and architectural patterns.

          Analyze the code changes with a focus on:

          **1. SECURITY ANALYSIS** 🔒
          - Identify potential vulnerabilities (injection attacks, XSS, authentication issues, etc.)
          - Check for hardcoded secrets or sensitive data exposure
          - Verify input validation and sanitization
          - Assess authorization and access control

          **2. CODE QUALITY** ✨
          - Evaluate code structure and organization
          - Check naming conventions and readability
          - Assess adherence to language-specific best practices
          - Identify code smells and anti-patterns

          **3. PERFORMANCE** ⚡
          - Detect potential bottlenecks or inefficiencies
          - Identify N+1 query problems and unnecessary loops
          - Check resource management (memory, file handles, connections)
          - Suggest optimization opportunities

          **4. BUGS & ISSUES** 🐛
          - Identify logic errors or edge cases
          - Check error handling and resilience
          - Verify null/undefined safety
          - Look for race conditions or concurrency issues

          **5. ARCHITECTURE & DESIGN** 🏗️
          - Evaluate design patterns and architectural decisions
          - Check modularity and separation of concerns
          - Assess scalability and maintainability
          - Identify tight coupling or architectural violations

          **6. TESTING** 🧪
          - Suggest test coverage improvements
          - Identify untested edge cases
          - Recommend test types (unit, integration, e2e)

          **7. AUTO-FIX SUGGESTIONS** 🔧
          - Provide specific code snippets for fixes
          - Include confidence scores (Low/Medium/High)
          - Prioritize suggestions by impact

          **OUTPUT FORMAT:**

          Use this structured format:

          ## 📊 Review Summary
          [Brief 2-3 sentence overview]

          ## 🔒 Security Analysis
          [Security findings or ✅ No security concerns]

          ## ⚡ Performance Impact
          [Performance assessment]

          ## 🐛 Potential Issues
          [List of bugs/issues or ✅ No issues detected]

          ## ✨ Code Quality
          [Quality assessment and suggestions]

          ## 🏗️ Architecture & Design
          [High-level architectural feedback]

          ## 🧪 Testing
          [Testing gaps and suggestions]

          ## 🔧 Auto-Fix Suggestions
          [Specific code fixes with confidence scores]

          ## 📈 Metrics
          - Complexity: [Low/Medium/High]
          - Risk Level: [Low/Medium/High]
          - Review Confidence: [0-100%]

          Be thorough but concise. If code is excellent, say so clearly. Focus on actionable, high-impact feedback."""

          user_prompt = f"""Review these code changes from PR #{pr_number}:

          **Change Statistics:**
          - Files changed: {len(code_files)}
          - Lines added: +{total_additions}
          - Lines removed: -{total_deletions}

          **Code Changes:**
          {changes_text}

          Provide a comprehensive, structured code review following the format specified in the system prompt."""

          print("🤖 Requesting enhanced AI review from GPT-4o...")

          def call_openai_with_retries(client, messages, model="gpt-4o", max_retries=6, **kwargs):
              for attempt in range(1, max_retries + 1):
                  try:
                      return client.chat.completions.create(
                          model=model,
                          messages=messages,
                          **kwargs
                      )
                  except Exception as e:
                      err_str = str(e)
                      status_is_429 = False
                      status = getattr(e, "status_code", None) or getattr(e, "http_status", None) or getattr(e, "status", None)
                      if status == 429:
                          status_is_429 = True
                      if "429" in err_str or "Rate limit" in err_str or "RateLimit" in err_str:
                          status_is_429 = True

                      if status_is_429 and attempt < max_retries:
                          base_wait = min(90, 2 ** attempt)
                          jitter = random.uniform(0.5, 1.5)
                          wait = base_wait * jitter
                          print(f"⚠️ Rate limited by OpenAI (attempt {attempt}/{max_retries}). Waiting {wait:.1f}s...")
                          time.sleep(wait)
                          continue

                      if attempt < max_retries:
                          wait = min(30, 2 ** (attempt - 1))
                          print(f"⚠️ Request failed (attempt {attempt}/{max_retries}): {str(e)[:100]}. Retrying in {wait}s...")
                          time.sleep(wait)
                          continue

                      raise

          messages = [
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": user_prompt}
          ]

          try:
              response = call_openai_with_retries(
                  client,
                  messages,
                  model="gpt-4o",
                  max_retries=6,
                  max_tokens=2500,
                  temperature=0.2,
              )

              if response and hasattr(response, "choices") and len(response.choices) > 0:
                  try:
                      review_text = response.choices[0].message.content
                  except Exception:
                      review_text = getattr(response.choices[0], "text", None) or str(response)
              else:
                  print("⚠️ OpenAI returned unexpected response structure.")
                  review_text = "⚠️ AI review unavailable: unexpected response format."
          except Exception as e:
              print(f"⚠️ OpenAI request failed after all retries: {str(e)}")
              review_text = (
                  "⚠️ **AI Review Unavailable**\n\n"
                  "The AI code review service encountered errors after multiple retry attempts.\n\n"
                  f"**Error (truncated):** `{str(e)[:200]}`\n\n"
                  "**Action Required:** Please review the code manually or retry the workflow."
              )

          timestamp = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
          enhanced_review = f"""## 🤖 AI Code Review (Enhanced v3.0)

          **Powered by:** GPT-4o  
          **Review Time:** {timestamp}  
          **PR:** #{pr_number}

          {review_text}

          ---

          *This review was generated by an AI system. While comprehensive, it should complement, not replace, human code review.*  
          *AI Agent Version: 3.0 | Model: GPT-4o | Enhanced Security & Performance Analysis*
          """

          # Post comment on PR
          comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          comment_data = {"body": enhanced_review}

          try:
              post_response = requests.post(comment_url, headers=headers, json=comment_data)
              if post_response.status_code == 201:
                  print("✅ AI review posted successfully!")
              else:
                  print(f"⚠️ Failed to post comment: {post_response.status_code}")
                  print(post_response.text)
          except Exception as e:
              print(f"⚠️ Exception while posting review comment: {str(e)}")

          # Write review to file for log visibility
          try:
              if out_file:
                  with open(out_file, "w", encoding="utf-8") as f:
                      f.write(enhanced_review)
          except Exception as e:
              print(f"⚠️ Failed to write review to file: {str(e)}")

          PY

      - name: Display Review
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "📄 AI review completed. Summary:"
          if [ -f "$RESPONSE_FILE" ]; then
            echo "----------------------------------------"
            cat "$RESPONSE_FILE"
            echo "----------------------------------------"
          else:
            echo "No review file found (comment should still be on the PR)."

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🧠 Enhanced AI Code Review Completed (v3.0)"
          echo "  🚀 Powered by GPT-4o"
          echo "  ✨ Security, Performance & Quality Analysis"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"