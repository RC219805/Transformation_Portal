name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI-Powered Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:

      - name: Check API Key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "❌ OPENAI_API_KEY is not set. Skipping AI code review."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v46
        with:
          files: "**/*.{py,js,ts,jsx,tsx,md,json,yml,yaml}"

      - name: Set up Python
        if: steps.changes.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          pip install --upgrade pip
          pip install openai requests
      
      - name: Run AI Code Review
        if: steps.changes.outputs.any_changed == 'true'
        env:
          RESPONSE_FILE: ${{ runner.temp }}/ai_review.txt
        run: |
          python << 'PY'

          import os
          import sys
          import time
          import json
          import random
          import requests
          from openai import OpenAI

          api_key = os.getenv("OPENAI_API_KEY", "").strip()
          gh_token = os.getenv("GH_TOKEN")
          pr_number = os.getenv("PR_NUMBER")
          repo = os.getenv("REPO")
          out_file = os.getenv("RESPONSE_FILE")

          if not api_key:
              print("No OPENAI_API_KEY provided; skipping.")
              sys.exit(0)

          client = OpenAI(api_key=api_key)

          headers = {
              "Authorization": f"token {gh_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # --- Fetch PR files ---------------------------------------------------
          files_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          print(f"Fetching file list from {files_url}")
          r = requests.get(files_url, headers=headers)

          if r.status_code != 200:
              print("GitHub API error fetching PR files:", r.status_code, r.text)
              sys.exit(1)

          all_files = r.json()

          # Filter allowable extensions
          allow = {".py", ".js", ".ts", ".jsx", ".tsx", ".yml", ".yaml", ".json", ".md"}
          code_files = [f for f in all_files if any(f["filename"].endswith(ext) for ext in allow)]

          if not code_files:
              print("No relevant code files changed.")
              sys.exit(0)

          print(f"{len(code_files)} relevant files detected.")

          # Limit file count to avoid runaway cost
          code_files = code_files[:10]

          patches = []
          for f in code_files:
              patch = f.get("patch")
              if patch:
                  # Patch truncate for safety (GitHub can return massive diffs)
                  patches.append(
                      f"File: {f['filename']}\n```diff\n{patch[:5000]}\n```"
                  )

          if not patches:
              print("No patch content found to review.")
              sys.exit(0)

          diff_text = "\n\n".join(patches)

          # --- AI Prompt -------------------------------------------------------
          system_prompt = """
          You are a senior software engineer performing a concise code review.
          Provide:
          - 🔍 High-value observations only
          - 🐛 Potential bugs (if any)
          - ⚠️ Risk areas
          - 🔒 Security issues
          - ⚡ Performance improvements
          - 💡 Best practices

          Avoid nitpicks. Avoid minor styling. Be helpful & to the point.
          """

          user_prompt = f"""
          Review the following code changes and produce a clear, actionable summary:

          {diff_text}
          """

          print("Requesting AI review...")

          # --- Retry wrapper ---------------------------------------------------
          def call_with_retries():
              delay = 1
              for attempt in range(6):
                  try:
                      return client.chat.completions.create(
                          model="gpt-4o-mini",
                          messages=[
                              {"role": "system", "content": system_prompt},
                              {"role": "user", "content": user_prompt},
                          ],
                          max_tokens=800,
                          temperature=0.2,
                      )
                  except Exception as e:
                      print(f"Attempt {attempt+1} failed:", e)
                      time.sleep(delay + random.random())
                      delay *= 2
              return None

          result = call_with_retries()

          if not result or not result.choices:
              review_text = "AI review failed: no response from model."
          else:
              review_text = result.choices[0].message.content.strip()

          with open(out_file, "w", encoding="utf-8") as f:
              f.write(review_text)

          PY

      - name: Post Review Comment
        if: steps.changes.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPO: ${{ env.REPO }}
          RESPONSE_FILE: ${{ runner.temp }}/ai_review.txt
        run: |
          if [ ! -s "$RESPONSE_FILE" ]; then
            echo "Review empty or missing."
            exit 0
          fi

          echo "Posting AI review to PR #${PR_NUMBER}"

          BODY=$(cat "$RESPONSE_FILE")
          COMMENT="## 🤖 AI Code Review

${BODY}

---

*Automated review — human verification recommended.*"

          gh api repos/${REPO}/issues/${PR_NUMBER}/comments \
            -f body="${COMMENT}"

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🧠 AI Code Review Completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
