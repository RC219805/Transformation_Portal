name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

# Concurrency control: Cancel outdated runs on new pushes to the same PR
# This reduces CI minutes and API costs by only reviewing the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Advisory / Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check API Key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "❌ OPENAI_API_KEY is not set. Skipping AI code review."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: "**/*.{py,js,ts,jsx,tsx,md,json,yml,yaml}"

      - name: Set up Python
        if: steps.changes.outputs.any_changed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          pip install --upgrade pip
          pip install requests==2.32.5

      - name: Run AI Code Review
        if: steps.changes.outputs.any_changed == 'true'
        timeout-minutes: 4
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          GH_TOKEN: ${{ env.GH_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPO: ${{ env.REPO }}
          RESPONSE_FILE: ${{ runner.temp }}/ai_review.txt
        run: |
          python << 'PY'
          import os
          import sys
          import json
          import random
          import requests
          import time

          api_key = os.getenv("OPENAI_API_KEY", "").strip()
          gh_token = os.getenv("GH_TOKEN")
          pr_number = os.getenv("PR_NUMBER")
          repo = os.getenv("REPO")
          out_file = os.getenv("RESPONSE_FILE")

          if not api_key:
              print("No OPENAI_API_KEY provided; skipping.")
              sys.exit(0)

          headers = {
              "Authorization": f"token {gh_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # --- Fetch PR files with pagination -----------------------------------
          # GitHub paginates the /pulls/{pr}/files endpoint (max 100 per page).
          # We must follow Link headers to get all files for large PRs.
          def fetch_all_pr_files(repo, pr_number, headers):
              """Fetch all PR files, handling GitHub pagination.

              Uses per_page=100 (GitHub's maximum) to minimize API calls.
              """
              all_files = []
              url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100"

              while url:
                  print(f"Fetching: {url}")
                  r = requests.get(url, headers=headers, timeout=20)

                  if r.status_code != 200:
                      print(f"GitHub API error fetching PR files: {r.status_code} {r.text}")
                      return None

                  all_files.extend(r.json())

                  # Check for next page in Link header
                  link_header = r.headers.get("Link", "")
                  url = None
                  for link in link_header.split(","):
                      if 'rel="next"' in link:
                          # Extract URL from <url>; rel="next"
                          url = link.split(";")[0].strip().strip("<>")
                          break

              return all_files

          print(f"Fetching PR #{pr_number} files from {repo}")
          all_files = fetch_all_pr_files(repo, pr_number, headers)

          if all_files is None:
              sys.exit(1)

          print(f"Total files in PR: {len(all_files)}")

          # Filter allowable extensions
          allow = {".py", ".js", ".ts", ".jsx", ".tsx", ".yml", ".yaml", ".json", ".md"}
          code_files = [f for f in all_files if any(f["filename"].endswith(ext) for ext in allow)]

          if not code_files:
              print("No relevant code files changed.")
              sys.exit(0)

          print(f"Relevant code files: {len(code_files)}")

          # Build diff text (limit to first 10 files to stay within token limits)
          changes_text = ""
          for f in code_files[:10]:
              changes_text += f"\n### {f['filename']}\n"
              if "patch" in f and f["patch"]:
                  changes_text += f["patch"][:2000]  # Limit patch size

          system_prompt = """You are an expert code reviewer. Review the code changes and provide:
          1. Code quality assessment (concise)
          2. Potential bugs or issues (if any)
          3. Security concerns (if any)
          4. Performance improvements (if applicable)
          5. Best practice suggestions (if needed)

          Be concise and actionable. Focus on meaningful feedback.
          If the code looks good, say so briefly. Don't nitpick minor style issues."""

          user_prompt = f"""Review these code changes:

          {changes_text}

          Provide a brief, actionable code review."""

          # Use retry logic with exponential backoff + jitter for rate-limit / transient errors.
          print("🤖 Requesting AI review from GPT-4o-mini with retry logic...")

          def get_openai_error(response):
              try:
                  data = response.json()
              except ValueError:
                  return {}

              error = data.get("error", {}) if isinstance(data, dict) else {}
              return error if isinstance(error, dict) else {}

          def call_openai_with_retries(api_key, messages, model="gpt-4o-mini", max_retries=6, **kwargs):
              openai_headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              }
              for attempt in range(1, max_retries + 1):
                  payload = {
                      "model": model,
                      "messages": messages,
                      "max_tokens": 1000,
                      "temperature": 0.3,
                  }
                  payload.update(kwargs)
                  try:
                      response = requests.post(
                          "https://api.openai.com/v1/chat/completions",
                          headers=openai_headers,
                          json=payload,
                          timeout=45,
                      )
                  except requests.RequestException as e:
                      if attempt < max_retries:
                          base_wait = min(60, 2 ** attempt)
                          jitter = random.uniform(0.5, 1.5)
                          wait = base_wait * jitter
                          print(f"⚠️ OpenAI network error (attempt {attempt}/{max_retries}). Waiting {wait:.1f}s before retrying...")
                          time.sleep(wait)
                          continue
                      raise RuntimeError("OpenAI request failed after retries") from e

                  if response.status_code == 429:
                      error = get_openai_error(response)
                      error_code = error.get("code")
                      error_type = error.get("type")
                      error_message = error.get("message", response.text)
                      non_retryable_429_codes = {"insufficient_quota"}

                      if error_code in non_retryable_429_codes or error_type in non_retryable_429_codes:
                          raise RuntimeError(
                              f"OpenAI HTTP 429 non-retryable {error_code or error_type}: "
                              f"{error_message[:400]}"
                          )

                      if attempt < max_retries:
                          base_wait = min(60, 2 ** attempt)
                          jitter = random.uniform(0.5, 1.5)
                          wait = base_wait * jitter
                          print(
                              f"⚠️ OpenAI retryable 429 "
                              f"(code={error_code}, type={error_type}, attempt {attempt}/{max_retries}). "
                              f"Waiting {wait:.1f}s before retrying..."
                          )
                          time.sleep(wait)
                          continue

                      raise RuntimeError(f"OpenAI HTTP 429: {response.text[:400]}")

                  if response.status_code >= 400:
                      raise RuntimeError(f"OpenAI HTTP {response.status_code}: {response.text[:400]}")

                  return response.json()

              raise RuntimeError("OpenAI request failed after retries")

          messages = [
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": user_prompt}
          ]

          review_text = None
          should_post_review_comment = False
          try:
              response = call_openai_with_retries(api_key, messages, model="gpt-4o-mini", max_retries=6)
              choices = response.get("choices") if isinstance(response, dict) else None
              if choices and isinstance(choices, list):
                  first = choices[0] if choices else {}
                  message = first.get("message", {}) if isinstance(first, dict) else {}
                  review_text = message.get("content") if isinstance(message, dict) else None
                  should_post_review_comment = bool(review_text)
              else:
                  print("⚠️ OpenAI returned an unexpected response structure.")
          except Exception as e:
              # Keep advisory failures visible in CI logs without adding noisy PR comments.
              print("::warning::AI Code Review OpenAI request failed non-blocking. See job logs for diagnostics.")
              print("Detailed error classification:", file=sys.stderr)
              print(f"Exception type: {type(e).__name__}", file=sys.stderr)
              print(str(e)[:500], file=sys.stderr)
              review_text = (
                  "AI review unavailable: the AI service returned a non-retryable or exhausted error. "
                  "See CI logs for diagnostic details."
              )
              should_post_review_comment = False

          # Post comments only when OpenAI returned real review content.
          if should_post_review_comment and review_text:
              comment_body = f"## AI Code Review\n\n{review_text}\n\n---\n*Generated by AI Code Review*"

              comment_url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
              comment_data = {'body': comment_body}

              try:
                  post_response = requests.post(comment_url, headers=headers, json=comment_data, timeout=20)
                  if post_response.status_code == 201:
                      print("AI review posted successfully!")
                  else:
                      print(f"Failed to post comment: {post_response.status_code}")
                      print(review_text)
              except Exception as e:
                  print(f"Failed to post review comment: {str(e)}")
                  print(review_text)

          # Write review to file for next step
          with open(out_file, "w", encoding="utf-8") as f:
              f.write(review_text or "No review generated")

          PY

      - name: Display Review
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "AI review completed successfully"

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🧠 AI Code Review Completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Report non-blocking AI failure
        if: failure()
        run: |
          echo "::warning::AI Code Review failed (non-blocking). See job logs."
