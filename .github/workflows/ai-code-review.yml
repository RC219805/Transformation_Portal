name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI-Powered Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:

      - name: Check API Key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "❌ OPENAI_API_KEY is not set. Skipping AI code review."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v46
        with:
          files: "**/*.{py,js,ts,jsx,tsx,md,json,yml,yaml}"

      - name: Set up Python
        if: steps.changes.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          pip install --upgrade pip
          pip install openai requests
      
      - name: Run AI Code Review
        if: steps.changes.outputs.any_changed == 'true'
        env:
          RESPONSE_FILE: ${{ runner.temp }}/ai_review.txt
        run: |
          python << 'PY'

          import os
          import sys
          import time
          import json
          import random
          import requests
          import time
          import random
          from openai import OpenAI

          api_key = os.getenv("OPENAI_API_KEY", "").strip()
          gh_token = os.getenv("GH_TOKEN")
          pr_number = os.getenv("PR_NUMBER")
          repo = os.getenv("REPO")
          out_file = os.getenv("RESPONSE_FILE")

          if not api_key:
              print("No OPENAI_API_KEY provided; skipping.")
              sys.exit(0)

          client = OpenAI(api_key=api_key)

          headers = {
              "Authorization": f"token {gh_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # --- Fetch PR files ---------------------------------------------------
          files_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
          print(f"Fetching file list from {files_url}")
          r = requests.get(files_url, headers=headers)

          if r.status_code != 200:
              print("GitHub API error fetching PR files:", r.status_code, r.text)
              sys.exit(1)

          all_files = r.json()

          # Filter allowable extensions
          allow = {".py", ".js", ".ts", ".jsx", ".tsx", ".yml", ".yaml", ".json", ".md"}
          code_files = [f for f in all_files if any(f["filename"].endswith(ext) for ext in allow)]

          Review the code changes and provide:
          1. Code quality assessment (concise)
          2. Potential bugs or issues (if any)
          3. Security concerns (if any)
          4. Performance improvements (if applicable)
          5. Best practice suggestions (if needed)

          Be concise and actionable. Focus on meaningful feedback.
          Use emojis for visual clarity: ✅ (good), ⚠️ (warning), 🐛 (bug), 🔒 (security), ⚡ (performance).

          If the code looks good, say so briefly. Don't nitpick minor style issues."""

          user_prompt = f"""Review these code changes:

          {changes_text}

          Provide a brief, actionable code review."""

          # Use retry logic with exponential backoff + jitter for rate-limit / transient errors.
          print("🤖 Requesting AI review from GPT-4o-mini with retry logic...")

          def call_openai_with_retries(client, messages, model="gpt-4o-mini", max_retries=6, **kwargs):
              for attempt in range(1, max_retries + 1):
                  try:
                      return client.chat.completions.create(
                          model=model,
                          messages=messages,
                          max_tokens=1000,
                          temperature=0.3,
                          **kwargs
                      )
                  except Exception as e:
                      err_str = str(e)
                      # Detect rate-limit / 429 occurrences (best-effort)
                      status_is_429 = False
                      status = getattr(e, "status_code", None) or getattr(e, "http_status", None) or getattr(e, "status", None)
                      if status == 429:
                          status_is_429 = True
                      if "429" in err_str or "Rate limit" in err_str or "RateLimit" in err_str:
                          status_is_429 = True

                      # If we are rate-limited and we have attempts left, wait and retry
                      if status_is_429 and attempt < max_retries:
                          # Exponential backoff with jitter, capped to avoid extremely long waits
                          base_wait = min(60, 2 ** attempt)
                          jitter = random.uniform(0.5, 1.5)
                          wait = base_wait * jitter
                          print(f"⚠️ Rate limited by OpenAI (attempt {attempt}/{max_retries}). Waiting {wait:.1f}s before retrying...")
                          time.sleep(wait)
                          continue
                      # For non-rate-limit or last attempt, raise to be handled by caller
                      raise

          messages = [
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": user_prompt}
          ]

          review_text = None
          try:
              response = call_openai_with_retries(client, messages, model="gpt-4o-mini", max_retries=6)
              # Parse response robustly across possible SDK shapes
              if response and hasattr(response, "choices") and len(response.choices) > 0:
                  try:
                      review_text = response.choices[0].message.content
                  except Exception:
                      review_text = getattr(response.choices[0], "text", None) or str(response)
              else:
                  print("⚠️ OpenAI returned an unexpected response structure.")
          except Exception as e:
              # If retries exhausted or a non-retryable error occurred, provide a clear fallback review_text
              print(f"⚠️ OpenAI request failed after retries: {str(e)}")
              review_text = ("⚠️ AI review unavailable: the AI service returned errors (rate limits or other). "
                             "Please retry or review manually. See CI logs for details.")

          # Post comment on PR (attempt even if fallback review_text used)
          comment_body = f"""## 🤖 AI Code Review

          print("Requesting AI review...")

          # --- Retry wrapper ---------------------------------------------------
          def call_with_retries():
              delay = 1
              for attempt in range(6):
                  try:
                      return client.chat.completions.create(
                          model="gpt-4o-mini",
                          messages=[
                              {"role": "system", "content": system_prompt},
                              {"role": "user", "content": user_prompt},
                          ],
                          max_tokens=800,
                          temperature=0.2,
                      )
                  except Exception as e:
                      print(f"Attempt {attempt+1} failed:", e)
                      time.sleep(min(delay + random.random(), 30))
                      delay *= 2
              return None

          result = call_with_retries()

          if not result or not result.choices:
              review_text = "AI review failed: no response from model."
          else:
              review_text = result.choices[0].message.content.strip()

          with open(out_file, "w", encoding="utf-8") as f:
              f.write(review_text)

          PY

      - name: Post Review Comment
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          if [ ! -s "$RESPONSE_FILE" ]; then
            echo "Review empty or missing."
            exit 0
          fi

          echo "Posting AI review to PR #${PR_NUMBER}"

          comment_url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
          comment_data = {'body': comment_body}

          try:
              post_response = requests.post(comment_url, headers=headers, json=comment_data)
              if post_response.status_code == 201:
                  print("✅ AI review posted successfully!")
                  print(f"\n{review_text}")
              else:
                  # print for diagnostics but do not fail the job for a posting error
                  print(f"⚠️ Failed to post comment: {post_response.status_code}")
                  print(post_response.text if hasattr(post_response, 'text') else '')
                  print(review_text)
          except Exception as e:
              print(f"⚠️ Failed to post review comment due to: {str(e)}")
              print(review_text)

          gh api repos/${REPO}/issues/${PR_NUMBER}/comments \
            -f body="${COMMENT}"

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🧠 AI Code Review Completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
