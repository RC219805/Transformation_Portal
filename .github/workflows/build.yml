name: CI (Lint, Tests & Manifest)

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Pip configuration
  # Note: PIP_NO_CACHE_DIR removed and --no-cache-dir flags removed from install commands (Issue #817)
  # actions/cache@v5 manages ~/.cache/pip for 3-5 min savings per job
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Cleaner CI behavior/logging
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"

  # Hugging Face: silence telemetry/progress (log hygiene)
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  # Preflight: classify changes to determine whether full or lightweight suite runs
  preflight:
    name: Preflight (change classification)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Classify change set
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            // Default: full suite for non-PR events (push to main, workflow_dispatch)
            if (context.eventName !== 'pull_request') {
              core.setOutput('run_full', 'true');
              core.setOutput('reason', 'non-PR event (main push or manual trigger)');
              return;
            }

            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const names = files.map(f => f.filename);
            core.info(`Changed files (${names.length}):`);
            names.forEach(n => core.info(`  ${n}`));

            // Patterns that trigger full CI suite
            const fullSuiteMatchers = [
              /^src\//,
              /^tests\//,
              /^scripts\//,
              /^tools\//,              // execution risk: montecito_manifest.py
              /^config\//,
              /^pyproject\.toml$/,
              /^requirements/,
              /^setup\.py$/,
              /^conftest\.py$/,
              /^Makefile$/,
              /^mypy\.ini$/,
              /^\.pylintrc$/,
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^\.github\/copilot-instructions\.md$/,
            ];

            const runFull = names.some(name => fullSuiteMatchers.some(re => re.test(name)));

            core.setOutput('run_full', runFull ? 'true' : 'false');
            core.setOutput('reason', runFull ? 'code/tests/deps/workflows changed' : 'docs-only or non-runtime changes');

            core.info('');
            core.info(`Decision: run_full = ${runFull}`);
            core.info(`Reason: ${runFull ? 'code/tests/deps/workflows changed' : 'docs-only or non-runtime changes'}`);

  # Lightweight checks (always run, fast)
  lightweight:
    name: Lightweight checks
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Preflight summary
        run: |
          set -euo pipefail
          echo "Preflight decision:"
          echo "  run_full: ${{ needs.preflight.outputs.run_full }}"
          echo "  reason:   ${{ needs.preflight.outputs.reason }}"

      - name: Basic sanity
        run: |
          set -euo pipefail
          echo "Python available: $(python3 --version 2>&1 || echo 'no')"
          echo "✅ Lightweight checks passed"

  lint:
    needs: [preflight]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Selective cleanup - free up disk while preserving Python toolcache
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # latest for linting

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-lint.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install lint dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install flake8 pylint
          python -m pip install -r requirements-lint.txt
          echo "Disk space after dependency install:"
          df -h

      - name: Black (formatting)
        run: black --check --diff --line-length=127 src/ tests/

      - name: isort (imports)
        run: isort --check-only --diff --profile=black --line-length=127 src/ tests/

      - name: Lint with flake8 and pylint
        run: |
          set -euo pipefail
          echo "Running flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Ensure origin/main exists for PR diffs (safe no-op on pushes)
          git fetch origin main --depth=1 || true

          echo "Running pylint..."
          # Prefer linting changed files; fall back to filtered full repo.
          mapfile -t pyfiles < <(
            git diff --diff-filter=d --name-only origin/main...HEAD \
              | grep -E '\.py$' \
              | grep -v -E '(/deprecated/|^src/transformation_portal/|^src/luxury_tiff_batch_processor/|^scripts/|^\.backup_local/|^\.github/|^examples/|^projects/)' \
              || true
          )

          if [ "${#pyfiles[@]}" -eq 0 ]; then
            mapfile -t pyfiles < <(
              git ls-files '*.py' \
                | grep -v -E '(/deprecated/|^src/transformation_portal/|^src/luxury_tiff_batch_processor/|^scripts/|^\.backup_local/|^\.github/|^examples/|^projects/)' \
                || true
            )
          fi

          if [ "${#pyfiles[@]}" -eq 0 ]; then
            echo "No Python files matched pylint filters; skipping pylint."
            exit 0
          fi

          set +e
          pylint "${pyfiles[@]}"
          PYLINT_EXIT=$?
          set -e

          # Fail only on critical pylint bits: 1 (fatal), 2 (error), 32 (usage)
          if [ $((PYLINT_EXIT & 1)) -ne 0 ] || [ $((PYLINT_EXIT & 2)) -ne 0 ] || [ $((PYLINT_EXIT & 32)) -ne 0 ]; then
            echo "Pylint found critical issues (exit code: $PYLINT_EXIT)"
            exit 1
          fi

          echo "Pylint passed (exit code: $PYLINT_EXIT)"

  test:
    needs: [preflight, lint]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.11"
            device: cpu
            test-type: core
            markexpr: "not ml and not slow and not benchmark"
          - python-version: "3.12"
            device: cpu
            test-type: core
            markexpr: "not ml and not slow and not benchmark"
          - python-version: "3.11"
            device: cpu
            test-type: ml
            # Preferred intent: run ML-marked tests, but never slow integration or benchmarks in PR gating.
            markexpr: "ml and not slow and not benchmark"

    name: test (${{ matrix.python-version }}, ${{ matrix.device }}, ${{ matrix.test-type }})

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Selective cleanup - free up disk while preserving Python toolcache
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.test-type }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.test-type }}-
            ${{ runner.os }}-pip-

      - name: Install core dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install pytest pytest-cov
          python -m pip install -r requirements-ci.txt
          echo "Disk space after core install:"
          df -h

      - name: Install ML dependencies (ml leg only)
        if: matrix.test-type == 'ml'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          set -euo pipefail
          # CPU-only torch wheels (cache enabled for 3-5 min savings)
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # ML extras installs the package too
          python -m pip install -e ".[ml]"

          # Respect scikit-learn constraint if present
          SKLEARN_CONSTRAINT="$(grep -E '^scikit-learn[^#]*' requirements-ci.txt | head -n1 || true)"
          if [ -n "$SKLEARN_CONSTRAINT" ]; then
            python -m pip install --force-reinstall "$SKLEARN_CONSTRAINT"
          fi

          # Note: pip cache purge removed - cache now managed by actions/cache@v5
          rm -rf ~/.cache/huggingface || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after ML install:"
          df -h

      - name: Install package (core legs only)
        if: matrix.test-type == 'core'
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Install archive report test dependencies (core legs only)
        if: matrix.test-type == 'core'
        run: |
          set -euo pipefail
          python -m pip install pandas==2.2.3 jsonschema==4.23.0
          python -c "import numpy, pandas"

      - name: Run tests
        env:
          PYTHONNOUSERSITE: "1"
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
          TRANSFORMERS_OFFLINE: "1"
          # Prevent thread oversubscription on shared CI runners (ML CPU tests)
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          set -euo pipefail

          echo "Running tests with marker expression: ${{ matrix.markexpr }}"

          # ML tier: skip coverage (saves tracing + report I/O overhead on PR feedback path)
          # Core tier: enforce 20% minimum coverage
          if [ "${{ matrix.test-type }}" = "ml" ]; then
            COV_FLAGS="--no-cov"
            echo "ML tier: coverage disabled for faster PR feedback"
          else
            COV_FLAGS="--cov=src/transformation_portal --cov=lux_depth_v3 --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=20"
            echo "Core tier: enforcing 20% minimum coverage"
          fi

          # ML tier: add duration profiling for triage of slow tests
          if [ "${{ matrix.test-type }}" = "ml" ]; then
            EXTRA_FLAGS="--durations=25 --durations-min=1.0"
          else
            EXTRA_FLAGS=""
          fi

          set +e
          pytest -v tests/ -ra -m "${{ matrix.markexpr }}" --maxfail=1 \
            $COV_FLAGS \
            $EXTRA_FLAGS
          rc=$?
          set -e

          # If ML marker expression selects zero tests (exit=5), fail fast.
          # This signals a marker taxonomy issue that must be fixed, rather than
          # silently expanding into an unbounded "not slow" fallback run.
          if [ "${{ matrix.test-type }}" = "ml" ] && [ "$rc" -eq 5 ]; then
            echo "::error::ML marker expression '${{ matrix.markexpr }}' selected zero tests (exit=5)."
            echo "Fix marker wiring — do not rely on fallback reruns."
            exit 1
          fi

          # Display coverage summary (core tier only)
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
            ls -lh coverage.xml htmlcov/ || true
          fi

          # Cleanup regardless of outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf /tmp/hf_home || true
          rm -rf ~/.cache/huggingface || true

          exit "$rc"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.test-type }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 30

      - name: Final disk usage
        if: always()
        run: |
          set -euo pipefail
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [preflight, test]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Governance gate threshold: absolute classified-row count (not a percentage).
      # Phase 2: require at least 10 classified rows for governance enforcement.
      # Use GOV_MIN_CLASSIFIED_ROWS to avoid "95% vs 95 rows" ambiguity.
      GOV_MIN_CLASSIFIED_ROWS: "10"

    outputs:
      governance_passed: ${{ steps.governance.outputs.passed }}
      governance_note: ${{ steps.governance.outputs.note }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Run Montecito Manifest Tool
        id: manifest
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          if [ ! -f "$OUT" ]; then
            echo "Error: Montecito manifest was not created at expected path: $OUT" >&2
            exit 1
          fi
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic dataset telemetry
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py metrics \
            --manifest montecito_manifest.csv \
            --out-json manifest_metrics.json \
            --out-audit-csv manifest_audit_extract.csv

      - name: Generate Merkle roots
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py merkle \
            --manifest montecito_manifest.csv \
            --out-json manifest_merkle.json

      - name: Select deterministic Merkle proof target
        id: merkle_target
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("montecito_manifest.csv")
          fn = str(df.iloc[0]["filename"])
          with open("merkle_target.txt", "w", encoding="utf-8") as f:
              f.write(fn + "\n")
          print(fn)
          PY
          echo "filename=$(cat merkle_target.txt)" >> "$GITHUB_OUTPUT"

      - name: Merkle inclusion proof verification (CI Gate)
        run: |
          set -euo pipefail
          TARGET="${{ steps.merkle_target.outputs.filename }}"
          python tools/manifest_telemetry.py merkle-proof \
            --manifest montecito_manifest.csv \
            --filename "$TARGET" \
            --out-json merkle_proof.json
          python tools/manifest_telemetry.py merkle-verify \
            --proof-json merkle_proof.json \
            --out-json merkle_verify_report.json

      - name: Governance completeness check (CI Gate)
        id: governance
        run: |
          set -euo pipefail
          if [ -f rights_privacy_governance.csv ]; then
            set +e
            python tools/manifest_telemetry.py governance-gate \
              --governance-csv rights_privacy_governance.csv \
              --min-classified "${GOV_MIN_CLASSIFIED_ROWS}" \
              --out-json governance_gate_report.json
            GOV_EXIT=$?
            set -e
            if [ "$GOV_EXIT" -eq 0 ]; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
              echo "note=governance gate passed (min_classified_rows=${GOV_MIN_CLASSIFIED_ROWS})" >> "$GITHUB_OUTPUT"
            else
              echo "passed=false" >> "$GITHUB_OUTPUT"
              echo "note=governance gate FAILED (min_classified_rows=${GOV_MIN_CLASSIFIED_ROWS})" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            # Produce JSON with consistent schema even when governance file is absent
            cat > governance_gate_report.json <<SKIPPED_JSON
          {
            "schema_version": "1.0",
            "governance_csv": null,
            "rows_total": 0,
            "classified_rows": 0,
            "unclassified_rows": 0,
            "coverage_percent": 0.0,
            "classification_column": null,
            "min_classified_required": ${GOV_MIN_CLASSIFIED_ROWS},
            "threshold_mode": "rows",
            "passed": null,
            "note": "rights_privacy_governance.csv not present; skipping governance gate"
          }
          SKIPPED_JSON
            echo "passed=skipped" >> "$GITHUB_OUTPUT"
            echo "note=rights_privacy_governance.csv not present; governance gate skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dataset-governance-telemetry
          path: |
            manifest_metrics.json
            manifest_audit_extract.csv
            manifest_merkle.json
            merkle_target.txt
            merkle_proof.json
            merkle_verify_report.json
            governance_gate_report.json
          if-no-files-found: error
          retention-days: 30

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [preflight, lightweight, lint, test, generate-manifest]
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      checks: write

    steps:
      - name: Summarize upstream results
        run: |
          set -euo pipefail
          echo "Preflight decision:"
          echo "  run_full: ${{ needs.preflight.outputs.run_full }}"
          echo "  reason:   ${{ needs.preflight.outputs.reason }}"
          echo ""
          echo "Job results:"
          echo "  lightweight:       ${{ needs.lightweight.result }}"
          echo "  lint:              ${{ needs.lint.result }}"
          echo "  test:              ${{ needs.test.result }}"
          echo "  generate-manifest: ${{ needs['generate-manifest'].result }}"
          echo ""
          echo "Dataset Governance:"
          echo "  governance_passed: ${{ needs['generate-manifest'].outputs.governance_passed || 'N/A' }}"
          echo "  governance_note:   ${{ needs['generate-manifest'].outputs.governance_note || 'N/A' }}"

      - name: Enforce pass/fail
        id: gate
        run: |
          set -euo pipefail

          # Lightweight must always succeed
          if [ "${{ needs.lightweight.result }}" != "success" ]; then
            echo "❌ lightweight checks failed"
            echo "GATE_STATUS=failure" >> "$GITHUB_ENV"
            echo "GATE_MODE=lightweight (failed)" >> "$GITHUB_ENV"
            exit 1
          fi

          # If full suite was required, enforce all jobs
          if [ "${{ needs.preflight.outputs.run_full }}" = "true" ]; then
            ok="true"

            if [ "${{ needs.lint.result }}" != "success" ]; then
              echo "❌ lint did not succeed"
              ok="false"
            fi

            if [ "${{ needs.test.result }}" != "success" ]; then
              echo "❌ test matrix did not succeed"
              ok="false"
            fi

            if [ "${{ needs['generate-manifest'].result }}" != "success" ]; then
              echo "❌ generate-manifest did not succeed"
              ok="false"
            fi

            if [ "$ok" != "true" ]; then
              echo "GATE_STATUS=failure" >> "$GITHUB_ENV"
              echo "GATE_MODE=full suite (failed)" >> "$GITHUB_ENV"
              echo "CI Gate: FAILED (full suite required)"
              exit 1
            fi

            echo "GATE_STATUS=success" >> "$GITHUB_ENV"
            echo "GATE_MODE=full suite" >> "$GITHUB_ENV"
            echo "✅ CI Gate: PASSED (full suite)"
            exit 0
          fi

          # Lightweight mode: heavy jobs are allowed to be skipped
          echo "GATE_STATUS=success" >> "$GITHUB_ENV"
          echo "GATE_MODE=lightweight-only" >> "$GITHUB_ENV"
          echo "✅ CI Gate: PASSED (lightweight-only mode)"

      - name: Set governance status variables
        if: always()
        run: |
          GOV_PASSED="${{ needs['generate-manifest'].outputs.governance_passed || 'N/A' }}"
          GOV_NOTE="${{ needs['generate-manifest'].outputs.governance_note || 'N/A' }}"
          if [ "$GOV_PASSED" = "true" ]; then
            GOV_EMOJI="✅"
            GOV_STATUS_TEXT="PASSED"
          elif [ "$GOV_PASSED" = "false" ]; then
            GOV_EMOJI="❌"
            GOV_STATUS_TEXT="FAILED"
          elif [ "$GOV_PASSED" = "skipped" ]; then
            GOV_EMOJI="⏭️"
            GOV_STATUS_TEXT="SKIPPED"
          elif [ "$GOV_PASSED" = "N/A" ]; then
            GOV_EMOJI="⏹️"
            GOV_STATUS_TEXT="NOT RUN"
          else
            GOV_EMOJI="❓"
            GOV_STATUS_TEXT="UNKNOWN"
          fi
          echo "GOV_PASSED=$GOV_PASSED" >> "$GITHUB_ENV"
          echo "GOV_NOTE=$GOV_NOTE" >> "$GITHUB_ENV"
          echo "GOV_EMOJI=$GOV_EMOJI" >> "$GITHUB_ENV"
          echo "GOV_STATUS_TEXT=$GOV_STATUS_TEXT" >> "$GITHUB_ENV"

      - name: Write CI Gate Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## CI Gate Summary"
            echo ""
            echo "### Preflight Decision"
            echo "- **run_full**: ${{ needs.preflight.outputs.run_full }}"
            echo "- **reason**: ${{ needs.preflight.outputs.reason }}"
            echo ""
            echo "### Job Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| lightweight | ${{ needs.lightweight.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| generate-manifest | ${{ needs['generate-manifest'].result }} |"
            echo ""
            echo "### Dataset Governance Status"
            echo "${GOV_EMOJI} **Governance Gate**: ${GOV_STATUS_TEXT}"
            echo ""
            echo "**Note**: ${GOV_NOTE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Dedicated CI Gate Check
        if: ${{ always() }}
        uses: actions/github-script@v8
        env:
          GATE_STATUS: ${{ env.GATE_STATUS || 'failure' }}
          GATE_MODE: ${{ env.GATE_MODE || 'unknown' }}
          GOV_EMOJI: ${{ env.GOV_EMOJI || '❓' }}
          GOV_NOTE: ${{ env.GOV_NOTE || 'N/A' }}
        with:
          script: |
            const conclusion = process.env.GATE_STATUS === 'success' ? 'success' : 'failure';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CI Gate',
              head_sha: context.payload.pull_request?.head?.sha || context.sha,
              status: 'completed',
              conclusion,
              output: {
                title: conclusion === 'success' ? '✅ CI Gate: PASSED' : '❌ CI Gate: FAILED',
                summary: `**Mode**: ${process.env.GATE_MODE}\n\n**Reason**: ${process.env.GATE_MODE.includes('full') ? '${{ needs.preflight.outputs.reason }}' : 'docs-only or non-runtime changes'}\n\n**Dataset Governance**: ${process.env.GOV_EMOJI} ${process.env.GOV_NOTE}`,
                text: `
            **Preflight Decision**:
            - run_full: ${{ needs.preflight.outputs.run_full }}
            - reason: ${{ needs.preflight.outputs.reason }}

            **Job Results**:
            - lightweight: ${{ needs.lightweight.result }}
            - lint: ${{ needs.lint.result }}
            - test: ${{ needs.test.result }}
            - generate-manifest: ${{ needs['generate-manifest'].result }}

            **Dataset Governance**:
            - governance_passed: ${{ needs['generate-manifest'].outputs.governance_passed || 'N/A' }}
            - governance_note: ${{ needs['generate-manifest'].outputs.governance_note || 'N/A' }}
            `,
              }
            });
