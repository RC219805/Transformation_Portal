name: CI (Lint, Tests & Manifest)
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single lint job - no need to run on multiple Python versions
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize available disk space
        run: |
          echo "Initial disk usage:"
          df -h

          # Aggressive cleanup - free up to 30GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/.ghcup

          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y

          # Clean docker
          docker system prune -af --volumes || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # Use latest Python for linting

      - name: Lint with minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flake8 pylint
          echo "Running flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
          echo "Running pylint on changed files..."
          files=$(git diff --diff-filter=d --name-only origin/main...HEAD | grep '\.py$' | grep -v -e '/deprecated/' -e 'src/transformation_portal/' -e 'src/luxury_tiff_batch_processor/' -e 'scripts/' || echo "")
          
          set +e
          if [ -z "$files" ]; then
            pylint $(git ls-files '*.py' | grep -v -e '/deprecated/' -e 'src/transformation_portal/' -e 'src/luxury_tiff_batch_processor/' -e 'scripts/')
            PYLINT_EXIT=$?
          else
            pylint $files
            PYLINT_EXIT=$?
          fi
          set -e
          
          if [ $((PYLINT_EXIT & 1)) -ne 0 ] || [ $((PYLINT_EXIT & 2)) -ne 0 ] || [ $((PYLINT_EXIT & 32)) -ne 0 ]; then
            echo "Pylint found critical issues (exit code: $PYLINT_EXIT)"
            exit 1
          else
            echo "Pylint passed (exit code: $PYLINT_EXIT)"
            exit 0
          fi

  # Streamlined test job - reduced matrix
  test:
    needs: lint  # Only run tests if linting passes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true  # Stop all jobs if one fails
      matrix:
        # Reduce to essential combinations only
        include:
          - python-version: "3.10"
            device: cpu
            test-type: core
          - python-version: "3.12"
            device: cpu
            test-type: core
          - python-version: "3.11"
            device: cpu
            test-type: ml  # ML tests only on one Python version

    steps:
      - name: Maximize available disk space
        run: |
          echo "Initial disk usage:"
          df -h
          
          # Aggressive cleanup - free up to 30GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/.ghcup
          
          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          
          # Remove snap packages we don't need
          sudo snap list --color=never | grep -E "lxd|snapd|core20|core22" | awk '{print $1}' | awk 'ORS="\\0"' | xargs -0 -n1 sudo snap remove 2>/dev/null || true
          
          # Clean docker
          docker system prune -af --volumes || true
          
          # [DISABLED] Swap removal skipped to avoid OOM errors during memory-intensive tests.
          # sudo swapoff -a
          # sudo rm -f /swapfile
          
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.test-type }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.test-type }}-

      - name: Install core dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --upgrade pip wheel
          
          # Always install core deps
          pip install --no-cache-dir pytest pytest-cov
          pip install --no-cache-dir -r requirements-ci.txt
          
          # Clear cache immediately
          pip cache purge || true

      - name: Install ML dependencies (if needed)
        if: matrix.test-type == 'ml'
        env:
          PIP_NO_CACHE_DIR: "1"
          TRANSFORMERS_OFFLINE: "1"  # Don't download models during tests
        run: |
          # Install CPU-only PyTorch to save space
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -e ".[ml]"
          
          # Reinstall scikit-learn if needed
          SKLEARN_CONSTRAINT=$(grep -E '^scikit-learn[^#]*' requirements-ci.txt | head -n1)
          if [ -n "$SKLEARN_CONSTRAINT" ]; then
            pip install --no-cache-dir --force-reinstall "$SKLEARN_CONSTRAINT"
          fi
          
          # Clear cache again
          pip cache purge || true
          rm -rf ~/.cache/huggingface || true

      - name: Install package
        run: |
          pip install --no-cache-dir -e .

      - name: Run tests with cleanup
        env:
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          if [ "${{ matrix.test-type }}" = "core" ]; then
            # Run non-ML tests
            pytest -v tests/ -k "not (ml or slow)" || pytest_exit=$?
          else
            # Run ML tests
            pytest -v tests/ -k "ml or slow" || pytest_exit=$?
          fi
          
          # Cleanup regardless of test outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf ~/.cache/huggingface || true
          
          # Exit with pytest's exit code
          exit ${pytest_exit:-0}

      - name: Final disk usage
        if: always()
        run: |
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [test]  # Changed dependency to test instead of lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          python -m pip install --upgrade pip
          # Only install what's needed for manifest generation
          pip install --no-cache-dir pandas numpy
          
      - name: Run Montecito Manifest Tool
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          
          if [ ! -f "$OUT" ]; then
            echo "Error: Manifest file was not created at $OUT"
            exit 1
          fi
          
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7  # Reduce retention
