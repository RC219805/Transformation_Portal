name: CI (Lint, Tests & Manifest)

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Disk-friendly installs
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Cleaner CI behavior/logging
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"

  # Hugging Face: silence telemetry/progress (log hygiene)
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Aggressive cleanup - free up disk
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          rm -rf ~/.cache/pip || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # latest for linting

      - name: Lint with minimal dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir flake8 pylint
          python -m pip install --no-cache-dir -r requirements-lint.txt
          pip cache purge || true

          echo "Disk space after dependency install:"
          df -h

          echo "Running flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Ensure origin/main exists for PR diffs (safe no-op on pushes)
          git fetch origin main --depth=1 || true

          echo "Running pylint..."
          # Prefer linting changed files; fall back to filtered full repo.
          mapfile -t pyfiles < <(
            git diff --diff-filter=d --name-only origin/main...HEAD \
              | grep -E '\.py$' \
              | grep -v -E '(/deprecated/|^src/transformation_portal/|^src/luxury_tiff_batch_processor/|^scripts/|^\.backup_local/|^\.github/|^examples/|^projects/)' \
              || true
          )

          if [ "${#pyfiles[@]}" -eq 0 ]; then
            mapfile -t pyfiles < <(
              git ls-files '*.py' \
                | grep -v -E '(/deprecated/|^src/transformation_portal/|^src/luxury_tiff_batch_processor/|^scripts/|^\.backup_local/|^\.github/|^examples/|^projects/)' \
                || true
            )
          fi

          if [ "${#pyfiles[@]}" -eq 0 ]; then
            echo "No Python files matched pylint filters; skipping pylint."
            exit 0
          fi

          set +e
          pylint "${pyfiles[@]}"
          PYLINT_EXIT=$?
          set -e

          # Fail only on critical pylint bits: 1 (fatal), 2 (error), 32 (usage)
          if [ $((PYLINT_EXIT & 1)) -ne 0 ] || [ $((PYLINT_EXIT & 2)) -ne 0 ] || [ $((PYLINT_EXIT & 32)) -ne 0 ]; then
            echo "Pylint found critical issues (exit code: $PYLINT_EXIT)"
            exit 1
          fi

          echo "Pylint passed (exit code: $PYLINT_EXIT)"

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.10"
            device: cpu
            test-type: core
            markexpr: "not ml and not slow"
          - python-version: "3.12"
            device: cpu
            test-type: core
            markexpr: "not ml and not slow"
          - python-version: "3.11"
            device: cpu
            test-type: ml
            # Preferred intent: run ML-marked tests, but never slow integration in PR gating.
            markexpr: "ml and not slow"

    name: test (${{ matrix.python-version }}, ${{ matrix.device }}, ${{ matrix.test-type }})

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          rm -rf ~/.cache/pip || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install --no-cache-dir pytest pytest-cov
          python -m pip install --no-cache-dir -r requirements-ci.txt
          pip cache purge || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after core install:"
          df -h

      - name: Install ML dependencies (ml leg only)
        if: matrix.test-type == 'ml'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          set -euo pipefail
          # CPU-only torch wheels
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # ML extras installs the package too
          python -m pip install --no-cache-dir -e ".[ml]"

          # Respect scikit-learn constraint if present
          SKLEARN_CONSTRAINT="$(grep -E '^scikit-learn[^#]*' requirements-ci.txt | head -n1 || true)"
          if [ -n "$SKLEARN_CONSTRAINT" ]; then
            python -m pip install --no-cache-dir --force-reinstall "$SKLEARN_CONSTRAINT"
          fi

          pip cache purge || true
          rm -rf ~/.cache/huggingface || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after ML install:"
          df -h

      - name: Install package (core legs only)
        if: matrix.test-type == 'core'
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e .

      - name: Run tests with cleanup
        env:
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          pytest_exit=0

          echo "Running tests with marker expression: ${{ matrix.markexpr }}"

          # Run the configured selection, but ensure the ML leg remains meaningful even
          # if @pytest.mark.ml coverage is not fully in place yet.
          set +e
          pytest -v tests/ -ra -m "${{ matrix.markexpr }}" --maxfail=1
          rc=$?
          set -e

          if [ "${{ matrix.test-type }}" = "ml" ] && [ "$rc" -eq 5 ]; then
            echo "No tests selected by -m '${{ matrix.markexpr }}' (exit=5)."
            echo "Fallback: run the non-slow suite under ML deps to keep this leg non-empty."
            set +e
            pytest -v tests/ -ra -m "not slow" --maxfail=1
            pytest_exit=$?
            set -e
          else
            pytest_exit=$rc
          fi

          # Cleanup regardless of outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf /tmp/hf_home || true
          rm -rf ~/.cache/huggingface || true

          exit "$pytest_exit"

      - name: Final disk usage
        if: always()
        run: |
          set -euo pipefail
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pandas numpy

      - name: Run Montecito Manifest Tool
        id: manifest
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          test -f "$OUT"
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7
