name: CI (Lint, Tests & Manifest)
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single lint job - no need to run on multiple Python versions
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize available disk space
        run: |
          echo "Initial disk usage:"
          df -h

          # Aggressive cleanup - free up to 30GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/.ghcup

          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y

          # Clean docker
          docker system prune -af --volumes || true

          # Remove pip cache preemptively
          rm -rf ~/.cache/pip || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # Use latest Python for linting

      - name: Lint with minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # Lint tools
          pip install --no-cache-dir flake8 pylint
          # Minimal runtime deps (only what's needed for linting tools/ and root *.py)
          # Using requirements-lint.txt instead of requirements-ci.txt saves ~5-8GB disk space
          pip install --no-cache-dir -r requirements-lint.txt

          # Purge pip cache immediately to free disk space
          pip cache purge || true

          echo "Disk space after dependency install:"
          df -h

          echo "Running flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
          echo "Running pylint on changed files..."
          # Directories to exclude from linting (backup, agent, legacy, and project-specific code)
          EXCLUDE_PATTERNS='-e /deprecated/ -e src/transformation_portal/ -e src/luxury_tiff_batch_processor/ -e scripts/ -e \.backup_local/ -e \.github/agents/ -e basicsr_tp/ -e projects/ -e examples/'
          files=$(git diff --diff-filter=d --name-only origin/main...HEAD | grep '\.py$' | grep -v $EXCLUDE_PATTERNS || echo "")
          
          set +e
          if [ -z "$files" ]; then
            pylint $(git ls-files '*.py' | grep -v $EXCLUDE_PATTERNS)
            PYLINT_EXIT=$?
          else
            pylint $files
            PYLINT_EXIT=$?
          fi
          set -e
          
          if [ $((PYLINT_EXIT & 1)) -ne 0 ] || [ $((PYLINT_EXIT & 2)) -ne 0 ] || [ $((PYLINT_EXIT & 32)) -ne 0 ]; then
            echo "Pylint found critical issues (exit code: $PYLINT_EXIT)"
            exit 1
          else
            echo "Pylint passed (exit code: $PYLINT_EXIT)"
            exit 0
          fi

  # Streamlined test job - reduced matrix
  test:
    needs: lint  # Only run tests if linting passes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true  # Stop all jobs if one fails
      matrix:
        include:
          - python-version: "3.10"
            device: cpu
            test-type: core
          - python-version: "3.12"
            device: cpu
            test-type: core
          - python-version: "3.11"
            device: cpu
            test-type: ml  # ML tests only on one Python version

    steps:
      - name: Maximize available disk space
        run: |
          echo "Initial disk usage:"
          df -h
          
          # Aggressive cleanup - free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/.ghcup
          
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          
          docker system prune -af --volumes || true

          # Remove pip cache preemptively
          rm -rf ~/.cache/pip || true

          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --upgrade pip wheel
          
          # Always install core test deps and runtime+CI deps
          pip install --no-cache-dir pytest pytest-cov
          pip install --no-cache-dir -r requirements-ci.txt

          # Clear cache and temp files immediately to save space
          pip cache purge || true
          rm -rf /tmp/pip-* || true

          echo "Disk space after core install:"
          df -h

      - name: Install ML dependencies (if needed)
        if: matrix.test-type == 'ml'
        env:
          PIP_NO_CACHE_DIR: "1"
          TRANSFORMERS_OFFLINE: "1"  # Don't download models during tests
        run: |
          # Install CPU-only PyTorch to save space
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Install ML extras via editable install with extras
          pip install --no-cache-dir -e ".[ml]"
          
          # Reinstall scikit-learn if needed (ensure ABI matches numpy)
          SKLEARN_CONSTRAINT=$(grep -E '^scikit-learn[^#]*' requirements-ci.txt | head -n1)
          if [ -n "$SKLEARN_CONSTRAINT" ]; then
            pip install --no-cache-dir --force-reinstall "$SKLEARN_CONSTRAINT"
          fi
          
          pip cache purge || true
          rm -rf ~/.cache/huggingface || true
          rm -rf /tmp/pip-* || true

          echo "Disk space after ML install:"
          df -h

      - name: Install package
        run: |
          pip install --no-cache-dir -e .

      - name: Run tests with cleanup
        env:
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          if [ "${{ matrix.test-type }}" = "core" ]; then
            # Run non-ML tests - ignore test files/dirs with ML dependencies
            # Using --ignore to skip collection of ML test files that import torch
            pytest -v tests/ \
              --ignore=tests/test_model_training.py \
              --ignore=tests/test_basicsr_tp.py \
              --ignore=tests/foundation/ \
              --ignore=tests/perceptual/ \
              -k "not (ml or slow)" || pytest_exit=$?
          else
            # Run ML tests - all tests including foundation/perceptual dirs
            # These require PyTorch and other ML dependencies
            pytest -v tests/ -k "ml or slow" || pytest_exit=$?
          fi

          # Cleanup regardless of test outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf ~/.cache/huggingface || true

          exit ${pytest_exit:-0}

      - name: Final disk usage
        if: always()
        run: |
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          python -m pip install --upgrade pip
          # Only install what's needed for manifest generation
          pip install --no-cache-dir pandas numpy

      - name: Run Montecito Manifest Tool
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          
          if [ ! -f "$OUT" ]; then
            echo "Error: Manifest file was not created at $OUT"
            exit 1
          fi
          
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7
          