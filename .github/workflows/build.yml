name: CI (Lint, Tests & Manifest)

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HIDE_PROGESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  # Single lint job - no need to run on multiple Python versions
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Aggressive cleanup - free up to ~30GB
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          rm -rf ~/.cache/pip || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # latest for linting

      - name: Lint with minimal dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir flake8 pylint
          # Minimal deps for linting
          pip install --no-cache-dir -r requirements-lint.txt
          pip cache purge || true

          echo "Disk space after dependency install:"
          df -h

          echo "Running flake8..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          echo "Running pylint on changed files..."
          # NOTE: for PRs we can diff against origin/main; for pushes to main this
          # will often be empty (fine) and we fall back to linting all tracked files (filtered).
          files="$(git diff --diff-filter=d --name-only origin/main...HEAD \
            | grep '\.py$' \
            | grep -v -e '/deprecated/' \
                     -e '^src/transformation_portal/' \
                     -e '^src/luxury_tiff_batch_processor/' \
                     -e '^scripts/' \
                     -e '^.backup_local/' \
                     -e '^.github/' \
                     -e '^examples/' \
                     -e '^projects/' \
            || true)"

          set +e
          if [ -z "$files" ]; then
            pylint $(git ls-files '*.py' \
              | grep -v -e '/deprecated/' \
                       -e '^src/transformation_portal/' \
                       -e '^src/luxury_tiff_batch_processor/' \
                       -e '^scripts/' \
                       -e '^.backup_local/' \
                       -e '^.github/' \
                       -e '^examples/' \
                       -e '^projects/')
            PYLINT_EXIT=$?
          else
            pylint $files
            PYLINT_EXIT=$?
          fi
          set -e

          # Fail only on critical pylint bits: 1 (fatal), 2 (error), 32 (usage)
          if [ $((PYLINT_EXIT & 1)) -ne 0 ] || [ $((PYLINT_EXIT & 2)) -ne 0 ] || [ $((PYLINT_EXIT & 32)) -ne 0 ]; then
            echo "Pylint found critical issues (exit code: $PYLINT_EXIT)"
            exit 1
          fi
          echo "Pylint passed (exit code: $PYLINT_EXIT)"

  # Streamlined test job - reduced matrix
  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.10"
            device: cpu
            test-type: core
          - python-version: "3.12"
            device: cpu
            test-type: core
          - python-version: "3.11"
            device: cpu
            test-type: ml

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          rm -rf ~/.cache/pip || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          pip install --no-cache-dir pytest pytest-cov
          pip install --no-cache-dir -r requirements-ci.txt
          pip cache purge || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after core install:"
          df -h

      - name: Install ML dependencies (if needed)
        if: matrix.test-type == 'ml'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          set -euo pipefail
          # CPU-only torch wheels
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # ML extras
          pip install --no-cache-dir -e ".[ml]"

          # Ensure scikit-learn constraint is respected if present
          SKLEARN_CONSTRAINT="$(grep -E '^scikit-learn[^#]*' requirements-ci.txt | head -n1 || true)"
          if [ -n "$SKLEARN_CONSTRAINT" ]; then
            pip install --no-cache-dir --force-reinstall "$SKLEARN_CONSTRAINT"
          fi

          pip cache purge || true
          rm -rf ~/.cache/huggingface || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after ML install:"
          df -h

      - name: Install package
        run: |
          set -euo pipefail
          pip install --no-cache-dir -e .

      - name: Run tests with cleanup
        env:
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          pytest_exit=0

          if [ "${{ matrix.test-type }}" = "core" ]; then
            echo "Running CORE tests: not ml, not slow"
            # Prefer markers if present; fall back to -k logic if you later need it.
            pytest -v tests/ -m "not ml and not slow" --maxfail=1 || pytest_exit=$?
          else
            echo "Running ML tests: ml, not slow"
            # Critical fix: DO NOT include slow here. That was the source of the discrepancy.
            pytest -v tests/ -m "ml and not slow" --maxfail=1 || pytest_exit=$?
          fi

          # Cleanup regardless of outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf /tmp/hf_home || true
          rm -rf ~/.cache/huggingface || true

          exit "$pytest_exit"

      - name: Final disk usage
        if: always()
        run: |
          set -euo pipefail
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas numpy

      - name: Run Montecito Manifest Tool
        id: manifest
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          test -f "$OUT"
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7
