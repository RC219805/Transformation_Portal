name: CI (Lint, Tests & Manifest)

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Pip configuration
  # Note: PIP_NO_CACHE_DIR removed and --no-cache-dir flags removed from install commands (Issue #817)
  # actions/cache@v5 manages ~/.cache/pip for 3-5 min savings per job
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Cleaner CI behavior/logging
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"

  # Hugging Face: silence telemetry/progress (log hygiene)
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  # Preflight: classify changes to determine whether full or lightweight suite runs
  preflight:
    name: Preflight (change classification)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      run_frontdoor: ${{ steps.classify.outputs.run_frontdoor }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Classify change set
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Default: full suite for non-PR events (push to main, workflow_dispatch)
            if (context.eventName !== 'pull_request') {
              core.setOutput('run_full', 'true');
              core.setOutput('run_frontdoor', 'true');
              core.setOutput('reason', 'non-PR event (main push or manual trigger)');
              return;
            }

            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const names = files.map(f => f.filename);
            core.info(`Changed files (${names.length}):`);
            names.forEach(n => core.info(`  ${n}`));

            // Patterns that trigger full CI suite
            const fullSuiteMatchers = [
              /^src\//,
              /^apps\//,
              /^tests\//,
              /^scripts\//,
              /^tools\//,              // execution risk: montecito_manifest.py
              /^config\//,
              /^pyproject\.toml$/,
              /^requirements/,
              /^setup\.py$/,
              /^conftest\.py$/,
              /^Makefile$/,
              /^mypy\.ini$/,
              /^\.pylintrc$/,
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^\.github\/copilot-instructions\.md$/,
            ];

            const frontdoorMatchers = [
              /^web\/secure-landing\//,
              /^config\/portal_asset_manifest\.json$/,
              /^scripts\/validation\/validate_frontdoor_browser_smoke\.py$/,
              /^docs\/guides\/PORTAL_SECURE_FRONTDOOR_QUICKSTART\.md$/,
              // The @portal-browser Playwright suite serves portal.html
              // through the mock FastAPI origin, so changes to the
              // portal markup template must trigger frontdoor-contract.
              /^portal\.html$/,
            ];

            const runFrontdoor = names.some(name => frontdoorMatchers.some(re => re.test(name)));
            const runFull = runFrontdoor || names.some(name => fullSuiteMatchers.some(re => re.test(name)));

            const reasons = [];
            if (runFrontdoor) reasons.push('frontdoor/runtime boundary changed');
            if (names.some(name => fullSuiteMatchers.some(re => re.test(name)))) {
              reasons.push('code/tests/deps/workflows changed');
            }
            const reason = reasons.length > 0 ? reasons.join('; ') : 'docs-only or non-runtime changes';

            core.setOutput('run_full', runFull ? 'true' : 'false');
            core.setOutput('run_frontdoor', runFrontdoor ? 'true' : 'false');
            core.setOutput('reason', reason);

            core.info('');
            core.info(`Decision: run_full = ${runFull}`);
            core.info(`Decision: run_frontdoor = ${runFrontdoor}`);
            core.info(`Reason: ${reason}`);

  # Lightweight checks (always run, fast)
  lightweight:
    name: Lightweight checks
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Preflight summary
        run: |
          set -euo pipefail
          echo "Preflight decision:"
          echo "  run_full: ${{ needs.preflight.outputs.run_full }}"
          echo "  reason:   ${{ needs.preflight.outputs.reason }}"

      - name: pip-tools cache guardrails
        run: |
          set -euo pipefail
          python3 scripts/validation/check_piptools_cache_tracked.py

      - name: Detect stale docs paths
        run: |
          set -euo pipefail
          python3 scripts/governance/check_stale_docs_paths.py

      - name: Validate generated design tokens reference
        run: |
          set -euo pipefail
          python3 scripts/validation/generate_design_tokens_doc.py --check

      - name: Enforce documentation structure
        run: |
          set -euo pipefail
          python3 scripts/governance/check_docs_structure.py --changed-only
          python3 scripts/governance/check_docs_structure.py --all

      - name: Basic sanity
        run: |
          set -euo pipefail
          echo "Python available: $(python3 --version 2>&1 || echo 'no')"
          echo "✅ Lightweight checks passed"

      - name: Assert tp import surface intent
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 scripts/verification/assert_tp_import_surface.py --module tp --expect importable

      - name: Assert tp import path parity under src/
        run: |
          set -euo pipefail
          TP_FILE="$(PYTHONPATH=src python3 -c "import pathlib, tp; print(pathlib.Path(tp.__file__).resolve())")"
          EXPECTED_PREFIX="${GITHUB_WORKSPACE}/src/tp/"
          if [[ "${TP_FILE}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "tp import path parity failed: expected prefix ${EXPECTED_PREFIX}, got ${TP_FILE}" >&2
            exit 1
          fi
          echo "tp import path parity passed: ${TP_FILE}"

      - name: Wheel install smoke (tp import)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip build
          rm -rf /tmp/tp-wheel-smoke /tmp/tp-dist
          python3 -m build --wheel --outdir /tmp/tp-dist
          python3 -m venv /tmp/tp-wheel-smoke
          source /tmp/tp-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install /tmp/tp-dist/*.whl
          TP_FILE="$(python -c "import pathlib, tp; print(pathlib.Path(tp.__file__).resolve())")"
          echo "tp wheel import path: ${TP_FILE}"
          python -c "import tp; from tp.phase4.hash_capture_metadata import compute_metadata_sha256; print('tp wheel smoke passed')"

      - name: Relocatability proof (temp checkout + contained outputs)
        run: |
          set -euo pipefail
          REPO_ROOT="$(pwd)"
          TEMP_ROOT="$(mktemp -d /tmp/tp-reloc-proof-XXXXXX)"
          COPY_ROOT="${TEMP_ROOT}/repo"
          OUT_DIR="${TEMP_ROOT}/trial_runs/reloc-proof"
          cleanup() {
            if [ -n "${TEMP_ROOT:-}" ] && [ -d "${TEMP_ROOT}" ]; then
              rm -rf "${TEMP_ROOT}"
            fi
          }
          trap cleanup EXIT INT TERM

          mkdir -p "${COPY_ROOT}"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a \
              --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              --exclude='.mypy_cache' \
              --exclude='.venv' \
              "${REPO_ROOT}/" "${COPY_ROOT}/"
          else
            cp -R "${REPO_ROOT}/." "${COPY_ROOT}/"
            rm -rf "${COPY_ROOT}/.git"
          fi
          cd "${COPY_ROOT}"

          python3 -m pip install --upgrade pip setuptools wheel
          # Keep lightweight job runtime bounded while still proving editable install semantics.
          python3 -m pip install numpy pillow
          python3 -m pip install -e . --no-deps

          python3 scripts/verification/verify_ml_deps.py --help
          python3 scripts/verification/verify_core.py --help
          python3 scripts/verification/verify_rag_install.py --help

          texture_state() {
            local file_path="${1}"
            python3 - "${file_path}" <<'PY'
          import hashlib
          import os
          import sys

          path = sys.argv[1]
          if not os.path.exists(path):
              print("__ABSENT__")
              raise SystemExit(0)

          digest = hashlib.sha256()
          with open(path, "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          st = os.stat(path)
          print(f"{digest.hexdigest()}::{st.st_mtime_ns}")
          PY
          }

          DEFAULT_TEXTURE_FILE="${COPY_ROOT}/assets/textures/board_materials/plaster_marmorino_westwood_beige.png"
          DEFAULT_TEXTURE_STATE_BEFORE="$(texture_state "${DEFAULT_TEXTURE_FILE}")"

          python3 scripts/create_board_textures.py \
            --output-dir "${OUT_DIR}" \
            --size 256 \
            --materials plaster_marmorino_westwood_beige \
            --seed 42 \
            --noise 1

          test -f "${OUT_DIR}/plaster_marmorino_westwood_beige.png"

          DEFAULT_TEXTURE_STATE_AFTER="$(texture_state "${DEFAULT_TEXTURE_FILE}")"
          if [ "${DEFAULT_TEXTURE_STATE_BEFORE}" != "${DEFAULT_TEXTURE_STATE_AFTER}" ]; then
            echo "relocatability proof failed: default texture path changed in copied repo" >&2
            exit 1
          fi

          # Guard against scripts silently ignoring --output-dir and writing under repo root.
          if [ -d "${COPY_ROOT}/trial_runs" ]; then
            echo "relocatability proof failed: outputs escaped to copied repo root" >&2
            exit 1
          fi

          # Guard against hardcoded absolute writes back into the original checkout.
          if [ -n "$(git -C "${REPO_ROOT}" status --porcelain)" ]; then
            echo "relocatability proof failed: original workspace was mutated" >&2
            git -C "${REPO_ROOT}" status --porcelain >&2
            exit 1
          fi

          COPY_ROOT="${COPY_ROOT}" python3 - <<'PY'
          import os
          from pathlib import Path

          import tp
          import transformation_portal

          copy_root = Path(os.environ["COPY_ROOT"]).resolve()
          tp_file = Path(tp.__file__).resolve()
          expected_prefix = copy_root / "src" / "tp"
          if not str(tp_file).startswith(str(expected_prefix)):
              raise SystemExit(
                  f"tp import path outside temp copy: expected prefix {expected_prefix}, got {tp_file}"
              )
          print(f"relocatability proof passed: tp loaded from {tp_file}")
          print(f"transformation_portal import OK: {transformation_portal.__name__}")
          PY

      - name: Validate compliance schemas
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install jsonschema==4.23.0
          python scripts/validation/validate_compliance_schemas.py

      # Promoted from ci.yml (post-merge) to build.yml (PR gate) per remediation Phase 0.2.
      # gitleaks-action needs full git history for the <before>..<after> scan range,
      # which the lightweight job already provides via fetch-depth: 0 above.
      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-constraints:
    name: Validate dependency constraints (ADR-032)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"

      - name: Install minimal tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install packaging

      - name: Validate dependency constraints
        run: |
          set -euo pipefail
          set +e
          bash scripts/validate_dependency_constraints.sh --verbose
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "⚠️ Dependency constraints validation completed with warnings (non-blocking)."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "❌ Dependency constraints validation failed with exit code $status."
            exit "$status"
          fi

      - name: Validate requirements lock contract
        run: |
          set -euo pipefail
          python scripts/validation/check_requirements_lock_contract.py

  frontdoor-contract:
    name: Frontdoor contract
    needs: [preflight]
    if: needs.preflight.outputs.run_frontdoor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: web/secure-landing/.nvmrc
          cache: npm
          cache-dependency-path: web/secure-landing/package-lock.json

      - name: Install frontdoor dependencies
        run: |
          set -euo pipefail
          cd web/secure-landing
          npm ci

      - name: Run frontdoor Node tests with coverage floor
        # Uses Node 22's built-in --experimental-test-coverage. The
        # --test-coverage-lines / --test-coverage-functions flags inside
        # the script make the Node test runner exit non-zero if either
        # threshold drops below the floor. Floors are set just below the
        # current measured baseline (line=48.88%, function=50.09% as of
        # 2026-05-04 — pinned at 45/45 in package.json) so any regression
        # fails CI; ratchet upward in package.json as coverage improves —
        # never silently lower. Replaces the previous separate `npm test`
        # + `npm run test:coverage` pair to avoid running build:portal
        # and the test suite twice.
        run: |
          set -euo pipefail
          cd web/secure-landing
          npm run test:coverage

      - name: Build frontdoor production bundle
        run: |
          set -euo pipefail
          cd web/secure-landing
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/ms-playwright
          # Cache key is pinned to the front-door package-lock so it
          # invalidates automatically when @playwright/test bumps.
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/secure-landing/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          cd web/secure-landing
          npx playwright install --with-deps chromium

      - name: Run frontdoor + portal browser smoke suite
        env:
          CI: "1"
        run: |
          set -euo pipefail
          cd web/secure-landing
          # Runs all Playwright projects in dependency order:
          # chromium (@frontdoor-browser) + portal-setup → portal-browser.
          npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report
          path: web/secure-landing/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    needs: [preflight]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Selective cleanup - free up disk while preserving Python toolcache
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Keep full history so diff-based pylint selection can resolve the PR merge-base reliably.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12" # latest for linting

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-lint.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install lint dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt
          echo "Disk space after dependency install:"
          df -h

      - name: Black (formatting)
        run: black --check --diff --line-length=127 src/ tests/

      - name: isort (imports)
        run: isort --check-only --diff --profile=black --line-length=127 src/ tests/

      - name: Lint with flake8 and pylint
        run: |
          set -euo pipefail
          PYTHON_BIN=python \
          LINT_RUNNER_GITHUB_EVENT_NAME="${{ github.event_name }}" \
          LINT_RUNNER_GITHUB_BEFORE="${{ github.event.before }}" \
          LINT_RUNNER_GITHUB_SHA="${{ github.sha }}" \
          ./scripts/lint_runner.sh pr

      - name: JSON serialization guardrails
        run: |
          python scripts/validation/check_raw_json_usage.py

      - name: Validate CI contracts
        run: |
          make validate-ci

  typecheck:
    name: Type Check
    needs: [preflight, lint]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Pin to the same versions present in requirements/{base,dev}.txt so
          # the typecheck environment matches the rest of CI. We can't use
          # `pip install -c requirements/all.txt` because that file contains
          # `coverage[toml]==...` and pip rejects extras in constraint files
          # ("ERROR: Constraints cannot have extras"). Inline-pinning is the
          # cleanest workaround that still respects the lockfile.
          pip install "mypy==1.20.1" "types-PyYAML==6.0.12.20260408" "pydantic==2.13.3"
          pip install -e . --no-deps

      - name: Type check with mypy (critical modules)
        # mypy hard-fails for critical modules.
        # This normalizes typecheck policy with ci.yml (parity debt reduction).
        #
        # Phase 0.3 expansion: mypy now also enforces a vetted slice of core/.
        # Phase 1.2 PR A expansion: the new api/ package is fully typed and
        # mypy-strict from the start, so it joins the whitelist.
        # N-1 expansion (2026-05-24): the orchestrator/ paid-pilot Protocol
        # packages (queue/, storage/, artifact_store/) are clean and join the
        # whitelist; see docs/ci/TYPE_CHECKING_POLICY.md.
        # Per docs/ci/TYPE_CHECKING_POLICY.md, additions to this whitelist must
        # pass `mypy --config-file=mypy.ini <path>` before being added here.
        # Expand the list as packages are cleaned up; do NOT enable
        # `core/` as a whole until all 21 currently-failing files are fixed.
        run: |
          mypy --config-file=mypy.ini \
            src/transformation_portal/api/ \
            src/transformation_portal/lux_depth_v3/ \
            src/transformation_portal/orchestrator/queue/ \
            src/transformation_portal/orchestrator/storage/ \
            src/transformation_portal/orchestrator/artifact_store/ \
            src/transformation_portal/core/geometry/ \
            src/transformation_portal/core/processing/ \
            src/transformation_portal/core/ml_dependency_health.py \
            src/transformation_portal/core/da3_runtime.py

  test:
    needs: [preflight, lint, typecheck]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.11"
            device: cpu
            test-type: core
            # ADR-044: Positive marker selection for core tests (unit, security, regression, golden, integration)
            # Explicitly excludes ml/slow/benchmark for behavioral equivalence during transition
            markexpr: "(unit or security or regression or golden or integration) and not ml and not slow and not benchmark"
          - python-version: "3.12"
            device: cpu
            test-type: core
            # ADR-044: Positive marker selection for core tests
            markexpr: "(unit or security or regression or golden or integration) and not ml and not slow and not benchmark"
          - python-version: "3.11"
            device: cpu
            test-type: ml
            # PR ML tier: fast ML unit coverage only (exclude slow/integration/benchmark suites).
            markexpr: "ml and not slow and not integration and not benchmark"

    name: test (${{ matrix.python-version }}, ${{ matrix.device }}, ${{ matrix.test-type }})

    steps:
      - name: Maximize available disk space
        run: |
          set -euo pipefail
          echo "Initial disk usage:"
          df -h
          # Selective cleanup - free up disk while preserving Python toolcache
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        continue-on-error: true
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        continue-on-error: true
        with:
          fetch-depth: 1
          submodules: false

      - name: Fail clearly if checkout is down
        if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        run: |
          echo "::error::GitHub checkout failed twice (transient GitHub infra / HTTP 500 / packfile). Re-run workflow."
          exit 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.test-type }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.test-type }}-
            ${{ runner.os }}-pip-

      - name: Install core dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install pytest pytest-cov
          python -m pip install -r requirements-ci.txt
          echo "Disk space after core install:"
          df -h

      - name: Install ML dependencies (ml leg only)
        if: matrix.test-type == 'ml'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
        run: |
          set -euo pipefail
          bash scripts/ci/install_ml_test_dependencies.sh --skip-ci-requirements --include-rawpy

          # Note: pip cache purge removed - cache now managed by actions/cache@v5
          rm -rf ~/.cache/huggingface || true
          rm -rf /tmp/pip-* || true
          echo "Disk space after ML install:"
          df -h

      - name: Install package (core legs only)
        if: matrix.test-type == 'core'
        run: |
          set -euo pipefail
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Install archive report test dependencies (core legs only)
        if: matrix.test-type == 'core'
        run: |
          set -euo pipefail
          python -m pip install -r requirements/tools-archive.txt
          python -c "import numpy, pandas, jsonschema"

      - name: Run tests
        env:
          PYTHONNOUSERSITE: "1"
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
          HF_HOME: "/tmp/hf_home"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache"
          TRANSFORMERS_OFFLINE: "1"
          # Prevent thread oversubscription on shared CI runners (ML CPU tests)
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          set -euo pipefail

          echo "Running tests with marker expression: ${{ matrix.markexpr }}"

          # ML tier: skip coverage (saves tracing + report I/O overhead on PR feedback path)
          # Core tier: enforce minimum global coverage (per-package floors checked separately
          # by scripts/ci/check_per_package_coverage.py after the pytest run).
          if [ "${{ matrix.test-type }}" = "ml" ]; then
            COV_FLAGS="--no-cov"
            echo "ML tier: coverage disabled for faster PR feedback"
          else
            COV_FLAGS="--cov=src/transformation_portal --cov=src/tp --cov=lux_depth_v3 --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=30"
            echo "Core tier: enforcing 30% minimum global coverage"
          fi

          # ML tier: add duration profiling for triage of slow tests
          if [ "${{ matrix.test-type }}" = "ml" ]; then
            EXTRA_FLAGS="--durations=25 --durations-min=1.0"
          else
            EXTRA_FLAGS=""
          fi

          set +e
          pytest -v tests/ -ra -m "${{ matrix.markexpr }}" --maxfail=1 \
            $COV_FLAGS \
            $EXTRA_FLAGS
          rc=$?
          set -e

          # If ML marker expression selects zero tests (exit=5), fail fast.
          # This signals a marker taxonomy issue that must be fixed, rather than
          # silently expanding into an unbounded "not slow" fallback run.
          if [ "${{ matrix.test-type }}" = "ml" ] && [ "$rc" -eq 5 ]; then
            echo "::error::ML marker expression '${{ matrix.markexpr }}' selected zero tests (exit=5)."
            echo "Fix marker wiring — do not rely on fallback reruns."
            exit 1
          fi

          # Display coverage summary (core tier only)
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
            ls -lh coverage.xml htmlcov/ || true
          fi

          # Enforce per-package line and branch coverage floors
          # (core tier only, only when tests passed and a coverage.xml was actually
          # produced — failed runs already exited via rc above).
          if [ "${{ matrix.test-type }}" != "ml" ] && [ "$rc" -eq 0 ] && [ -f coverage.xml ]; then
            python scripts/ci/check_per_package_coverage.py coverage.xml || rc=$?
            python scripts/ci/check_per_package_branch_coverage.py coverage.xml || rc=$?
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || rc=$?
            python scripts/ci/check_cold_zone_touched_files.py coverage.xml --compare-ref origin/main || rc=$?
          fi

          # Cleanup regardless of outcome
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/transformers_cache || true
          rm -rf /tmp/hf_home || true
          rm -rf ~/.cache/huggingface || true

          exit "$rc"

      # N-2 (audit 2026-05-18 finding #2): ML sampled coverage on cold packages.
      # The main ML test step runs with --no-cov for PR-feedback speed; this
      # follow-up step re-runs a small, focused subset of ML tests with coverage
      # tracing on src/transformation_portal/vlm and spatial_ai/segmentation,
      # producing advisory coverage-ml-sampled.xml / status artifacts.
      # Intentionally non-blocking (`continue-on-error: true`): artifacts are
      # evidence for the cold-zone ratchet plan in
      # docs/testing/COLD_ZONE_COVERAGE_PROGRAM.md, not a gate. Bypasses the
      # marker-zero check by selecting both packages' ML-marked tests
      # explicitly, and writes a sentinel when the selection is empty.
      - name: ML sampled coverage (advisory, non-blocking)
        if: matrix.test-type == 'ml'
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: "1"
          HF_HOME: "/tmp/hf_home_cov"
          TRANSFORMERS_CACHE: "/tmp/transformers_cache_cov"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          echo "Running ML sampled coverage on vlm + spatial_ai/segmentation..."
          status_file="coverage-ml-sampled-status.txt"
          rm -f coverage-ml-sampled.xml "$status_file"
          set +e
          pytest -v tests/vlm tests/spatial_ai/segmentation \
            -ra \
            -m "ml and not slow and not integration and not benchmark" \
            --cov=src/transformation_portal/vlm \
            --cov=src/transformation_portal/spatial_ai/segmentation \
            --cov-report=term \
            --cov-report=xml:coverage-ml-sampled.xml
          pytest_rc=$?
          set -e
          if [ "$pytest_rc" -eq 0 ]; then
            echo "status=coverage-generated" > "$status_file"
          elif [ "$pytest_rc" -eq 5 ]; then
            echo "::warning::ML sampled coverage selected zero tests (exit=5); uploading sentinel evidence."
            echo "status=marker-zero" > "$status_file"
          else
            echo "::warning::ML sampled coverage exited $pytest_rc; advisory artifact retained when available."
            echo "status=pytest-failed" > "$status_file"
          fi
          echo "pytest_exit_code=$pytest_rc" >> "$status_file"
          rm -rf /tmp/transformers_cache_cov /tmp/hf_home_cov || true

      # Only core legs generate coverage.xml/htmlcov; ML deliberately runs with --no-cov for fast PR feedback.
      - name: Upload coverage reports
        if: always() && matrix.test-type == 'core'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.test-type }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 30

      # N-2: companion artifact upload for the ML sampled coverage step above.
      # Non-blocking and only meaningful when matrix.test-type == 'ml'.
      - name: Upload ML sampled coverage artifact
        if: always() && matrix.test-type == 'ml'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-ml-sampled-${{ matrix.python-version }}
          path: |
            coverage-ml-sampled.xml
            coverage-ml-sampled-status.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Final disk usage
        if: always()
        run: |
          set -euo pipefail
          echo "Final disk usage:"
          df -h

  generate-manifest:
    name: Build Montecito Manifest
    needs: [preflight, test]
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Governance gate threshold: absolute classified-row count (not a percentage).
      # Phase 2: require at least 10 classified rows for governance enforcement.
      # Use GOV_MIN_CLASSIFIED_ROWS to avoid "95% vs 95 rows" ambiguity.
      GOV_MIN_CLASSIFIED_ROWS: "10"

    outputs:
      governance_passed: ${{ steps.governance.outputs.passed }}
      governance_note: ${{ steps.governance.outputs.note }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies for manifest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Run Montecito Manifest Tool
        id: manifest
        run: |
          set -euo pipefail
          OUT="montecito_manifest.csv"
          python tools/montecito_manifest.py . "$OUT"
          if [ ! -f "$OUT" ]; then
            echo "Error: Montecito manifest was not created at expected path: $OUT" >&2
            exit 1
          fi
          echo "manifest_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic dataset telemetry
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py metrics \
            --manifest montecito_manifest.csv \
            --out-json manifest_metrics.json \
            --out-audit-csv manifest_audit_extract.csv

      - name: Generate Merkle roots
        run: |
          set -euo pipefail
          python tools/manifest_telemetry.py merkle \
            --manifest montecito_manifest.csv \
            --out-json manifest_merkle.json

      - name: Select deterministic Merkle proof target
        id: merkle_target
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("montecito_manifest.csv")
          fn = str(df.iloc[0]["filename"])
          with open("merkle_target.txt", "w", encoding="utf-8") as f:
              f.write(fn + "\n")
          print(fn)
          PY
          echo "filename=$(cat merkle_target.txt)" >> "$GITHUB_OUTPUT"

      - name: Merkle inclusion proof verification (CI Gate)
        run: |
          set -euo pipefail
          TARGET="${{ steps.merkle_target.outputs.filename }}"
          python tools/manifest_telemetry.py merkle-proof \
            --manifest montecito_manifest.csv \
            --filename "$TARGET" \
            --out-json merkle_proof.json
          python tools/manifest_telemetry.py merkle-verify \
            --proof-json merkle_proof.json \
            --out-json merkle_verify_report.json

      - name: Governance completeness check (CI Gate)
        id: governance
        run: |
          set -euo pipefail
          if [ -f rights_privacy_governance.csv ]; then
            set +e
            python tools/manifest_telemetry.py governance-gate \
              --governance-csv rights_privacy_governance.csv \
              --min-classified "${GOV_MIN_CLASSIFIED_ROWS}" \
              --out-json governance_gate_report.json
            GOV_EXIT=$?
            set -e
            if [ "$GOV_EXIT" -eq 0 ]; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
              echo "note=governance gate passed (min_classified_rows=${GOV_MIN_CLASSIFIED_ROWS})" >> "$GITHUB_OUTPUT"
            else
              echo "passed=false" >> "$GITHUB_OUTPUT"
              echo "note=governance gate FAILED (min_classified_rows=${GOV_MIN_CLASSIFIED_ROWS})" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            # Produce JSON with consistent schema even when governance file is absent
            cat > governance_gate_report.json <<SKIPPED_JSON
          {
            "schema_version": "1.0",
            "governance_csv": null,
            "rows_total": 0,
            "classified_rows": 0,
            "unclassified_rows": 0,
            "coverage_percent": 0.0,
            "classification_column": null,
            "min_classified_required": ${GOV_MIN_CLASSIFIED_ROWS},
            "threshold_mode": "rows",
            "passed": null,
            "note": "rights_privacy_governance.csv not present; skipping governance gate"
          }
          SKIPPED_JSON
            echo "passed=skipped" >> "$GITHUB_OUTPUT"
            echo "note=rights_privacy_governance.csv not present; governance gate skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload manifest artifact
        if: ${{ steps.manifest.outputs.manifest_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: montecito-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dataset-governance-telemetry
          path: |
            manifest_metrics.json
            manifest_audit_extract.csv
            manifest_merkle.json
            merkle_target.txt
            merkle_proof.json
            merkle_verify_report.json
            governance_gate_report.json
          if-no-files-found: error
          retention-days: 30

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [preflight, lightweight, dependency-constraints, frontdoor-contract, lint, typecheck, test, generate-manifest]
    if: ${{ always() }}
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Summarize upstream results
        run: |
          set -euo pipefail
          echo "Preflight decision:"
          echo "  run_full: ${{ needs.preflight.outputs.run_full }}"
          echo "  run_frontdoor: ${{ needs.preflight.outputs.run_frontdoor }}"
          echo "  reason:   ${{ needs.preflight.outputs.reason }}"
          echo ""
          echo "Job results:"
          echo "  lightweight:       ${{ needs.lightweight.result }}"
          echo "  dependency-constraints: ${{ needs['dependency-constraints'].result }}"
          echo "  frontdoor-contract:${{ needs['frontdoor-contract'].result }}"
          echo "  lint:              ${{ needs.lint.result }}"
          echo "  typecheck:         ${{ needs.typecheck.result }}"
          echo "  test:              ${{ needs.test.result }}"
          echo "  generate-manifest: ${{ needs['generate-manifest'].result }}"
          echo ""
          echo "Dataset Governance:"
          echo "  governance_passed: ${{ needs['generate-manifest'].outputs.governance_passed || 'N/A' }}"
          echo "  governance_note:   ${{ needs['generate-manifest'].outputs.governance_note || 'N/A' }}"

      - name: Enforce pass/fail
        id: gate
        run: |
          set -euo pipefail

          # Initialize result variables with default values for defensive coding.
          # These variables are used in the full-suite enforcement block below.
          # Having defaults ensures the script is robust if the structure ever changes.
          # Note: lightweight and dependency-constraints are checked via direct
          # ${{ needs.*.result }} syntax and exit early, so they don't need variables.
          lint_result="skipped"
          typecheck_result="skipped"
          test_result="skipped"
          manifest_result="skipped"
          frontdoor_result="skipped"

          # Lightweight must always succeed
          if [ "${{ needs.lightweight.result }}" != "success" ]; then
            echo "❌ lightweight checks failed"
            echo "GATE_STATUS=failure" >> "$GITHUB_ENV"
            echo "GATE_MODE=lightweight (failed)" >> "$GITHUB_ENV"
            exit 1
          fi

          # Dependency constraints must always succeed (ADR-032)
          if [ "${{ needs['dependency-constraints'].result }}" != "success" ]; then
            echo "❌ dependency-constraints checks failed"
            echo "GATE_STATUS=failure" >> "$GITHUB_ENV"
            echo "GATE_MODE=dependency-constraints (failed)" >> "$GITHUB_ENV"
            exit 1
          fi

          # If full suite was required, enforce all jobs
          if [ "${{ needs.preflight.outputs.run_full }}" = "true" ]; then
            ok="true"
            frontdoor_result="${{ needs['frontdoor-contract'].result }}"
            lint_result="${{ needs.lint.result }}"
            typecheck_result="${{ needs.typecheck.result }}"
            test_result="${{ needs.test.result }}"
            manifest_result="${{ needs['generate-manifest'].result }}"

            if [ "${{ needs.preflight.outputs.run_frontdoor }}" = "true" ] && [ "${frontdoor_result}" != "success" ]; then
              echo "❌ frontdoor-contract did not succeed (result=${frontdoor_result})"
              ok="false"
            fi

            if [ "${lint_result}" != "success" ]; then
              echo "❌ lint did not succeed (result=${lint_result})"
              ok="false"
            fi

            if [ "${typecheck_result}" != "success" ]; then
              if [ "${typecheck_result}" = "skipped" ] && [ "${lint_result}" != "success" ]; then
                echo "ℹ️ typecheck skipped due to failed dependency (lint=${lint_result})"
              else
                echo "❌ typecheck did not succeed (result=${typecheck_result})"
              fi
              ok="false"
            fi

            if [ "${test_result}" != "success" ]; then
              # Test job depends on preflight, lint, and typecheck (see workflow matrix).
              # Preflight is a scheduling dependency (determines run_full), not an execution
              # dependency that could cause test to be skipped. lint and typecheck are the
              # actual execution dependencies. If test was skipped, check if it was likely
              # due to lint or typecheck not succeeding.
              dependency_not_success="false"
              [ "${lint_result}" != "success" ] && dependency_not_success="true"
              [ "${typecheck_result}" != "success" ] && dependency_not_success="true"

              if [ "${test_result}" = "skipped" ] && [ "${dependency_not_success}" = "true" ]; then
                echo "ℹ️ test matrix skipped due to failed dependency (lint=${lint_result}, typecheck=${typecheck_result})"
              else
                echo "❌ test matrix did not succeed (result=${test_result})"
              fi
              ok="false"
            fi

            if [ "${manifest_result}" != "success" ]; then
              if [ "${manifest_result}" = "skipped" ] && [ "${test_result}" != "success" ]; then
                echo "ℹ️ generate-manifest skipped due to failed dependency (test=${test_result})"
              else
                echo "❌ generate-manifest did not succeed (result=${manifest_result})"
              fi
              ok="false"
            fi

            if [ "$ok" != "true" ]; then
              echo "GATE_STATUS=failure" >> "$GITHUB_ENV"
              echo "GATE_MODE=full suite (failed)" >> "$GITHUB_ENV"
              echo "CI Gate: FAILED (full suite required)"
              exit 1
            fi

            echo "GATE_STATUS=success" >> "$GITHUB_ENV"
            echo "GATE_MODE=full suite" >> "$GITHUB_ENV"
            echo "✅ CI Gate: PASSED (full suite)"
            exit 0
          fi

          # Lightweight mode: heavy jobs are allowed to be skipped
          echo "GATE_STATUS=success" >> "$GITHUB_ENV"
          echo "GATE_MODE=lightweight-only" >> "$GITHUB_ENV"
          echo "✅ CI Gate: PASSED (lightweight-only mode)"

      - name: Set governance status variables
        if: always()
        run: |
          GOV_PASSED="${{ needs['generate-manifest'].outputs.governance_passed || 'N/A' }}"
          GOV_NOTE="${{ needs['generate-manifest'].outputs.governance_note || 'N/A' }}"
          if [ "$GOV_PASSED" = "true" ]; then
            GOV_EMOJI="✅"
            GOV_STATUS_TEXT="PASSED"
          elif [ "$GOV_PASSED" = "false" ]; then
            GOV_EMOJI="❌"
            GOV_STATUS_TEXT="FAILED"
          elif [ "$GOV_PASSED" = "skipped" ]; then
            GOV_EMOJI="⏭️"
            GOV_STATUS_TEXT="SKIPPED"
          elif [ "$GOV_PASSED" = "N/A" ]; then
            GOV_EMOJI="⏹️"
            GOV_STATUS_TEXT="NOT RUN"
          else
            GOV_EMOJI="❓"
            GOV_STATUS_TEXT="UNKNOWN"
          fi
          echo "GOV_PASSED=$GOV_PASSED" >> "$GITHUB_ENV"
          echo "GOV_NOTE=$GOV_NOTE" >> "$GITHUB_ENV"
          echo "GOV_EMOJI=$GOV_EMOJI" >> "$GITHUB_ENV"
          echo "GOV_STATUS_TEXT=$GOV_STATUS_TEXT" >> "$GITHUB_ENV"

      - name: Write CI Gate Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## CI Gate Summary"
            echo ""
            echo "### Preflight Decision"
            echo "- **run_full**: ${{ needs.preflight.outputs.run_full }}"
            echo "- **reason**: ${{ needs.preflight.outputs.reason }}"
            echo ""
            echo "### Job Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| lightweight | ${{ needs.lightweight.result }} |"
            echo "| dependency-constraints | ${{ needs['dependency-constraints'].result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| typecheck | ${{ needs.typecheck.result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| generate-manifest | ${{ needs['generate-manifest'].result }} |"
            echo ""
            echo "### Dataset Governance Status"
            echo "${GOV_EMOJI} **Governance Gate**: ${GOV_STATUS_TEXT}"
            echo ""
            echo "**Note**: ${GOV_NOTE}"
          } >> "$GITHUB_STEP_SUMMARY"
