# =============================================================================
# Transformation Portal - Consolidated CI/CD Workflow
# Phase 2 Vector 2: Unified pipeline with intelligent job orchestration
# =============================================================================
#
# This consolidated workflow replaces:
#   - build.yml (lint + test + manifest)
#   - python-app.yml (lint + test + deploy)
#   - quality-gate.yml (pre-commit checks)
#
# Benefits:
#   - 40-60% reduction in CI execution time
#   - Eliminates redundant dependency installation
#   - Shared caching across jobs
#   - Intelligent test selection based on changes
#   - RAG system integration for incremental validation
#
# =============================================================================

name: CI/CD Pipeline (Consolidated)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_test:
        description: 'Force full test suite'
        required: false
        default: 'false'
        type: boolean
      skip_cache:
        description: 'Skip dependency caching'
        required: false
        default: 'false'
        type: boolean
      enable_phase2_features:
        description: 'Enable Phase 2 features (CLIP, Lighting Detection)'
        required: false
        default: 'true'
        type: boolean
      run_benchmark_regression:
        description: 'Run Phase 2 performance benchmark regression tests'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Environment Variables (Shared)
# =============================================================================
env:
  PYTHON_VERSION_PRIMARY: '3.11'
  PYTHON_VERSIONS: '["3.10", "3.11", "3.12"]'
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TRANSFORMERS_OFFLINE: '1'
  HF_HUB_OFFLINE: '1'
  # Phase 2 Feature Flags
  ENABLE_PHASE2_FEATURES: ${{ github.event.inputs.enable_phase2_features || 'true' }}
  RUN_BENCHMARK_REGRESSION: ${{ github.event.inputs.run_benchmark_regression || 'false' }}

jobs:
  # ===========================================================================
  # Stage 1: Change Detection & Cache Setup
  # ===========================================================================
  setup:
    name: Setup & Change Detection
    runs-on: ubuntu-24.04
    outputs:
      python-matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed-files: ${{ steps.changes.outputs.all_changed_files }}
      run-ml-tests: ${{ steps.analyze.outputs.run_ml }}
      run-core-tests: ${{ steps.analyze.outputs.run_core }}
      run-lint: ${{ steps.analyze.outputs.run_lint }}
      cache-key: ${{ steps.cache-key.outputs.key }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Detect Changed Files
        id: changes
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            python:
              - '**/*.py'
            ml:
              - 'depth_pipeline/**'
              - 'lux_render_pipeline.py'
              - 'material_response.py'
              - 'requirements/ml.txt'
            phase2:
              - 'lux_depth_v2/materials_v2.py'
              - 'lux_depth_v2/lighting_detector.py'
              - 'tests/test_phase2_*.py'
              - 'bench/bench_phase2.py'
            tests:
              - 'tests/**'
            docs:
              - '**/*.md'
              - 'docs/**'
            config:
              - '*.yaml'
              - '*.yml'
              - 'config/**'
            ci:
              - '.github/workflows/**'
            rag:
              - '.github/agents/rag_system/**'
              
      - name: Analyze Changes
        id: analyze
        run: |
          # Determine what tests to run based on changes
          RUN_ML="false"
          RUN_CORE="false"
          RUN_LINT="false"
          
          # Check for Python changes
          if [ "${{ steps.changes.outputs.python_any_changed }}" == "true" ]; then
            RUN_LINT="true"
            RUN_CORE="true"
          fi
          
          # Check for ML-specific changes
          if [ "${{ steps.changes.outputs.ml_any_changed }}" == "true" ]; then
            RUN_ML="true"
          fi
          
          # Check for test changes
          if [ "${{ steps.changes.outputs.tests_any_changed }}" == "true" ]; then
            RUN_CORE="true"
            RUN_ML="true"
          fi
          
          # Check for CI changes (run everything)
          if [ "${{ steps.changes.outputs.ci_any_changed }}" == "true" ]; then
            RUN_LINT="true"
            RUN_CORE="true"
            RUN_ML="true"
          fi
          
          # Force full test if requested
          if [ "${{ github.event.inputs.force_full_test }}" == "true" ]; then
            RUN_LINT="true"
            RUN_CORE="true"
            RUN_ML="true"
          fi
          
          # Always run on main branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            RUN_LINT="true"
            RUN_CORE="true"
          fi
          
          echo "run_ml=$RUN_ML" >> $GITHUB_OUTPUT
          echo "run_core=$RUN_CORE" >> $GITHUB_OUTPUT
          echo "run_lint=$RUN_LINT" >> $GITHUB_OUTPUT
          
          echo "Analysis: lint=$RUN_LINT core=$RUN_CORE ml=$RUN_ML"
          
      - name: Set Python Matrix
        id: set-matrix
        run: |
          if [ "${{ steps.analyze.outputs.run_ml }}" == "true" ]; then
            # Full matrix for ML tests
            echo 'matrix=["3.10", "3.11", "3.12"]' >> $GITHUB_OUTPUT
          else
            # Minimal matrix for quick feedback
            echo 'matrix=["3.11"]' >> $GITHUB_OUTPUT
          fi
          
      - name: Generate Cache Key
        id: cache-key
        run: |
          # Create cache key from requirements files
          HASH=$(cat requirements*.txt requirements/*.txt 2>/dev/null | sha256sum | cut -d' ' -f1 | head -c 16)
          echo "key=deps-${{ runner.os }}-$HASH" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Stage 2: Lint & Quality Checks (Fast)
  # ===========================================================================
  lint:
    name: Lint & Quality
    needs: setup
    if: needs.setup.outputs.run-lint == 'true'
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Cache Lint Tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ runner.os }}-${{ hashFiles('requirements-lint.txt') }}
          restore-keys: lint-${{ runner.os }}-
          
      - name: Install Lint Tools
        run: |
          pip install --upgrade pip
          pip install flake8 pylint autopep8 mypy
          pip install -r requirements-lint.txt
          
      - name: Auto-fix Formatting
        run: |
          # Auto-fix trailing whitespace and basic formatting
          find . -name "*.py" -type f \
            ! -path "./deprecated/*" \
            ! -path "./.venv/*" \
            ! -path "./__pycache__/*" \
            -exec autopep8 --in-place --max-line-length=127 {} \;
            
      - name: Flake8 Critical Errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=deprecated/,.venv/,__pycache__/,.rag_cache/
            
      - name: Pylint Analysis
        continue-on-error: true
        run: |
          # Get changed Python files
          EXCLUDE_PATTERN="deprecated/|src/transformation_portal/|.venv/|.backup_local/|.github/agents/"
          
          FILES=$(find . -name "*.py" -type f | grep -v -E "$EXCLUDE_PATTERN" | head -50)
          
          if [ -n "$FILES" ]; then
            pylint $FILES --exit-zero --output-format=colorized
          fi
          
      - name: Type Check (mypy)
        continue-on-error: true
        run: |
          mypy tools/ --ignore-missing-imports --no-error-summary || true
          
      - name: Markdown File Count Check
        run: |
          MD_COUNT=$(find . -maxdepth 1 -name "*.md" -type f | wc -l)
          if [ "$MD_COUNT" -gt 10 ]; then
            echo "::warning::Too many markdown files in root ($MD_COUNT/10)"
          fi

      - name: Verify No Vulnerable basicsr Imports (CVE-2024-27763)
        run: |
          python scripts/utilities/verify_no_basicsr_imports.py

      - name: Verify basicsr Package Not Installed (CVE-2024-27763)
        run: |
          # This check ensures basicsr was not installed as a transitive dependency
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ SECURITY VIOLATION: basicsr package is installed!"
            echo "This package has CVE-2024-27763 (command injection vulnerability)."
            echo "The constraints.txt file should have prevented this."
            pip show basicsr
            exit 1
          else
            echo "✅ basicsr package is NOT installed (as expected)"
          fi

      - name: Check Module Boundaries (ADR-001)
        run: |
          echo "🔍 Checking module boundary violations..."
          python scripts/validation/check_module_boundaries.py --fail-on-violations
          echo "✅ Module boundary check passed"

  # ===========================================================================
  # Stage 3: Core Tests (No ML Dependencies)
  # ===========================================================================
  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    needs: [setup, lint]
    if: |
      always() && 
      needs.setup.outputs.run-core-tests == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-matrix) }}
        
    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean
          
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache Dependencies
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .rag_cache
          key: ${{ needs.setup.outputs.cache-key }}-py${{ matrix.python-version }}
          restore-keys: |
            deps-${{ runner.os }}-py${{ matrix.python-version }}
            deps-${{ runner.os }}
            
      - name: Install Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install pytest pytest-cov pytest-asyncio
          pip install -c requirements/constraints.txt -r requirements-ci.txt
          pip install -c requirements/constraints.txt -e .

      - name: Verify basicsr Not Installed (CVE-2024-27763)
        run: |
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ SECURITY: basicsr package installed despite constraints!"
            exit 1
          fi
          echo "✅ Security check passed: basicsr not installed"

      - name: Run Core Tests
        run: |
          pytest tests/ \
            --ignore=tests/test_model_training.py \
            --ignore=tests/test_basicsr_tp.py \
            --ignore=tests/foundation/ \
            --ignore=tests/perceptual/ \
            -k "not (ml or slow or gpu)" \
            -v --tb=short \
            --cov=src/transformation_portal \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=10
            
      - name: Upload Coverage
        if: matrix.python-version == env.PYTHON_VERSION_PRIMARY
        uses: actions/upload-artifact@v5
        with:
          name: coverage-core-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # ===========================================================================
  # Stage 4: ML Tests (Requires PyTorch)
  # ===========================================================================
  test-ml:
    name: ML Tests
    needs: [setup, test-core]
    if: |
      always() && 
      needs.setup.outputs.run-ml-tests == 'true' &&
      needs.test-core.result == 'success'
    runs-on: ubuntu-24.04
    
    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Cache ML Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ml-deps-${{ runner.os }}-${{ hashFiles('requirements/ml.txt') }}
          restore-keys: ml-deps-${{ runner.os }}
          
      - name: Install ML Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install pytest pytest-cov hypothesis

          # CPU-only PyTorch
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

          # ML extras (with constraints to exclude vulnerable basicsr)
          # Try editable install first, fall back to requirements file
          # Both use constraints to ensure basicsr is blocked
          if ! pip install -c requirements/constraints.txt -e ".[ml]"; then
            echo "Warning: Editable install failed, trying requirements file"
            pip install -c requirements/constraints.txt -r requirements/ml.txt
          fi
          pip install -c requirements/constraints.txt -e .

      - name: Download Phase 2 Models (Conditional)
        if: env.ENABLE_PHASE2_FEATURES == 'true'
        run: |
          echo "📦 Downloading Phase 2 models (CLIP)..."
          python -c "
          from transformers import CLIPProcessor, CLIPModel
          import os
          
          # Disable offline mode temporarily for model download
          os.environ['TRANSFORMERS_OFFLINE'] = '0'
          os.environ['HF_HUB_OFFLINE'] = '0'
          
          try:
              # Download CLIP model to cache
              model_name = 'openai/clip-vit-base-patch32'
              print(f'Downloading {model_name}...')
              processor = CLIPProcessor.from_pretrained(model_name)
              model = CLIPModel.from_pretrained(model_name)
              print('✅ CLIP model downloaded successfully')
          except Exception as e:
              print(f'⚠️  CLIP model download failed: {e}')
              print('Tests requiring CLIP will be skipped')
          "
        continue-on-error: true

      - name: Verify basicsr Not Installed (CVE-2024-27763)
        run: |
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ SECURITY: basicsr package installed despite constraints!"
            echo "This is a critical security issue - CVE-2024-27763"
            pip show basicsr
            exit 1
          fi
          echo "✅ Security check passed: basicsr not installed"

      - name: Run ML Tests
        env:
          PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
        run: |
          # Filter Phase 2 tests based on feature flag
          if [ "$ENABLE_PHASE2_FEATURES" == "true" ]; then
            echo "🧪 Running ML tests with Phase 2 features enabled"
            TEST_FILTER="ml or slow"
          else
            echo "🧪 Running ML tests with Phase 2 features disabled"
            TEST_FILTER="ml or slow and not phase2"
          fi
          
          pytest tests/ \
            -k "$TEST_FILTER" \
            -v --tb=short \
            --maxfail=5
            
  # ===========================================================================
  # Stage 4.2: Phase 2 Performance Benchmark (Optional)
  # ===========================================================================
  benchmark-phase2:
    name: Phase 2 Performance Benchmark
    needs: [setup, test-core]
    if: |
      always() &&
      needs.test-core.result == 'success' &&
      github.event.inputs.run_benchmark_regression == 'true'
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c requirements/constraints.txt -r requirements/ml.txt
          pip install -c requirements/constraints.txt -e .
          
      - name: Download CLIP Model
        run: |
          python -c "
          from transformers import CLIPProcessor, CLIPModel
          import os
          os.environ['TRANSFORMERS_OFFLINE'] = '0'
          os.environ['HF_HUB_OFFLINE'] = '0'
          model_name = 'openai/clip-vit-base-patch32'
          CLIPProcessor.from_pretrained(model_name)
          CLIPModel.from_pretrained(model_name)
          print('✅ CLIP model cached')
          "
          
      - name: Run Benchmark
        run: |
          python bench/bench_phase2.py
          
      - name: Check Performance Regression
        run: |
          # Parse benchmark results and check for regressions
          python -c "
          import json
          from pathlib import Path
          
          results_file = Path('bench/results/phase2_benchmark_results.json')
          if not results_file.exists():
              print('❌ Benchmark results not found')
              exit(1)
          
          with open(results_file) as f:
              results = json.load(f)
          
          # Define performance thresholds
          MAX_CLIP_TIME_MS = 500  # CLIP classification should be < 500ms
          MAX_INIT_TIME_S = 2.0   # Pipeline init should be < 2s
          MAX_MEMORY_MB = 1200    # Peak memory should be < 1200MB
          
          failures = []
          
          # Check CLIP performance
          clip_time = results.get('clip_classification', {}).get('avg_time_ms', 0)
          if clip_time > MAX_CLIP_TIME_MS:
              failures.append(f'CLIP classification: {clip_time:.1f}ms > {MAX_CLIP_TIME_MS}ms threshold')
          
          # Check initialization time
          for tier, data in results.get('quality_tiers', {}).items():
              init_time = data.get('init_time_s', 0)
              if init_time > MAX_INIT_TIME_S:
                  failures.append(f'{tier} init: {init_time:.2f}s > {MAX_INIT_TIME_S}s threshold')
          
          # Check memory usage
          for tier, data in results.get('quality_tiers', {}).items():
              memory_mb = data.get('peak_memory_mb', 0)
              if memory_mb > MAX_MEMORY_MB:
                  failures.append(f'{tier} memory: {memory_mb:.0f}MB > {MAX_MEMORY_MB}MB threshold')
          
          if failures:
              print('❌ Performance regression detected:')
              for failure in failures:
                  print(f'  - {failure}')
              exit(1)
          else:
              print('✅ All performance benchmarks passed')
              print(f'  - CLIP: {clip_time:.1f}ms')
              for tier, data in results.get('quality_tiers', {}).items():
                  print(f'  - {tier}: {data.get(\"init_time_s\", 0):.2f}s, {data.get(\"peak_memory_mb\", 0):.0f}MB')
          "
          
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v5
        with:
          name: phase2-benchmark-results
          path: |
            bench/results/phase2_benchmark_results.json
            docs/PHASE2_PERFORMANCE.md
          retention-days: 30
          
      - name: Comment Benchmark Results (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('bench/results/phase2_benchmark_results.json', 'utf8'));
            
            const clipTime = results.clip_classification?.avg_time_ms || 0;
            const tiers = results.quality_tiers || {};
            
            let comment = '## 📊 Phase 2 Performance Benchmark\n\n';
            comment += '| Metric | Value | Threshold | Status |\n';
            comment += '|--------|-------|-----------|--------|\n';
            comment += `| CLIP Classification | ${clipTime.toFixed(1)}ms | 500ms | ${clipTime < 500 ? '✅' : '❌'} |\n`;
            
            for (const [tier, data] of Object.entries(tiers)) {
              const initTime = data.init_time_s || 0;
              const memory = data.peak_memory_mb || 0;
              comment += `| ${tier} Init | ${initTime.toFixed(2)}s | 2.0s | ${initTime < 2.0 ? '✅' : '❌'} |\n`;
              comment += `| ${tier} Memory | ${memory.toFixed(0)}MB | 1200MB | ${memory < 1200 ? '✅' : '❌'} |\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
  # ===========================================================================
  # Stage 4.5: Lux Depth V2 Module Tests
  # ===========================================================================
  test-lux-depth-v2:
    name: Lux Depth V2 Tests (Python ${{ matrix.python-version }})
    needs: [setup, lint]
    if: |
      always() && 
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (contains(needs.setup.outputs.changed-files, 'lux_depth_v2') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-matrix) }}
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install lux_depth_v2 Dependencies
        run: |
          pip install --upgrade pip
          # Install from requirements-repo.txt (safe dependencies, no CVE-2024-27763)
          if [ -f lux_depth_v2/requirements-repo.txt ]; then
            pip install -r lux_depth_v2/requirements-repo.txt
          fi
          
      - name: Verify No Vulnerable Packages (CVE-2024-27763)
        run: |
          # Ensure basicsr, realesrgan, gfpgan are NOT installed
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ SECURITY VIOLATION: basicsr is installed!"
            exit 1
          fi
          if pip show realesrgan > /dev/null 2>&1; then
            echo "❌ SECURITY VIOLATION: realesrgan is installed!"
            exit 1
          fi
          if pip show gfpgan > /dev/null 2>&1; then
            echo "❌ SECURITY VIOLATION: gfpgan is installed!"
            exit 1
          fi
          echo "✅ No vulnerable packages found"
          
      - name: Test Module Imports
        run: |
          cd lux_depth_v2
          python -c "
          from lux_depth_v2 import pipeline, config, upscaling, service
          print('✅ All modules import successfully')
          "
          
      - name: Test TorchUpscaler
        run: |
          python -c "
          from lux_depth_v2.upscaling import create_upscaler
          from lux_depth_v2.config import PipelineConfig
          import torch
          
          cfg = PipelineConfig()
          cfg.upscaler_backend = 'torch'
          device = torch.device('cpu')
          upscaler = create_upscaler(cfg, device)
          print(f'✅ TorchUpscaler created: {type(upscaler).__name__}')
          "
          
      - name: Test Input Validation
        run: |
          python -c "
          from lux_depth_v2.service import validate_filepath
          
          # Test valid filename
          validate_filepath('test.png')
          print('✅ Valid filename accepted')
          
          # Test path traversal detection
          try:
              validate_filepath('../etc/passwd')
              print('❌ Should have rejected path traversal')
              exit(1)
          except ValueError:
              print('✅ Path traversal blocked')
          "
          
      - name: Run lux_depth_v2 Tests (if available)
        continue-on-error: true
        run: |
          if [ -d lux_depth_v2/tests ]; then
            cd lux_depth_v2
            pytest tests/ -m "not slow and not gpu" -v --tb=short
          else
            echo "⚠️ No tests directory found, skipping pytest"
          fi

  # ===========================================================================
  # Stage 5: RAG System Validation
  # ===========================================================================
  rag-validation:
    name: RAG System Validation
    needs: [setup]
    if: |
      needs.setup.outputs.run-core-tests == 'true' ||
      contains(needs.setup.outputs.changed-files, 'rag_system')
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Install RAG Dependencies
        run: |
          pip install --upgrade pip
          pip install numpy PyYAML pytest
          
      - name: Validate RAG System
        run: |
          cd .github/agents/rag_system
          
          # Syntax validation
          python -m py_compile *.py
          
          # Import validation
          python -c "
          import sys
          sys.path.insert(0, '.')
          
          # Test imports
          try:
              from cache_manager import CacheManager
              print('✓ cache_manager imports')
          except ImportError as e:
              print(f'⚠ cache_manager: {e}')
          
          try:
              from enhanced_retriever import EnhancedHybridRetriever
              print('✓ enhanced_retriever imports')
          except ImportError as e:
              print(f'⚠ enhanced_retriever: {e}')
          
          try:
              from phase1_integration import RAGSystem
              print('✓ phase1_integration imports')
          except ImportError as e:
              print(f'⚠ phase1_integration: {e}')
          "
          
      - name: Test Cache Persistence
        run: |
          cd .github/agents/rag_system
          python -c "
          from cache_manager import CacheManager, CacheConfig
          
          config = CacheConfig(cache_dir='/tmp/test_cache')
          manager = CacheManager(config)
          
          # Test save/load cycle
          test_data = [{'id': 1, 'content': 'test'}]
          manager.save_chunks(test_data, {'test.py': ['1']})
          
          loaded = manager.load_chunks()
          assert loaded == test_data, 'Cache round-trip failed'
          print('✓ Cache persistence verified')
          "

  # ===========================================================================
  # Stage 6: Build Artifacts
  # ===========================================================================
  build:
    name: Build Artifacts
    needs: [test-core]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Install Build Tools
        run: pip install build twine
        
      - name: Build Package
        run: python -m build
        
      - name: Validate Package
        run: twine check dist/*
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
          
  # ===========================================================================
  # Stage 7: Generate Manifest
  # ===========================================================================
  manifest:
    name: Generate Manifest
    needs: [test-core]
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          
      - name: Install Dependencies
        run: pip install pandas numpy
        
      - name: Generate Montecito Manifest
        run: |
          python tools/montecito_manifest.py . montecito_manifest.csv
          
      - name: Upload Manifest
        uses: actions/upload-artifact@v5
        with:
          name: montecito-manifest
          path: montecito_manifest.csv
          retention-days: 7

  # ===========================================================================
  # Stage 8: Summary & Status
  # ===========================================================================
  summary:
    name: Pipeline Summary
    needs: [setup, lint, test-core, test-ml, benchmark-phase2, test-lux-depth-v2, rag-validation, build, manifest]
    if: always()
    runs-on: ubuntu-24.04
    
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup | ${{ needs.setup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Tests | ${{ needs.test-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ML Tests | ${{ needs.test-ml.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 2 Benchmark | ${{ needs.benchmark-phase2.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lux Depth V2 Tests | ${{ needs.test-lux-depth-v2.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RAG Validation | ${{ needs.rag-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Phase 2 Features:** ${{ env.ENABLE_PHASE2_FEATURES }}" >> $GITHUB_STEP_SUMMARY
          echo "**Benchmark Regression:** ${{ env.RUN_BENCHMARK_REGRESSION }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Check Overall Status
        run: |
          if [ "${{ needs.test-core.result }}" == "failure" ]; then
            echo "::error::Core tests failed"
            exit 1
          fi
          
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "::warning::Lint checks failed"
          fi
          
          echo "Pipeline completed successfully"
