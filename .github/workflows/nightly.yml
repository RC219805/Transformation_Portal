name: Nightly Deep Checks

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      install_only:
        description: Qualify the shared CPU dependency installation without running suites or models
        required: false
        default: false
        type: boolean

# Prevent overlapping scheduled runs while allowing manual runs during scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  stress-tests:
    name: Stress & Endurance Tests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.install_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          bash scripts/ci/install_nightly_dependencies.sh

      - name: Run stress tests
        run: |
          pytest -v tests/ \
            -m "stress" \
            --timeout=300 \
            --maxfail=5 \
            --tb=short \
            -o log_cli=true \
            -o log_cli_level=INFO
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Upload stress test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: stress-test-logs
          path: |
            logs/
            *.log
          retention-days: 14

  performance-benchmarks:
    name: Performance Regression Tests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.install_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Need history for comparisons

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          bash scripts/ci/install_nightly_dependencies.sh

      - name: Run performance benchmarks
        id: benchmark
        run: |
          set -euo pipefail

          # Refuse to reuse evidence from an earlier invocation.
          mkdir "$BENCHMARK_EVIDENCE_DIR"
          export BENCHMARK_ARTIFACTS_DIR="$BENCHMARK_EVIDENCE_DIR/benchmark-artifacts"
          mkdir "$BENCHMARK_ARTIFACTS_DIR"

          # Keep the full benchmark selection. The Lux baseline writers use
          # their own timing harness, so --benchmark-only would skip them.
          set +e
          pytest tests/ -m "benchmark" \
            --json-report --json-report-file="$BENCHMARK_EVIDENCE_DIR/pytest-report.json" \
            --benchmark-json="$BENCHMARK_EVIDENCE_DIR/pytest-benchmark.json" \
            > "$BENCHMARK_EVIDENCE_DIR/pytest.log" 2>&1
          PYTEST_EXIT=$?
          cat "$BENCHMARK_EVIDENCE_DIR/pytest.log"
          python scripts/ci/check_performance_evidence.py \
            --report "$BENCHMARK_EVIDENCE_DIR/pytest-report.json" \
            --artifacts-dir "$BENCHMARK_ARTIFACTS_DIR" \
            --baselines-dir tests/benchmarks/baselines \
            > "$BENCHMARK_EVIDENCE_DIR/evidence-gate.log" 2>&1
          EVIDENCE_EXIT=$?
          cat "$BENCHMARK_EVIDENCE_DIR/evidence-gate.log"
          set -e

          echo "pytest_exit=$PYTEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "evidence_exit=$EVIDENCE_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$PYTEST_EXIT" -eq 0 ] && [ "$EVIDENCE_EXIT" -eq 0 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          elif [ "$PYTEST_EXIT" -eq 1 ] && [ "$EVIDENCE_EXIT" -eq 2 ]; then
            # Only the evidence gate's complete failed-writer comparison
            # can classify a regression candidate; generic pytest 1 cannot.
            echo "status=regression" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
        env:
          BENCHMARK_EVIDENCE_DIR: ${{ runner.temp }}/nightly-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/nightly-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Create issue on performance regression (deduplicated)
        if: steps.benchmark.outputs.status == 'regression'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open regression issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Performance Regression Detected')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Nightly regression detected again**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTimestamp: ${new Date().toISOString()}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Performance Regression Detected',
                body: `A required Lux baseline-writer test failed with complete execution evidence against the committed tests/benchmarks/baselines/. This is a regression candidate; inspect the test failure and evidence before changing baselines.\n\nCheck the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['performance', 'regression', 'automated']
              });
            }

      - name: Enforce nightly benchmark evidence
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outputs.status }}
          PYTEST_EXIT: ${{ steps.benchmark.outputs.pytest_exit }}
          EVIDENCE_EXIT: ${{ steps.benchmark.outputs.evidence_exit }}
        run: |
          set -euo pipefail
          if [ "$BENCHMARK_STATUS" != "passed" ] || [ "$PYTEST_EXIT" != "0" ] || [ "$EVIDENCE_EXIT" != "0" ]; then
            echo "Nightly benchmark gate failed (status=$BENCHMARK_STATUS, pytest=$PYTEST_EXIT, evidence=$EVIDENCE_EXIT)."
            exit 1
          fi

  memory-leak-detection:
    name: Memory Leak Detection
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.install_only }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          bash scripts/ci/install_nightly_dependencies.sh

      - name: Run memory profiling tests
        run: |
          # Test for memory growth over repeated operations
          python -c "
          import gc
          import psutil
          import numpy as np
          from pathlib import Path

          process = psutil.Process()
          initial_mem = process.memory_info().rss / 1024 / 1024

          # Simulate 100 iterations of depth processing
          for i in range(100):
              # Create dummy depth map
              depth = np.random.rand(1024, 1024).astype(np.float32)
              # Process (mock)
              result = depth * 2.0
              del depth, result
              if i % 10 == 0:
                  gc.collect()

          final_mem = process.memory_info().rss / 1024 / 1024
          growth = final_mem - initial_mem

          print(f'Memory: {initial_mem:.1f} MB -> {final_mem:.1f} MB (growth: {growth:.1f} MB)')

          # Fail if memory grew more than 100 MB for this simple test
          if growth > 100:
              print('FAIL: Memory leak detected')
              exit(1)
          "

      - name: Upload memory profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: memory-profile
          path: |
            *.dat
            memory_profile.txt
          retention-days: 14

  dependency-audit-deep:
    name: Deep Dependency Audit
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.install_only }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          # Install pip-audit from locked security layer, plus cyclonedx-bom for SBOM generation
          pip install -r requirements/security.txt cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py requirements --output-file sbom.json --output-format json requirements.txt || \
          cyclonedx-py requirements requirements.txt --output sbom.json --format json

      - name: Audit core requirements (advisory findings)
        id: audit
        run: |
          set -euo pipefail
          # This requirement-spec report is advisory. Security Unified owns
          # the blocking installed-environment scan under ADR-032.
          if [ -e audit-report.json ] || [ -L audit-report.json ]; then
            echo "::error::Refusing to reuse an existing audit-report.json"
            echo "Advisory core requirements audit: invalid pre-existing report; scanner not run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          AUDIT_EXIT=0
          pip-audit --desc -r requirements.txt --format json --output audit-report.json || AUDIT_EXIT=$?
          python - "$AUDIT_EXIT" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          raw_exit = int(sys.argv[1])
          count = None
          error = None
          def object_record(pairs):
              record = {}
              for key, value in pairs:
                  if key in record:
                      raise ValueError("duplicate audit report field")
                  record[key] = value
              return record
          def invalid_constant(value):
              raise ValueError("non-finite audit report value")
          try:
              report = Path("audit-report.json")
              if report.is_symlink() or not report.is_file():
                  raise ValueError("missing or non-regular audit report")
              with report.open("rb") as stream:
                  raw = stream.read(4 * 1024 * 1024 + 1)
              if len(raw) > 4 * 1024 * 1024:
                  raise ValueError("audit report exceeds 4 MiB")
              payload = json.loads(raw, object_pairs_hook=object_record, parse_constant=invalid_constant)
              dependencies = payload.get("dependencies") if isinstance(payload, dict) else None
              if not isinstance(dependencies, list) or not dependencies:
                  raise ValueError("missing or empty dependency inventory")
              total = 0
              for dependency in dependencies:
                  if not isinstance(dependency, dict) or "skip_reason" in dependency:
                      raise ValueError("incomplete dependency record")
                  if any(not isinstance(dependency.get(key), str) or not dependency[key].strip() for key in ("name", "version")):
                      raise ValueError("malformed dependency identity")
                  vulnerabilities = dependency.get("vulns")
                  if not isinstance(vulnerabilities, list):
                      raise ValueError("malformed vulnerability list")
                  if any(not isinstance(item, dict) or not isinstance(item.get("id"), str) or not item["id"].strip() for item in vulnerabilities):
                      raise ValueError("malformed vulnerability record")
                  total += len(vulnerabilities)
              if raw_exit != (1 if total else 0):
                  raise ValueError("scanner exit is inconsistent with complete report")
              count = total
          except (OSError, ValueError, RecursionError) as exc:
              error = str(exc)
          status = "failed" if error else "advisory_findings" if count else "clean"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"status={status}\naudit_exit={raw_exit}\nadvisory_count={count if count is not None else 'not_checked'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(f"### Advisory core requirement-spec audit\n- Status: {status}\n- Raw scanner exit: {raw_exit}\n- Reported advisories: {count if count is not None else 'not_checked'}\n")
              stream.write("Security Unified remains the blocking installed-environment authority.\n")
          if error:
              print(f"::error::Invalid advisory audit evidence: {error}")
              raise SystemExit(1)
          if count:
              print(f"::warning::Advisory core requirement-spec audit reported {count} advisories; see the report and required Security Unified check.")
          PY

      - name: Check for banned dependencies
        run: |
          # Enforce banned dependencies from requirements/constraints.txt
          shopt -s nullglob
          files=(requirements.txt requirements-*.txt)
          if grep -hEv '^[[:space:]]*($|#)' "${files[@]}" \
            | cut -d';' -f1 \
            | sed -E 's/[[:space:]]+#.*$//' \
            | sed -E 's/[[:space:]]+$//' \
            | awk -F'[<>=!~\\[]' '{gsub(/[[:space:]]+/,"",$1); print tolower($1)}' \
            | grep -Fxq "realesrgan"; then
            echo "ERROR: Banned dependency 'realesrgan' found"
            exit 1
          fi

      - name: Upload SBOM and audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-audit
          path: |
            sbom.json
            audit-report.json
          retention-days: 30

  integration-tests-full:
    name: Full Integration Tests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.install_only }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install dependencies
        run: |
          bash scripts/ci/install_nightly_dependencies.sh

      - name: Run full integration test suite
        run: |
          pytest -v tests/ \
            -m "integration" \
            --maxfail=10 \
            --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          TRANSFORMERS_OFFLINE: 1  # Don't download models during tests

  install-only:
    name: Install-only CPU Dependency Qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          bash scripts/ci/install_nightly_dependencies.sh

  nightly-summary:
    name: Nightly Summary
    needs: [stress-tests, performance-benchmarks, memory-leak-detection, dependency-audit-deep, integration-tests-full]
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.install_only) }}

    steps:
      - name: Generate summary
        run: |
          echo "# Nightly Deep Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Stress Tests: ${{ needs.stress-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Memory Leaks: ${{ needs.memory-leak-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ needs.dependency-audit-deep.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: ${{ needs.integration-tests-full.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure (deduplicated)
        if: |
          needs.stress-tests.result == 'failure' ||
          needs.performance-benchmarks.result == 'failure' ||
          needs.memory-leak-detection.result == 'failure' ||
          needs.dependency-audit-deep.result == 'failure' ||
          needs.integration-tests-full.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open nightly failure issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Nightly Deep Checks Failed')
            );

            const failureDetails = `
            - Stress Tests: ${{ needs.stress-tests.result }}
            - Performance Benchmarks: ${{ needs.performance-benchmarks.result }}
            - Memory Leak Detection: ${{ needs.memory-leak-detection.result }}
            - Dependency Audit: ${{ needs.dependency-audit-deep.result }}
            - Integration Tests: ${{ needs.integration-tests-full.result }}

            Check the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existingIssue) {
              // Update existing issue with new failure info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Nightly checks failed again** (${new Date().toISOString()})\n${failureDetails}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Nightly Deep Checks Failed',
                body: `One or more nightly deep checks failed:\n${failureDetails}`,
                labels: ['nightly-failure', 'automated', 'quality']
              });
            }
