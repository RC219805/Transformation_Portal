name: Nightly Deep Checks

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

# Prevent overlapping scheduled runs while allowing manual runs during scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  stress-tests:
    name: Stress & Endurance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          # DO NOT delete AGENT_TOOLSDIRECTORY - breaks Python setup-python cache
          # See: docs/incidents/2026-02-03_ci_python_toolcache_deletion.md
          sudo docker image prune --all --force
          df -h

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install memory-profiler psutil pytest-timeout
          pip install -e .

      - name: Run stress tests
        run: |
          pytest -v tests/ \
            -m "stress" \
            --timeout=300 \
            --maxfail=5 \
            --tb=short \
            -o log_cli=true \
            -o log_cli_level=INFO
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Upload stress test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: stress-test-logs
          path: |
            logs/
            *.log
          retention-days: 14

  performance-benchmarks:
    name: Performance Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # Need history for comparisons

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install pytest-benchmark
          pip install -e .

      - name: Check for baseline
        id: baseline
        run: |
          # Prefer a canonical checked-in baseline owned by nightly, if present
          if [ -f "tools/benchmarks/baseline.json" ]; then
            echo "baseline_file=tools/benchmarks/baseline.json" >> "$GITHUB_OUTPUT"
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          # Fall back to any existing committed baselines under tests/benchmarks/baselines/
          elif ls tests/benchmarks/baselines/*.json >/dev/null 2>&1; then
            FIRST_BASELINE_FILE="$(ls tests/benchmarks/baselines/*.json | head -n 1)"
            echo "Using fallback baseline at $FIRST_BASELINE_FILE"
            echo "baseline_file=$FIRST_BASELINE_FILE" >> "$GITHUB_OUTPUT"
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No benchmark baseline file found at tools/benchmarks/baseline.json or tests/benchmarks/baselines/*.json — perf regression comparison will be skipped"
            echo "⚠️ Perf regression comparison skipped: no baseline file present" >> "$GITHUB_STEP_SUMMARY"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run performance benchmarks
        id: benchmark
        run: |
          set -euo pipefail

          # Check if any benchmark tests exist using exit-code semantics
          # Exit code 5 = no tests collected (pytest convention)
          # Exit code 0 = collection succeeded
          # Other exit codes = collection/import failure
          set +e
          pytest tests/ -m "benchmark" --collect-only -q > benchmark-collect.log 2>&1
          COLLECT_EXIT=$?
          set -e

          if [ "$COLLECT_EXIT" -eq 5 ]; then
            echo "status=no_tests" >> $GITHUB_OUTPUT
            echo "⚠️ No benchmark tests found"
            exit 0
          elif [ "$COLLECT_EXIT" -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Benchmark collection failed with exit code $COLLECT_EXIT"
            cat benchmark-collect.log || true
            exit "$COLLECT_EXIT"
          fi

          echo "Benchmark collection succeeded"

          COMPARE_ARGS=()
          if [ "${{ steps.baseline.outputs.has_baseline }}" = "true" ]; then
            echo "Using baseline: ${{ steps.baseline.outputs.baseline_file }}"
            COMPARE_ARGS=(
              "--benchmark-compare=${{ steps.baseline.outputs.baseline_file }}"
              "--benchmark-compare-fail=mean:10%"
            )
          else
            echo "No baseline found; running without regression comparison."
          fi

          # Run benchmarks - capture exit code to distinguish regression vs failure
          if pytest tests/ \
            -m "benchmark" \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            "${COMPARE_ARGS[@]}"; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            BENCHMARK_EXIT=$?
            # Exit code 1 typically indicates pytest assertion/comparison failure (regression)
            # Exit codes > 1 indicate setup/environment/tool failures
            if [ $BENCHMARK_EXIT -eq 1 ]; then
              echo "status=regression" >> $GITHUB_OUTPUT
              echo "⚠️ Performance regression detected (>10% mean increase)"
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "❌ Benchmark execution failed with exit code $BENCHMARK_EXIT"
            fi
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Check performance budgets
        run: |
          # Define performance budgets
          # Example: PBR generation must complete in < 5 seconds per image
          if [ -f benchmark-results.json ]; then
            python -c "
          import json
          try:
              with open('benchmark-results.json') as f:
                  data = json.load(f)
              benchmarks = data.get('benchmarks', [])
              if benchmarks:
                  for bench in benchmarks:
                      name = bench['name']
                      mean = bench['stats']['mean']
                      print(f'{name}: {mean:.4f}s')
              else:
                  print('No benchmarks were run')
          except (json.JSONDecodeError, KeyError) as e:
              print(f'Failed to parse benchmark results: {e}')
              print('No benchmarks were run or file is empty')
          "
          else
            echo "No benchmark results file found - no benchmarks were run"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Create issue on performance regression (deduplicated)
        if: steps.benchmark.outputs.status == 'regression'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open regression issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Performance Regression Detected')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Nightly regression detected again**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTimestamp: ${new Date().toISOString()}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Performance Regression Detected',
                body: `Nightly performance benchmarks detected regression beyond acceptable threshold.\n\nCheck the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['performance', 'regression', 'automated']
              });
            }

  memory-leak-detection:
    name: Memory Leak Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install memory-profiler psutil pytest-memray
          pip install -e .

      - name: Run memory profiling tests
        run: |
          # Test for memory growth over repeated operations
          python -c "
          import gc
          import psutil
          import numpy as np
          from pathlib import Path

          process = psutil.Process()
          initial_mem = process.memory_info().rss / 1024 / 1024

          # Simulate 100 iterations of depth processing
          for i in range(100):
              # Create dummy depth map
              depth = np.random.rand(1024, 1024).astype(np.float32)
              # Process (mock)
              result = depth * 2.0
              del depth, result
              if i % 10 == 0:
                  gc.collect()

          final_mem = process.memory_info().rss / 1024 / 1024
          growth = final_mem - initial_mem

          print(f'Memory: {initial_mem:.1f} MB -> {final_mem:.1f} MB (growth: {growth:.1f} MB)')

          # Fail if memory grew more than 100 MB for this simple test
          if growth > 100:
              print('FAIL: Memory leak detected')
              exit(1)
          "

      - name: Upload memory profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: memory-profile
          path: |
            *.dat
            memory_profile.txt
          retention-days: 14

  dependency-audit-deep:
    name: Deep Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          # Install pip-audit from locked security layer, plus cyclonedx-bom for SBOM generation
          pip install -r requirements/security.txt cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py requirements --output-file sbom.json --output-format json requirements.txt || \
          cyclonedx-py requirements requirements.txt --output sbom.json --format json

      - name: Audit all dependencies
        run: |
          pip-audit --desc -r requirements.txt --format json --output audit-report.json || true

      - name: Check for banned dependencies
        run: |
          # Enforce banned dependencies from requirements/constraints.txt
          shopt -s nullglob
          files=(requirements.txt requirements-*.txt)
          if grep -hEv '^[[:space:]]*($|#)' "${files[@]}" \
            | cut -d';' -f1 \
            | sed -E 's/[[:space:]]+#.*$//' \
            | sed -E 's/[[:space:]]+$//' \
            | awk -F'[<>=!~\\[]' '{gsub(/[[:space:]]+/,"",$1); print tolower($1)}' \
            | grep -Fxq "realesrgan"; then
            echo "ERROR: Banned dependency 'realesrgan' found"
            exit 1
          fi

      - name: Upload SBOM and audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: dependency-audit
          path: |
            sbom.json
            audit-report.json
          retention-days: 30

  integration-tests-full:
    name: Full Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install transformers  # Required for depth_canonical integration tests
          pip install -e .

      - name: Run full integration test suite
        run: |
          pytest -v tests/ \
            -m "integration" \
            --maxfail=10 \
            --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          TRANSFORMERS_OFFLINE: 1  # Don't download models during tests

  nightly-summary:
    name: Nightly Summary
    needs: [stress-tests, performance-benchmarks, memory-leak-detection, dependency-audit-deep, integration-tests-full]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Nightly Deep Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Stress Tests: ${{ needs.stress-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Memory Leaks: ${{ needs.memory-leak-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ needs.dependency-audit-deep.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: ${{ needs.integration-tests-full.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure (deduplicated)
        if: |
          needs.stress-tests.result == 'failure' ||
          needs.performance-benchmarks.result == 'failure' ||
          needs.memory-leak-detection.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open nightly failure issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Nightly Deep Checks Failed')
            );

            const failureDetails = `
            - Stress Tests: ${{ needs.stress-tests.result }}
            - Performance Benchmarks: ${{ needs.performance-benchmarks.result }}
            - Memory Leak Detection: ${{ needs.memory-leak-detection.result }}
            - Dependency Audit: ${{ needs.dependency-audit-deep.result }}
            - Integration Tests: ${{ needs.integration-tests-full.result }}

            Check the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existingIssue) {
              // Update existing issue with new failure info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Nightly checks failed again** (${new Date().toISOString()})\n${failureDetails}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Nightly Deep Checks Failed',
                body: `One or more nightly deep checks failed:\n${failureDetails}`,
                labels: ['nightly-failure', 'automated', 'quality']
              });
            }
