name: Documentation

on:
  pull_request:
    paths:
      # API documentation
      - 'docs/api/**'
      - 'src/**/*.py'
      # General documentation
      - 'docs/**'
      - 'README*.md'
      - '*.md'
      - 'mkdocs.yml'
      # Dependencies for doc builds
      - 'requirements-dev.txt'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README*.md'
      - 'src/**/*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build API Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0"
          python -m pip install -r requirements.txt
          # sphinx-autodoc-typehints currently fails under Sphinx 9.x in this workflow;
          # keep docs build on the stable Sphinx 8 line until upstream compatibility lands.
          python -m pip install "sphinx>=7.2,<9" "sphinx-rtd-theme>=2.0,<3" "sphinx-autodoc-typehints>=2.0,<4"
          python -m pip install -e .

      - name: Build documentation
        run: |
          python -m sphinx -b html -W --keep-going docs/api docs/api/_build/html

      - name: Check documentation coverage
        run: |
          echo "Checking API documentation coverage..."
          # Count public modules
          PUBLIC_MODULES=$(find src/transformation_portal -name "*.py" -type f | wc -l)
          # Count documented modules (simple heuristic)
          DOCUMENTED=$(find docs/api/modules -name "*.rst" -type f | wc -l)
          COVERAGE=$((DOCUMENTED * 100 / PUBLIC_MODULES))
          echo "Documentation coverage: $COVERAGE% ($DOCUMENTED/$PUBLIC_MODULES modules)"
          if [ $COVERAGE -lt 50 ]; then
            echo "::warning::Documentation coverage is below 50%"
          fi

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: api-documentation
          path: docs/api/_build/html
          retention-days: 30

  validate-markdown:
    name: Validate Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check markdown files exist
        run: |
          echo "Checking for markdown files..."
          find docs -name "*.md" -type f | head -20
          echo "README files:"
          ls -la README*.md || true

      - name: Basic link validation
        run: |
          echo "Checking for broken internal links..."
          # Simple check: look for obviously broken markdown links
          if grep -r '\[.*\](\s*\?$\|\s*#\?$)' docs/ README*.md 2>/dev/null; then
            echo "::warning::Found potentially malformed links (empty hrefs)"
          fi
          echo "✅ Basic markdown validation complete"

  update-navigation:
    name: Verify Navigation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check README links
        run: |
          if grep -q "API Documentation" README.md; then
            echo "✓ README.md contains API documentation link"
          else
            echo "::warning::README.md missing API documentation link"
          fi

      - name: Check DOCUMENTATION_MAP
        run: |
          DOC_MAP="docs/governance/DOCUMENTATION_MAP.md"
          if [ -f "${DOC_MAP}" ]; then
            if grep -q "api" "${DOC_MAP}"; then
              echo "✓ ${DOC_MAP} contains API docs reference"
            else
              echo "::warning::${DOC_MAP} missing API docs reference"
            fi
          else
            echo "::warning::${DOC_MAP} not found"
          fi
