name: Python CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Free up disk space FIRST - critical for avoiding "No space left on device"
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune --all --force
        df -h

    # Create cache directories
    - name: Create cache directories
      run: |
        mkdir -p ~/.cache/huggingface
        mkdir -p ~/.cache/pip
        mkdir -p models

    # Cache pip packages
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    # Cache model files
    - name: Cache models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          models
        key: ${{ runner.os }}-models-v4-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-models-v4-
          ${{ runner.os }}-models-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools

        # Install CPU-only PyTorch first (saves ~6GB vs CUDA version)
        pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu

        # Install core testing dependencies
        pip install pytest>=7.0 pytest-cov>=4.0 coverage

        # Install minimal required dependencies for CI (avoid heavy deps like realesrgan, coremltools)
        pip install numpy pillow scipy typer tqdm
        pip install transformers huggingface-hub scikit-learn scikit-image PyYAML colour-science
        pip install diffusers accelerate controlnet-aux

        # Install package in editable mode
        pip install -e . --no-deps

        # Verify pytest-cov is installed
        pip show pytest-cov

    - name: Lint with flake8 (optional)
      continue-on-error: true
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

    - name: Type check with mypy (optional)
      continue-on-error: true
      run: |
        pip install mypy types-PyYAML
        mypy src/ --ignore-missing-imports --no-strict-optional || true

    - name: Run tests with pytest
      run: |
        # All tests can now import properly - import errors have been fixed
        pytest -xvs tests/ \
          --cov=src/transformation_portal \
          --cov-report=xml \
          --cov-report=term \
          --cov-report=html
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload coverage reports
      if: matrix.python-version == '3.11'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check coverage threshold
      if: matrix.python-version == '3.11'
      continue-on-error: true
      run: |
        coverage report --fail-under=35 || echo "Coverage is below threshold but continuing"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution
      run: |
        twine check dist/*

    # Uncomment when ready to publish to PyPI
    # - name: Publish to PyPI
    #   env:
    #     TWINE_USERNAME: __token__
    #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    #   run: |
    #     twine upload dist/*