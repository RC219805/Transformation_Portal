name: Python CI/CD
permissions: {}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint mypy types-PyYAML

    - name: Lint with flake8
      continue-on-error: true
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

    - name: Lint with pylint
      continue-on-error: true
      run: |
        # Use .pylintrc configuration (ignores src/transformation_portal, src/luxury_tiff_batch_processor)
        # Lint tools/ and root-level Python files
        pylint tools/ ./*.py || true

    - name: Type check with mypy
      continue-on-error: true
      run: |
        # Use mypy.ini configuration
        mypy tools/ ./*.py || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Run only Python 3.11 for now to conserve CI resources
        # Can expand to ['3.10', '3.11', '3.12'] once stability is confirmed
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Free up disk space FIRST - critical for avoiding "No space left on device"
    - name: Free disk space
      run: |
        echo "Disk space before cleanup:"
        df -h

        # Remove large unnecessary tools and libraries
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift

        # Clean Docker
        sudo docker image prune --all --force
        sudo docker container prune --force

        # Clean apt cache
        sudo apt-get clean

        echo "Disk space after cleanup:"
        df -h

    # Create cache directories
    - name: Create cache directories
      run: |
        mkdir -p ~/.cache/huggingface
        mkdir -p ~/.cache/pip
        mkdir -p models

    # Cache pip packages
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    # Cache model files
    - name: Cache models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          models
        key: ${{ runner.os }}-models-v4-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-models-v4-
          ${{ runner.os }}-models-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools

        # Install CPU-only PyTorch FIRST to prevent CUDA version installation (saves ~6GB)
        pip install --no-cache-dir "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu

        # Install core testing dependencies
        pip install --no-cache-dir "pytest>=7.0" "pytest-cov>=4.0" coverage hypothesis

        # Install minimal required dependencies for CI (skip heavy optional deps)
        pip install --no-cache-dir numpy pillow scipy typer tqdm tifffile imagecodecs
        pip install --no-cache-dir transformers huggingface-hub
        pip install --no-cache-dir scikit-learn scikit-image PyYAML colour-science psutil memory-profiler
        pip install --no-cache-dir diffusers accelerate controlnet-aux opencv-python

        # Skip these heavy dependencies in CI (not needed for most tests):
        # - realesrgan (requires basicsr, facexlib, gfpgan, large models)
        # - coremltools (requires protobuf, large ML frameworks)
        # - PyPDF2 (document processing, not core functionality)

        # Install package in editable mode
        pip install -e . --no-deps

        # Verify pytest-cov is installed
        pip show pytest-cov

        # Show remaining disk space
        df -h

    - name: Run tests with pytest
      run: |
        # Run tests with proper PYTHONPATH set
        # Skip tests that require optional heavy dependencies (realesrgan, coremltools)
        pytest -v tests/ \
          --ignore=tests/test_realesrgan_integration.py \
          --ignore=tests/test_coreml_integration.py \
          --cov=src/transformation_portal \
          --cov-report=xml \
          --cov-report=term \
          --cov-report=html \
          --maxfail=5
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

    - name: Upload coverage reports
      if: matrix.python-version == '3.11'
      continue-on-error: true
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check coverage threshold
      if: matrix.python-version == '3.11'
      continue-on-error: true
      run: |
        coverage report --fail-under=35 || echo "Coverage is below threshold but continuing"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution
      run: |
        twine check dist/*

    - name: Publish to Test PyPI
      # Only publish to Test PyPI on main branch for testing
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --skip-existing || echo "Upload to Test PyPI failed or package already exists"

    # Note: Production PyPI uploads should use the dedicated submit-pypi.yml workflow
    # triggered by version tags (e.g., v0.1.0)

  cleanup:
    name: Cleanup
    needs: [lint, test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Clean up temporary files
      run: |
        echo "Cleaning up temporary files..."
        find /tmp -type f -mtime +1 -delete 2>/dev/null || true
        rm -rf ~/.cache/pip || true
        rm -rf ~/.cache/huggingface || true
        docker system prune -f || true
        
    - name: Verify cleanup
      run: |
        echo "Final disk usage:"
        df -h
        echo "Cleanup completed successfully!"