name: APEX Policy Validation

on:
  pull_request:
    paths:
      - 'docs/apex/policy/**'
      - 'scripts/apex_validate_policy.py'
      - 'scripts/ci/apex/validate_policy.py'
      - 'src/transformation_portal/metrics/performance_capsule.py'
  push:
    branches: [main]
    paths:
      - 'docs/apex/policy/**'
      - 'scripts/apex_validate_policy.py'
      - 'scripts/ci/apex/validate_policy.py'

concurrency:
  group: apex-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workflow-level permissions with least privilege defaults
permissions:
  contents: read

jobs:
  validate-policy:
    name: Validate APEX Policy Files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Need full history for git diff in policy-change-guard

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          # Install minimal dependencies for validation
          python -m pip install PyYAML jsonschema
          # Install package without heavy dependencies for consistency checks
          # Use --no-deps to avoid pulling in torch/transformers/etc
          python -m pip install --no-deps -e .

      - name: Validate Policy Files
        run: |
          set -euo pipefail
          echo "Running APEX policy validation..."
          python scripts/apex_validate_policy.py \
            --policy-dir docs/apex/policy/ \
            --check all

      - name: Check Policy-Code Consistency
        run: |
          set -euo pipefail
          echo "Checking policy files are in sync with code..."
          python scripts/apex_validate_policy.py \
            --policy-dir docs/apex/policy/ \
            --check consistency

  policy-change-guard:
    name: Check Policy Change Requirements
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Need full history for git diff

      - name: Check for Policy Changes
        id: policy_changes
        run: |
          set -euo pipefail

          # Check if any policy files were changed
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -q "docs/apex/policy/.*\.yaml"; then
            echo "Policy files changed: YES"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Policy files changed: NO"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Required Label
        if: steps.policy_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"

          # Get PR labels
          labels=$(gh api "repos/$repo/issues/$pr_number" --jq '.labels[].name')

          # Check for required label
          if echo "$labels" | grep -q "apex-policy-change"; then
            echo "✅ PR has required 'apex-policy-change' label"
            exit 0
          else
            echo "❌ POLICY CHANGE DETECTED but PR is missing 'apex-policy-change' label"
            echo ""
            echo "Policy file changes require:"
            echo "1. Add 'apex-policy-change' label to this PR"
            echo "2. Include evidence in PR description (ledger query, analysis)"
            echo "3. Request review from @transformation-portal-architect"
            echo ""
            echo "See: docs/apex/GOVERNANCE_USER_GUIDE.md#proposing-budget-changes"
            exit 1
          fi
