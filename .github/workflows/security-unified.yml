# =============================================================================
# Unified Security Scanning Workflow
# Phase 1 Optimization: Consolidates security-scan.yml and security-gates.yml
# (CodeQL scanning remains in .github/workflows/codeql.yml)
# =============================================================================

name: Security Unified

on:
  schedule:
    - cron: '0 6 * * *'
    # Staggered 20 minutes after codeql.yml (27 22 * * 2) to avoid a Tuesday-night runner
    # contention spike when both security workflows fire at the same minute.
    - cron: '47 22 * * 2'

  push:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'requirements/constraints.txt'
      - 'scripts/security/**'
      - 'lux_depth_v2/requirements-repo.txt'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.yaml'
      - '**/*.yml'

  pull_request:
    branches: [main]
    # Do NOT use paths filtering on PRs.

  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan including all dependencies'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
  packages: read

concurrency:
  group: security-unified-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Dependency Security Scan (REQUIRED FOR PR MERGE)
  # ===========================================================================
  dependency-scan:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            requirements/constraints.txt

      - name: Verify basicsr Not Installed (CVE-2024-27763)
        id: basicsr-check
        run: |
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ CRITICAL: basicsr is pre-installed!"
            echo "has_basicsr=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ basicsr not present (expected)"
          echo "has_basicsr=false" >> $GITHUB_OUTPUT

      - name: Verify No Vulnerable Imports
        run: python scripts/utilities/verify_no_basicsr_imports.py

      - name: Check Constraints File
        id: check
        run: |
          if [ ! -f "requirements/constraints.txt" ]; then
            echo "❌ Missing requirements/constraints.txt"
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          if grep -q "basicsr>=999.0.0" requirements/constraints.txt; then
            echo "✅ basicsr is blocked in constraints.txt"
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ basicsr may not be properly blocked"
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies with Constraints
        run: |
          pip install --upgrade pip
          pip install -c requirements/constraints.txt -r requirements-ci.txt
          pip install -c requirements/constraints.txt -e .

      - name: Verify basicsr Not Installed After pip install
        run: |
          if pip show basicsr > /dev/null 2>&1; then
            echo "❌ CRITICAL: basicsr was installed despite constraints!"
            pip show basicsr
            exit 1
          fi
          echo "✅ Constraints working: basicsr not installed"

      - name: Run Security Manager Scan
        run: python scripts/security/security_manager.py scan

      - name: Auto-Resolve Known Vulnerabilities
        id: auto-resolve
        continue-on-error: true
        run: python scripts/security/auto_resolver.py status || true

      - name: Full Verification with Package Check
        run: python scripts/utilities/verify_no_basicsr_imports.py --check-pkg

      # P0 Enhancement: pip-audit for dependency vulnerability scanning
      - name: Install security tools
        run: |
          python -m pip install --upgrade "pip==26.1.2" "setuptools==83.0.0"
          # Install from locked requirements file for deterministic, governed security tooling
          pip install -r requirements/security.txt

      - name: Run pip-audit (BLOCKING on any advisory)
        run: |
          set -euo pipefail
          echo "🔍 Running pip-audit for dependency vulnerabilities..."

          # Capture the exit so the report can be displayed before the step fails.
          AUDIT_EXIT=0
          pip-audit --format json --output audit-report.json || AUDIT_EXIT=$?

          if [ ! -f audit-report.json ]; then
            echo "❌ BLOCKED: pip-audit did not produce audit-report.json"
            if [ "$AUDIT_EXIT" -ne 0 ]; then
              exit "$AUDIT_EXIT"
            fi
            exit 1
          fi

          echo "📄 Vulnerability Audit Report:"
          python -m json.tool audit-report.json || cat audit-report.json

          # pip-audit 2.10.1 records findings under dependencies[].vulns[].
          VULN_COUNT=$(jq '[.dependencies[] | .vulns[]?] | length' audit-report.json)

          if [ "$AUDIT_EXIT" -ne 0 ]; then
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "❌ BLOCKED: Found $VULN_COUNT known vulnerability advisories"
            else
              echo "❌ BLOCKED: pip-audit failed with exit code $AUDIT_EXIT"
            fi
            exit "$AUDIT_EXIT"
          fi

          # Defense in depth: a report containing findings must never pass even
          # if pip-audit unexpectedly returns zero.
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "❌ BLOCKED: Found $VULN_COUNT known vulnerability advisories"
            exit 1
          fi
          echo "✅ No known vulnerability advisories found"

      # CVE-2025-32434 defense-in-depth: scan for raw torch.load() calls that
      # bypass weights_only=True. Blocking gate (no continue-on-error) since
      # 2026-05-24, after the 2026-05-18 → 2026-05-25 soak window passed with
      # no findings. Lives in this REQUIRED-FOR-PR-MERGE job (dependency-scan)
      # so the gate actually blocks merge, alongside pip-audit above.
      # Tracking: I-1 in docs/governance/audit/PORTAL_AUDIT_2026-05-18_backlog.md.
      - name: Check unsafe torch.load() usage (CVE-2025-32434)
        run: |
          python scripts/validation/check_unsafe_torch_load.py --ci-mode --fix-suggestions

      # NOTE: Safety scanning removed per security toolchain governance cleanup
      # pip-audit (above) is the governed blocking dependency scanner
      # Safety was causing ungoverned NLTK transitive dependency alerts
      # See requirements/security.in for toolchain documentation

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: security-reports-${{ github.sha }}
          path: |
            audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Security Scan Summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f audit-report.json ]; then
            echo "### pip-audit Results" >> $GITHUB_STEP_SUMMARY
            VULN_COUNT=$(jq '[.dependencies[] | .vulns[]?] | length' audit-report.json)
            echo "- Total vulnerabilities: $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security checks completed; see the job status for the blocking result." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Security Gates
  # ===========================================================================
  security-gates:
    name: Security Artifact Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check for sensitive files
        run: |
          echo "🔍 Checking for sensitive files in repository..."
          if find . -name '.bash_history' -o -name '.zsh_history' -o -name '.sh_history' | grep -q .; then
            echo "❌ ERROR: Shell history files found!"
            exit 1
          fi
          if [ -f "PKG-INFO" ]; then
            echo "❌ ERROR: PKG-INFO build artifact found!"
            exit 1
          fi
          if [ -d ".local_backup" ]; then
            echo "❌ ERROR: .local_backup directory found!"
            exit 1
          fi
          if find . -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_dsa' | grep -v '.venv' | grep -q .; then
            echo "❌ ERROR: Credential files found!"
            exit 1
          fi
          echo "✓ No sensitive files found"

      - name: Check for bidirectional Unicode
        run: |
          python scripts/security/pre_commit_security_check.py $(find . -name '*.py' -o -name '*.sh' -o -name '*.yaml' -o -name '*.yml' | grep -v '.venv' | grep -v 'deprecated' | head -100)

      - name: Validate .gitignore coverage
        run: |
          REQUIRED_PATTERNS=(
            ".bash_history"
            ".local_backup/"
            "PKG-INFO"
            "*.pem"
            "*.key"
            "id_rsa"
          )
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "❌ ERROR: Required pattern missing from .gitignore: $pattern"
              exit 1
            fi
          done
          echo "✓ .gitignore has proper security coverage"
