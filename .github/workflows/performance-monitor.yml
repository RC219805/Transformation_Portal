# .github/workflows/performance-monitor.yml
# Performance Regression Testing - Schedule and Manual Only
# NOTE: This workflow does NOT run on PRs to avoid baseline comparison issues.
# Baselines are the committed files under tests/benchmarks/baselines/; each
# Lux perf smoke test compares its measurement against them in-test.
# A run is green ONLY when scripts/ci/check_performance_evidence.py proves
# the required tests executed and passed, the four benchmark artifacts were
# produced, and the committed baselines were valid (repair 1.6-a, #2062).
# Regression status is a nightly-blocking signal per docs/performance/GATE_POLICY.md.
name: Performance Monitor

on:
  schedule:
    # Run nightly at 3:30 AM UTC (staggered from nightly.yml at 2 AM)
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Manual dispatch available for ad-hoc performance checks

# Prevent overlapping scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false  # Don't cancel scheduled runs

permissions:
  contents: read
  issues: write

jobs:
  performance-test:
    name: Performance Regression Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Need history for comparison

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-perf-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e ".[ml]"
          # psutil is REQUIRED evidence tooling: without it the memory
          # baseline test skips and the evidence gate below fails the run
          # (repair 1.6-a, issue #2062 — no silent evidence starvation).
          pip install pytest memory-profiler psutil

      - name: Run performance tests
        id: benchmark
        # Repair 1.6-a (issue #2062): the Lux perf smoke tests use a custom
        # timing harness, NOT the pytest-benchmark fixture. The former
        # "--benchmark-only" invocation skipped every selected test and went
        # green with zero executed benchmarks on every nightly run, and
        # collect-exit-5 was also treated as green. Baseline comparison
        # happens INSIDE each baseline-writer test against the committed
        # baselines in tests/benchmarks/baselines/; the evidence gate below
        # proves the tests executed, the four artifacts were produced, and
        # the committed baselines were valid — or the run fails.
        run: |
          set -euo pipefail

          export BENCHMARK_ARTIFACTS_DIR="$GITHUB_WORKSPACE/benchmark-artifacts"
          mkdir -p "$BENCHMARK_ARTIFACTS_DIR"

          set +e
          pytest tests/benchmarks/test_lux_depth_v3_perf_smoke.py -m "benchmark" \
            --json-report --json-report-file=perf-test-report.json
          PYTEST_EXIT=$?
          python scripts/ci/check_performance_evidence.py \
            --report perf-test-report.json \
            --artifacts-dir "$BENCHMARK_ARTIFACTS_DIR" \
            --baselines-dir tests/benchmarks/baselines
          EVIDENCE_EXIT=$?
          set -e

          if [ "$PYTEST_EXIT" -eq 0 ] && [ "$EVIDENCE_EXIT" -eq 0 ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "✅ Benchmarks executed and evidence gate passed"
          elif [ "$PYTEST_EXIT" -eq 1 ]; then
            # Test-body assertion failures include the committed-baseline
            # regression comparisons (assert_regression_within_tolerance).
            echo "status=regression" >> $GITHUB_OUTPUT
            echo "⚠️ Benchmark test failure — regression against committed baselines or broken harness"
          else
            # Zero executed tests (incl. pytest exit 5), collection/import
            # errors, missing artifacts, or invalid baselines: not valid
            # green evidence, never a pass.
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Benchmark run is not valid evidence (pytest exit ${PYTEST_EXIT}, evidence gate exit ${EVIDENCE_EXIT})"
          fi

      - name: Analyze memory usage
        run: |
          # Memory profiling script
          cat > mem_test.py << 'EOF'
          from memory_profiler import profile
          import sys

          @profile
          def test_import():
              # Test basic imports don't leak memory
              import numpy as np
              import torch
              return True

          if __name__ == "__main__":
              test_import()
          EOF

          python -m memory_profiler mem_test.py > memory-report.txt 2>&1 || echo "Memory profiling skipped"

      - name: Generate performance report
        if: always()
        run: |
          BENCHMARK_STATUS="${{ steps.benchmark.outputs.status }}"

          cat > performance-summary.md << EOF
          # 📊 Performance Test Results

          ## Status
          - Benchmark Status: **${BENCHMARK_STATUS:-unknown}**
          - Baselines: committed under \`tests/benchmarks/baselines/\`, compared in-test
          - Evidence gate: \`scripts/ci/check_performance_evidence.py\` (required tests executed, four artifacts produced, baselines valid)

          ## Benchmark Summary
          $(if [ -d benchmark-artifacts ]; then echo "Measured baselines in \`benchmark-artifacts/\`; execution report in \`perf-test-report.json\`."; else echo "No benchmark artifacts generated — the evidence gate fails such a run."; fi)

          ## Memory Profile
          $(if [ -f memory-report.txt ]; then echo "See \`memory-report.txt\` for memory usage analysis."; else echo "Memory profiling not available."; fi)
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: performance-results
          path: |
            benchmark-artifacts/
            perf-test-report.json
            memory-report.txt
            performance-summary.md
          if-no-files-found: warn
          retention-days: 30
          overwrite: true  # Allow overwriting for baseline storage

      - name: Create issue on regression (deduplicated)
        if: steps.benchmark.outputs.status == 'regression'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open regression issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Performance Regression Detected')
            );

            if (existingIssue) {
              // Update existing issue with new run info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **New regression detected**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis regression was detected again on ${new Date().toISOString()}.`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Performance Regression Detected',
                body: `Lux perf smoke tests failed their committed-baseline tolerance (assert_regression_within_tolerance in tests/benchmarks/test_lux_depth_v3_perf_smoke.py, baselines under tests/benchmarks/baselines/).\n\nCheck the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['performance', 'regression', 'automated']
              });
            }

      - name: Enforce nightly performance gate
        # "failed" means the benchmark run itself was invalid, not product-green evidence.
        if: steps.benchmark.outputs.status == 'regression' || steps.benchmark.outputs.status == 'failed'
        run: |
          echo "Performance regression exceeded the nightly-blocking threshold documented in docs/performance/GATE_POLICY.md."
          exit 1
