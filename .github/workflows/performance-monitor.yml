# .github/workflows/performance-monitor.yml
# Phase 2: Performance Regression Testing
name: Performance Monitor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Concurrency control: Cancel outdated runs on new pushes to the same branch/PR
# This reduces CI minutes and speeds up feedback on the latest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  performance-test:
    name: Performance Regression Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need history for comparison

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-perf-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e ".[ml]"
          pip install pytest pytest-benchmark memory-profiler

      - name: Download baseline results
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: baseline-benchmark
          path: baseline/

      - name: Run performance tests
        run: |
          BASELINE_FILE=""
          for candidate in baseline/benchmark.json baseline/current-benchmark.json; do
            if [ -f "$candidate" ]; then
              BASELINE_FILE="$candidate"
              break
            fi
          done

          COMPARE_ARGS=()
          if [ -n "$BASELINE_FILE" ]; then
            echo "Using baseline benchmark file: $BASELINE_FILE"
            COMPARE_ARGS=(
              "--benchmark-compare=$BASELINE_FILE"
              "--benchmark-compare-fail=mean:10%"
            )
          else
            echo "No baseline benchmark found; running without regression comparison."
          fi

          pytest tests/ -m "benchmark" \
            --benchmark-json=current-benchmark.json \
            "${COMPARE_ARGS[@]}" || true

      - name: Analyze memory usage
        run: |
          # Memory profiling script
          cat > mem_test.py << 'EOF'
          from memory_profiler import profile
          import sys

          @profile
          def test_import():
              # Test basic imports don't leak memory
              import numpy as np
              import torch
              return True

          if __name__ == "__main__":
              test_import()
          EOF

          python -m memory_profiler mem_test.py > memory-report.txt || true

      - name: Generate performance report
        run: |
          cat > performance-summary.md << 'EOF'
          # 📊 Performance Test Results

          ## Benchmark Summary
          See `current-benchmark.json` for detailed results.

          ## Memory Profile
          See `memory-report.txt` for memory usage analysis.

          ## Status
          - ✅ Tests completed
          - Check for regressions > 10%
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: |
            current-benchmark.json
            memory-report.txt
            performance-summary.md
          if-no-files-found: warn

      - name: Save as baseline (main branch only)
        if: github.ref == 'refs/heads/main' && hashFiles('current-benchmark.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: baseline-benchmark
          path: current-benchmark.json
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const fs = require('fs');

            let summary = '# 📊 Performance Test Results\n\n';

            // Check if performance summary exists
            if (fs.existsSync('performance-summary.md')) {
              summary = fs.readFileSync('performance-summary.md', 'utf8');
            } else {
              summary += 'ℹ️  No performance benchmarks generated.\n\n';
              summary += 'To enable performance tracking, add benchmark tests:\n';
              summary += '```python\n';
              summary += 'def test_performance(benchmark):\n';
              summary += '    result = benchmark(your_function)\n';
              summary += '```\n';
            }

            // Add memory report if available
            if (fs.existsSync('memory-report.txt')) {
              const memReport = fs.readFileSync('memory-report.txt', 'utf8');
              summary += '\n## Memory Profile\n```\n' + memReport.slice(0, 500) + '\n```\n';
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              core.warning(`Performance PR comment failed: ${error.message}`);
            }
