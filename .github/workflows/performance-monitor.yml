# .github/workflows/performance-monitor.yml
# Performance Regression Testing - Schedule and Manual Only
# NOTE: This workflow does NOT run on PRs to avoid baseline comparison issues.
# Benchmark baselines require cross-run persistence which workflow artifacts don't provide.
# Baselines are stored in tools/benchmarks/baseline.json (if present).
# Regression status is a nightly-blocking signal per docs/performance/GATE_POLICY.md.
name: Performance Monitor

on:
  schedule:
    # Run nightly at 3:30 AM UTC (staggered from nightly.yml at 2 AM)
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Manual dispatch available for ad-hoc performance checks

# Prevent overlapping scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false  # Don't cancel scheduled runs

permissions:
  contents: read
  issues: write

jobs:
  performance-test:
    name: Performance Regression Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Need history for comparison

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-perf-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e ".[ml]"
          pip install pytest pytest-benchmark memory-profiler

      - name: Fetch baseline from repository (if exists)
        id: baseline
        run: |
          # Baseline storage: prefer canonical path, fall back to committed baselines
          # Future enhancement: could also fetch from release assets or dedicated baseline branch.
          BASELINE_FILE=""

          # Prefer a canonical checked-in baseline owned by performance-monitor, if present
          if [ -f "tools/benchmarks/baseline.json" ]; then
            BASELINE_FILE="tools/benchmarks/baseline.json"
            echo "baseline_source=repo" >> $GITHUB_OUTPUT
          # Fall back to any existing committed baselines under tests/benchmarks/baselines/
          elif ls tests/benchmarks/baselines/*.json >/dev/null 2>&1; then
            FIRST_BASELINE_FILE="$(ls tests/benchmarks/baselines/*.json | head -n 1)"
            echo "Using fallback baseline at $FIRST_BASELINE_FILE"
            BASELINE_FILE="$FIRST_BASELINE_FILE"
            echo "baseline_source=fallback" >> $GITHUB_OUTPUT
          else
            echo "No benchmark baseline file found; regression comparison will be skipped."
            echo "baseline_source=none" >> $GITHUB_OUTPUT
          fi

          echo "baseline_file=$BASELINE_FILE" >> $GITHUB_OUTPUT

      - name: Run performance tests
        id: benchmark
        run: |
          set -euo pipefail

          # Check if any benchmark tests exist using exit-code semantics
          # Exit code 5 = no tests collected (pytest convention)
          # Exit code 0 = collection succeeded
          # Other exit codes = collection/import failure
          set +e
          pytest tests/ -m "benchmark" --collect-only -q > benchmark-collect.log 2>&1
          COLLECT_EXIT=$?
          set -e

          if [ "$COLLECT_EXIT" -eq 5 ]; then
            echo "status=no_tests" >> $GITHUB_OUTPUT
            echo "⚠️ No benchmark tests found (tests marked with @pytest.mark.benchmark)"
            exit 0
          elif [ "$COLLECT_EXIT" -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Benchmark collection failed with exit code $COLLECT_EXIT"
            cat benchmark-collect.log || true
            exit "$COLLECT_EXIT"
          fi

          echo "Benchmark collection succeeded"

          COMPARE_ARGS=()
          BASELINE_FILE="${{ steps.baseline.outputs.baseline_file }}"

          if [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then
            echo "Using baseline benchmark file: $BASELINE_FILE"
            COMPARE_ARGS=(
              "--benchmark-compare=$BASELINE_FILE"
              "--benchmark-compare-fail=mean:10%"
            )
          else
            echo "No baseline benchmark found; running without regression comparison."
          fi

          # Run benchmarks - capture exit code properly
          if pytest tests/ -m "benchmark" \
            --benchmark-only \
            --benchmark-json=current-benchmark.json \
            "${COMPARE_ARGS[@]}"; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            BENCHMARK_EXIT=$?
            if [ $BENCHMARK_EXIT -eq 1 ]; then
              echo "status=regression" >> $GITHUB_OUTPUT
              echo "⚠️ Performance regression detected (>10% mean increase)"
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "❌ Benchmark execution failed with exit code $BENCHMARK_EXIT"
            fi
          fi

      - name: Analyze memory usage
        run: |
          # Memory profiling script
          cat > mem_test.py << 'EOF'
          from memory_profiler import profile
          import sys

          @profile
          def test_import():
              # Test basic imports don't leak memory
              import numpy as np
              import torch
              return True

          if __name__ == "__main__":
              test_import()
          EOF

          python -m memory_profiler mem_test.py > memory-report.txt 2>&1 || echo "Memory profiling skipped"

      - name: Generate performance report
        run: |
          BENCHMARK_STATUS="${{ steps.benchmark.outputs.status }}"

          cat > performance-summary.md << EOF
          # 📊 Performance Test Results

          ## Status
          - Benchmark Status: **${BENCHMARK_STATUS:-unknown}**
          - Baseline Source: **${{ steps.baseline.outputs.baseline_source }}**

          ## Benchmark Summary
          $(if [ -f current-benchmark.json ]; then echo "See \`current-benchmark.json\` for detailed results."; else echo "No benchmark results generated."; fi)

          ## Memory Profile
          $(if [ -f memory-report.txt ]; then echo "See \`memory-report.txt\` for memory usage analysis."; else echo "Memory profiling not available."; fi)
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: performance-results
          path: |
            current-benchmark.json
            memory-report.txt
            performance-summary.md
          if-no-files-found: warn
          retention-days: 30
          overwrite: true  # Allow overwriting for baseline storage

      - name: Create issue on regression (deduplicated)
        if: steps.benchmark.outputs.status == 'regression'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Check for existing open regression issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression,automated',
              per_page: 10
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Performance Regression Detected')
            );

            if (existingIssue) {
              // Update existing issue with new run info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **New regression detected**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis regression was detected again on ${new Date().toISOString()}.`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Performance Regression Detected',
                body: `Performance benchmarks detected regression beyond acceptable threshold (>10% mean increase).\n\nCheck the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['performance', 'regression', 'automated']
              });
            }

      - name: Enforce nightly performance gate
        # "failed" means the benchmark run itself was invalid, not product-green evidence.
        if: steps.benchmark.outputs.status == 'regression' || steps.benchmark.outputs.status == 'failed'
        run: |
          echo "Performance regression exceeded the nightly-blocking threshold documented in docs/performance/GATE_POLICY.md."
          exit 1
