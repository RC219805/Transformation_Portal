# Performance Monitor Workflow
# Runs performance tests on main branch and schedule
#
# NOTE: This job uses base dependencies only (no ML extras) to avoid
# ResolutionImpossible conflicts. ML performance tests (test_performance_throughput.py)
# are automatically skipped when torch is not available via pytest.importorskip.
# PR performance validation is handled by ci-consolidated.yml (Throughput Validation)
#
name: Performance Monitor

on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "tests/test_performance*"
      - "scripts/validate_throughput.py"
      - "bench/baselines/**"
      - "requirements/ml.txt"
      - "lux_depth_v2/**"
      - ".github/workflows/performance-monitor.yml"
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Ensure constraints present
        run: |
          if [ ! -f requirements/constraints.txt ]; then
            echo "ERROR: requirements/constraints.txt not found; CI expects this file for security constraints."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Use constraints to exclude vulnerable basicsr (CVE-2024-27763)
          # Install base package without ML extras to avoid dependency conflicts
          pip install -c requirements/constraints.txt -e .
          # Install CI test dependencies (includes pytest, hypothesis, etc.)
          pip install -r requirements-ci.txt
          # Install profiling dependencies
          pip install memory-profiler pytest-benchmark

      - name: Run performance benchmarks
        run: |
          # Run performance tests (non-ML subset)
          # Note: ML performance tests (test_performance_throughput.py) are skipped
          # when torch is not installed via pytest.importorskip
          python -m pytest tests/ -k performance -v \
            --tb=short \
            --maxfail=5

      - name: Run memory profiling
        continue-on-error: true
        run: |
          # Create inline memory test if tests/mem_test.py doesn't exist
          if [ -f tests/mem_test.py ]; then
            python -m memory_profiler tests/mem_test.py > memory-report.txt 2>&1
          else
            echo "No tests/mem_test.py found; skipping memory profiling." > memory-report.txt
          fi

      - name: Generate test summary
        if: always()
        run: |
          echo "Performance test run completed at $(date)" > test-summary.txt
          echo "See pytest output above for results" >> test-summary.txt

      - name: Upload Performance Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-monitor-results
          path: |
            test-summary.txt
            memory-report.txt
          if-no-files-found: warn
          retention-days: 30
