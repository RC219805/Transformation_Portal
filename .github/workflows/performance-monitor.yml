# .github/workflows/performance-monitor.yml
# Performance Regression Testing - Schedule and Manual Only
# NOTE: This workflow does NOT run on PRs to avoid baseline comparison issues.
# Benchmark baselines require cross-run persistence which workflow artifacts don't provide.
# For PR-triggered performance monitoring, see nightly.yml which owns benchmark baselines.
name: Performance Monitor

on:
  schedule:
    # Run nightly at 3:30 AM UTC (staggered from nightly.yml at 2 AM)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: 'Reset the performance baseline (only on main branch)'
        type: boolean
        default: false

# Prevent overlapping scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false  # Don't cancel scheduled runs

permissions:
  contents: read
  issues: write

jobs:
  performance-test:
    name: Performance Regression Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Need history for comparison

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-perf-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e ".[ml]"
          pip install pytest pytest-benchmark memory-profiler

      - name: Fetch baseline from repository (if exists)
        id: baseline
        run: |
          # Baseline storage: repo-stored file at tools/benchmarks/baseline.json
          # This is the supported persistent baseline mechanism.
          # Future enhancement: could also fetch from release assets or dedicated baseline branch.
          BASELINE_FILE=""
          
          if [ -f "tools/benchmarks/baseline.json" ]; then
            BASELINE_FILE="tools/benchmarks/baseline.json"
            echo "baseline_source=repo" >> $GITHUB_OUTPUT
          else
            echo "baseline_source=none" >> $GITHUB_OUTPUT
          fi
          
          echo "baseline_file=$BASELINE_FILE" >> $GITHUB_OUTPUT

      - name: Run performance tests
        id: benchmark
        run: |
          set -euo pipefail
          
          BENCHMARK_EXIT=0
          
          # Check if any benchmark tests exist
          BENCHMARK_COUNT=$(pytest tests/ -m "benchmark" --collect-only -q 2>/dev/null | grep -c "test" || echo "0")
          
          if [ "$BENCHMARK_COUNT" = "0" ]; then
            echo "status=no_tests" >> $GITHUB_OUTPUT
            echo "⚠️ No benchmark tests found (tests marked with @pytest.mark.benchmark)"
            exit 0
          fi
          
          echo "Found $BENCHMARK_COUNT benchmark tests"
          
          COMPARE_ARGS=()
          BASELINE_FILE="${{ steps.baseline.outputs.baseline_file }}"
          
          if [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then
            echo "Using baseline benchmark file: $BASELINE_FILE"
            COMPARE_ARGS=(
              "--benchmark-compare=$BASELINE_FILE"
              "--benchmark-compare-fail=mean:10%"
            )
          else
            echo "No baseline benchmark found; running without regression comparison."
          fi
          
          # Run benchmarks - capture exit code properly
          if pytest tests/ -m "benchmark" \
            --benchmark-only \
            --benchmark-json=current-benchmark.json \
            "${COMPARE_ARGS[@]}"; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            BENCHMARK_EXIT=$?
            if [ $BENCHMARK_EXIT -eq 1 ]; then
              echo "status=regression" >> $GITHUB_OUTPUT
              echo "⚠️ Performance regression detected (>10% mean increase)"
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "❌ Benchmark execution failed with exit code $BENCHMARK_EXIT"
            fi
          fi

      - name: Analyze memory usage
        run: |
          # Memory profiling script
          cat > mem_test.py << 'EOF'
          from memory_profiler import profile
          import sys

          @profile
          def test_import():
              # Test basic imports don't leak memory
              import numpy as np
              import torch
              return True

          if __name__ == "__main__":
              test_import()
          EOF

          python -m memory_profiler mem_test.py > memory-report.txt 2>&1 || echo "Memory profiling skipped"

      - name: Generate performance report
        run: |
          BENCHMARK_STATUS="${{ steps.benchmark.outputs.status }}"
          
          cat > performance-summary.md << EOF
          # 📊 Performance Test Results

          ## Status
          - Benchmark Status: **${BENCHMARK_STATUS:-unknown}**
          - Baseline Source: **${{ steps.baseline.outputs.baseline_source }}**

          ## Benchmark Summary
          $(if [ -f current-benchmark.json ]; then echo "See \`current-benchmark.json\` for detailed results."; else echo "No benchmark results generated."; fi)

          ## Memory Profile
          $(if [ -f memory-report.txt ]; then echo "See \`memory-report.txt\` for memory usage analysis."; else echo "Memory profiling not available."; fi)
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: performance-results
          path: |
            current-benchmark.json
            memory-report.txt
            performance-summary.md
          if-no-files-found: warn
          retention-days: 30
          overwrite: true  # Allow overwriting for baseline storage

      - name: Create issue on regression (deduplicated)
        if: steps.benchmark.outputs.status == 'regression'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            // Check for existing open regression issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression,automated',
              per_page: 10
            });
            
            const existingIssue = issues.find(i => 
              i.title.includes('Performance Regression Detected')
            );
            
            if (existingIssue) {
              // Update existing issue with new run info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **New regression detected**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis regression was detected again on ${new Date().toISOString()}.`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Performance Regression Detected',
                body: `Performance benchmarks detected regression beyond acceptable threshold (>10% mean increase).\n\nCheck the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['performance', 'regression', 'automated']
              });
            }
