# Performance Monitor Workflow
# Runs performance benchmarks and memory profiling
#
# NOTE: This job uses base dependencies only (no ML extras) to avoid
# ResolutionImpossible conflicts. ML-heavy tests run in dedicated workflows.
#
name: Performance Monitor

on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "tests/test_performance*"
      - "scripts/validate_throughput.py"
      - "bench/baselines/**"
      - "requirements/ml.txt"
      - "lux_depth_v2/**"
      - ".github/workflows/performance-monitor.yml"
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Ensure constraints present
        run: |
          if [ ! -f requirements/constraints.txt ]; then
            echo "ERROR: requirements/constraints.txt not found; CI expects this file for security constraints."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Use constraints to exclude vulnerable basicsr (CVE-2024-27763)
          # Install base package without ML extras to avoid dependency conflicts
          pip install -c requirements/constraints.txt -e .
          # Install only the lightweight profiling dependencies
          pip install memory-profiler pytest-benchmark

      - name: Run performance benchmarks
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          # Benchmark core functionality (non-ML)
          # Use -k flag to match existing performance test patterns
          python -m pytest tests/ -k performance \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-sort=mean

      - name: Run memory profiling
        continue-on-error: true
        run: |
          # Create inline memory test if tests/mem_test.py doesn't exist
          if [ -f tests/mem_test.py ]; then
            python -m memory_profiler tests/mem_test.py > memory-report.txt 2>&1
          else
            echo "No tests/mem_test.py found; skipping memory profiling." > memory-report.txt
          fi

      - name: Generate benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results.json ]; then
            cp benchmark-results.json current-benchmark.json
          fi

      - name: Upload Performance Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-monitor-results
          path: |
            benchmark-results.json
            current-benchmark.json
            memory-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let comment = '📊 **Performance Test Results**\n\n';
            comment += '**Benchmark Summary**\n\n';
            comment += 'See artifacts for detailed results.\n\n';
            comment += '**Status**\n\n';
            comment += '✅ Tests completed\n';
            comment += '⚠️ Note: Baseline comparison not yet implemented\n';
            if (fs.existsSync('memory-report.txt')) {
              const memReport = fs.readFileSync('memory-report.txt', 'utf8');
              comment += '**Memory Profile**\n\n```\n' + memReport + '\n```\n';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
