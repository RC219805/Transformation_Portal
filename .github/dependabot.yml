version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Etc/UTC"
    ignore:
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "transformers"
        update-types:
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:15"
      timezone: "Etc/UTC"
    groups:
      codeql-actions:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/cloudflare/transformationportal-worker"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:30"
      timezone: "Etc/UTC"
    groups:
      wrangler-sync:
        applies-to: "version-updates"
        patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
      worker-node-tooling:
        applies-to: "version-updates"
        patterns:
          - "*"
          - "@*/*"
        exclude-patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/web/secure-landing"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:45"
      timezone: "Etc/UTC"
    groups:
      frontdoor-security:
        applies-to: "security-updates"
        patterns:
          - "*"
          - "@*/*"
      frontdoor-node:
        applies-to: "version-updates"
        patterns:
          - "*"
          - "@*/*"
        update-types:
          - "minor"
          - "patch"
