version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Etc/UTC"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:15"
      timezone: "Etc/UTC"
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:30"
      timezone: "Etc/UTC"
    groups:
      root-node-tooling:
        applies-to: "version-updates"
        patterns:
          - "*"
          - "@*/*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/web/secure-landing"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:45"
      timezone: "Etc/UTC"
    groups:
      frontdoor-node:
        applies-to: "version-updates"
        patterns:
          - "*"
          - "@*/*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/cloudflare/transformationportal-worker"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
      timezone: "Etc/UTC"
    groups:
      cloudflare-worker-node:
        applies-to: "version-updates"
        patterns:
          - "*"
          - "@*/*"
        update-types:
          - "minor"
          - "patch"
