# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Ignore updates that break Python 3.10 compatibility
    # Python 3.10 EOL: October 2026
    # See: ADR-005-PYTHON-311-MIGRATION.md (planned)
    ignore:
      - dependency-name: "scipy"
        versions: [">=1.16"]  # scipy 1.16+ requires Python 3.11+
      - dependency-name: "pillow"
        versions: [">=12.0"]  # Pillow 12+ requires Python 3.11+
      - dependency-name: "Pillow"
        versions: [">=12.0"]  # Case-sensitive variant
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
