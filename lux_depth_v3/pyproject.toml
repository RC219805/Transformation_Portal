[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lux-depth-v3"
version = "0.1.0"
description = "Depth Anything 3 integration for luxury real estate rendering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Transformation Portal Team"}
]
keywords = ["depth-estimation", "da3", "depth-anything", "computer-vision", "real-estate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "huggingface-hub>=0.19.0",
    "open3d>=0.17.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

api = [
    "depth-anything-3>=0.1.0",
]

benchmark = [
    "open3d>=0.17.0",
    "scipy>=1.9.0",
]

service = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

all = [
    "lux-depth-v3[dev,api,benchmark,service]",
]

[project.scripts]
lux-depth-v3 = "cli:main"

[project.urls]
Homepage = "https://github.com/RC219805/Transformation_Portal"
Documentation = "https://github.com/RC219805/Transformation_Portal/tree/main/lux_depth_v3/docs"
Repository = "https://github.com/RC219805/Transformation_Portal"
Issues = "https://github.com/RC219805/Transformation_Portal/issues"

[tool.setuptools]
packages = []
py-modules = [
    "cli",
    "config", 
    "da3_wrapper",
    "export",
    "inference",
    "input_manager",
    "license",
    "metric_depth",
    "model_cache",
    "postprocessing",
    "preprocessing",
    "reference_view",
    "service",
    "validation",
]

[tool.setuptools.package-data]
lux_depth_v3 = ["*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
