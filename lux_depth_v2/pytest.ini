[pytest]
# Pytest configuration for lux_depth_v2

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow to run (deselect with '-m "not slow"')
    gpu: marks tests as requiring GPU (deselect with '-m "not gpu"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting:
# addopts =
#     --cov=lux_depth_v2
#     --cov-report=html
#     --cov-report=term-missing

# Minimum Python version
minversion = 3.10

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__ .pytest_cache

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if pytest-timeout is installed)
# timeout = 300
# timeout_method = thread
