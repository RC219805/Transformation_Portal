[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "transformation-portal"
version = "0.1.0"
description = "Professional image and video processing toolkit for luxury real estate rendering and architectural visualization."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RC219805" }]
# Core dependencies - see requirements/base.in for pinned versions
dependencies = [
    # Pin numpy <2.3.0 for opencv-python compatibility
    # See: https://github.com/opencv/opencv-python/issues/954
    "numpy>=1.24,<2.3.0",
    "Pillow>=10.0.0,<12",
    "scipy>=1.15,<1.16",  # scipy 1.16+ requires Python 3.11+, constrain for Python 3.10 compatibility
    "scikit-learn>=1.0,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.10.0,<1",
    "tqdm>=4.66,<5",
    "tifffile>=2023.7.18,<2025",
    "imagecodecs>=2023.9.18,<2025",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# ML and deep learning - see requirements/ml.in for pinned versions
ml = [
    "torch>=2.0,<3",
    "diffusers>=0.20,<1",
    "controlnet-aux>=0.0.6,<1",
    "realesrgan>=0.3.0,<1",
    "transformers>=4.35.0,<5",
    "huggingface-hub>=0.19.0,<1",
    "torchvision>=0.15.0,<1",
    "opencv-python>=4.8.0,<5",
    "scikit-image>=0.21.0,<1",
    "PyYAML>=6.0",
    "colour-science>=0.4.2",
    "coremltools>=7.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
    "sentence-transformers>=2.2.0,<3",
    "accelerate>=0.20.0,<2",
]
# Development tools - see requirements/dev.in for pinned versions
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<6",
    "hypothesis>=6.0,<7",
    "mypy>=1.10",
    "flake8>=7.0",
    "pylint>=3.0",
    "black>=24.8",
    "isort>=5.13,<8",
    "autopep8>=2.0,<3",
    "libcst>=1.2,<2",
    "types-PyYAML>=6.0.12",
]
# CI/CD tools - see requirements/ci.in for pinned versions
ci = [
    "bandit>=1.7,<2",
    "safety>=2.3,<3",
    "build>=1.0,<2",
    "twine>=4.0,<5",
    "tox>=4.5,<5",
    "pypdf>=3.9.0",
]
# All dependencies combined
all = [
    "transformation-portal[ml,dev,ci]",
]

[project.scripts]
# Main CLI entry points
transform-render = "transformation_portal.cli:render_cli"
transform-process = "transformation_portal.cli:process_cli"
transform-analyze = "transformation_portal.cli:analyze_cli"

# Luxury TIFF Batch Processor CLI
luxury-tiff-batch = "luxury_tiff_batch_processor.cli:main"

# Legacy compatibility (can be removed in future versions)
luxury_video_grader = "transformation_portal.processors.luxury_video_master_grader:main"
lux_render = "transformation_portal.pipelines.lux_render_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "data*", "docs*", "scripts"]

[tool.pylint.main]
# Increase limits for complex image/video processing functions
max-args = 8
max-locals = 20
max-branches = 15
max-statements = 60
max-line-length = 127
max-module-lines = 1500

[tool.pylint.messages_control]
# Disable specific checks that are overly strict for this codebase
disable = [
    "too-few-public-methods",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "duplicate-code",
    "fixme",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --maxfail=3 --disable-warnings"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
