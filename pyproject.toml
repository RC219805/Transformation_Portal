[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "transformation-portal"
version = "0.1.0"
description = "Professional image and video processing toolkit for luxury real estate rendering and architectural visualization."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RC219805" }]
# Core dependencies - see requirements/base.in for pinned versions
dependencies = [
    # Pin numpy <2.3.0 for opencv-python compatibility
    # See: https://github.com/opencv/opencv-python/issues/954
    "numpy>=1.24,<2.3.0",
    "Pillow>=10.0.0,<12",
    "scipy>=1.15,<2",
    "scikit-learn>=1.0,<2",
    "opencv-python>=4.8.0,<5",  # required for depth_writer (core pipeline)
    "typer>=0.10.0,<1",
    "tqdm>=4.66,<5",
    "tifffile>=2023.7.18,<2025",
    "imagecodecs>=2023.9.18,<2025",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# ML and deep learning - see requirements/ml.in for pinned versions
# ML dependencies. Note: `realesrgan` is BANNED (unmaintained).
# Enforcement: requirements/constraints.txt hard-block pins + scripts/security/verify_banned_dependencies.py
ml = [
    "torch>=2.0,<3",
    "diffusers>=0.20,<1",
    "controlnet-aux>=0.0.6,<1",
    "transformers>=4.35.0,<5",
    "huggingface-hub>=0.19.0,<2",
    "torchvision>=0.15.0,<1",
    # opencv-python moved to core dependencies (required for depth_writer)
    "scikit-image>=0.21.0,<1",
    "PyYAML>=6.0",
    "colour-science>=0.4.2",
    "coremltools>=7.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
    "sentence-transformers>=2.2.0,<3",
    "accelerate>=0.20.0,<2",
]
# Development tools - see requirements/dev.in for pinned versions
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<8",
    "hypothesis>=6.0,<7",
    "mypy>=1.10",
    "flake8>=7.0",
    "pylint>=3.0",
    "black>=24.8",
    "isort>=5.13,<8",
    "autopep8>=2.0,<3",
    "libcst>=1.2,<2",
    "types-PyYAML>=6.0.12",
]
# CI/CD tools - see requirements/ci.in for pinned versions
ci = [
    "bandit>=1.7,<2",
    "safety>=2.3,<3",
    "build>=1.0,<2",
    "twine>=4.0,<5",
    "tox>=4.5,<5",
    "pypdf>=3.9.0",
]
# All dependencies combined
all = [
    "transformation-portal[ml,dev,ci]",
]

[project.scripts]
# Main CLI entry points
transform-render = "transformation_portal.cli:render_cli"
transform-process = "transformation_portal.cli:process_cli"
transform-analyze = "transformation_portal.cli:analyze_cli"

# Luxury TIFF Batch Processor CLI
luxury-tiff-batch = "luxury_tiff_batch_processor.cli:main"

# Legacy compatibility (can be removed in future versions)
luxury_video_grader = "transformation_portal.processors.luxury_video_master_grader:main"
lux_render = "transformation_portal.pipelines.lux_render_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "data*", "docs*", "scripts"]

[tool.pylint.main]
# Increase limits for complex image/video processing functions
max-args = 8
max-locals = 20
max-branches = 15
max-statements = 60
max-line-length = 127
max-module-lines = 1500

[tool.pylint.messages_control]
# Disable specific checks that are overly strict for this codebase
disable = [
    "too-few-public-methods",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "duplicate-code",
    "fixme",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --tb=short -p no:warnings"
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = "test_*.py"
python_classes = "Test*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: fast unit tests (<1s each)",
    "regression: regression tests with known fixtures",
    "integration: tests requiring multiple components",
    "ml: tests requiring ML models/large downloads",
    "golden: golden regression tests with curated fixtures",
    "stress: stress tests for large batches and resource limits (deselect with '-m \"not stress\"')",
    "benchmark: performance benchmarks with budgets",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/venv_py311/*",
    "*/.venv/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Coverage thresholds - enforced in CI
# Strategy: Start at current baseline, ratchet upward
[tool.coverage.paths]
source = ["src/transformation_portal"]

# Black formatting configuration
[tool.black]
line-length = 127
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | venv_py311
  | _build
  | buck-out
  | build
  | dist
  | deprecated
)/
'''

# isort configuration (compatible with black)
[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/deprecated/*", "*/archive/*", "*/.venv/*", "*/venv/*"]
