# APEX Policy Schema Definitions
# Version: 1.0.0
# Last Updated: 2026-02-09

# This file defines the schema structure for APEX policy files.
# All policy files must conform to these schemas.

---
# Schema: Performance Budgets
# File: performance_budgets.yaml

schema_performance_budgets:
  type: object
  required:
    - schema_version
    - effective_date
    - review_date
    - policy_owner
    - budgets
  properties:
    schema_version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      description: "Semantic version of this policy schema"
    
    effective_date:
      type: string
      format: date
      description: "When this policy becomes active (ISO 8601 date)"
    
    review_date:
      type: string
      format: date
      description: "When this policy must be reviewed (quarterly recommended)"
    
    policy_owner:
      type: string
      description: "GitHub username responsible for this policy"
    
    baseline:
      type: object
      properties:
        source:
          type: string
          enum: ["ledger", "synthetic"]
        minimum_sample_size:
          type: integer
          minimum: 1
        confidence_level:
          type: number
          minimum: 0.0
          maximum: 1.0
    
    budgets:
      type: array
      items:
        type: object
        required:
          - workflow_version
          - bucket_name
          - stability_tier
          - thresholds
          - enforcement
        properties:
          workflow_version:
            type: string
            enum: ["v1", "v2"]
          
          bucket_name:
            type: string
            description: "Must match bucket names in DEFAULT_BUCKETS"
          
          stability_tier:
            type: string
            enum: ["stable", "canary", "experimental"]
          
          thresholds:
            type: object
            required:
              - p50_sec
              - p95_sec
              - max_regression_pct
            properties:
              p50_sec:
                type: number
                minimum: 0
              p95_sec:
                type: number
                minimum: 0
              max_regression_pct:
                type: number
                minimum: 0
              warn_regression_pct:
                type: number
                minimum: 0
          
          enforcement:
            type: object
            required:
              - mode
              - effective_from
            properties:
              mode:
                type: string
                enum: ["shadow", "enforce", "disabled"]
              effective_from:
                type: string
                format: date
              review_required:
                type: boolean
          
          notes:
            type: string
            description: "Optional rationale and evidence links"
    
    tier_policies:
      type: object
      properties:
        stable:
          $ref: "#/definitions/tier_policy"
        canary:
          $ref: "#/definitions/tier_policy"
        experimental:
          $ref: "#/definitions/tier_policy"

definitions:
  tier_policy:
    type: object
    required:
      - description
      - required_baseline_days
      - min_sample_size
      - max_change_frequency
    properties:
      description:
        type: string
      required_baseline_days:
        type: integer
        minimum: 1
      min_sample_size:
        type: integer
        minimum: 1
      max_change_frequency:
        type: string
        enum: ["weekly", "monthly", "quarterly"]

---
# Schema: Enforcement Policy
# File: enforcement_policy.yaml

schema_enforcement_policy:
  type: object
  required:
    - schema_version
    - evidence_gates
    - statistical_methods
    - sample_size_requirements
  properties:
    schema_version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+$"
    
    evidence_gates:
      type: object
      properties:
        shadow_mode:
          $ref: "#/definitions/evidence_gate"
        enforce_mode:
          $ref: "#/definitions/evidence_gate"
    
    statistical_methods:
      type: object
      properties:
        distribution_comparison:
          type: object
          properties:
            method:
              type: string
              enum: ["mann_whitney_u", "bootstrap_ci", "welch_t"]
            alpha:
              type: number
              minimum: 0.0
              maximum: 1.0
        
        outlier_detection:
          type: object
          properties:
            method:
              type: string
              enum: ["median_mad", "iqr", "zscore"]
            threshold:
              type: number
              minimum: 0.0
    
    sample_size_requirements:
      type: object
      properties:
        p50:
          type: integer
          minimum: 1
        p95:
          type: integer
          minimum: 1
        p99:
          type: integer
          minimum: 1

definitions:
  evidence_gate:
    type: object
    required:
      - description
      - min_sample_size
      - allow_synthetic_data
    properties:
      description:
        type: string
      min_sample_size:
        type: integer
        minimum: 1
      allow_synthetic_data:
        type: boolean
      required_baseline_age_days:
        type: integer
        minimum: 1
      confidence_level:
        type: number
        minimum: 0.0
        maximum: 1.0

---
# Schema: Governance Rules
# File: governance_rules.yaml

schema_governance_rules:
  type: object
  required:
    - schema_version
    - waivers
    - budget_changes
    - incidents
  properties:
    schema_version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+$"
    
    waivers:
      type: object
      required:
        - allowed_scopes
        - required_fields
        - labels
        - expiry
      properties:
        allowed_scopes:
          type: array
          items:
            type: string
            enum: ["single_bucket", "single_zone", "workflow_version"]
        
        required_fields:
          type: array
          items:
            type: string
        
        labels:
          type: object
          properties:
            pr_label:
              type: string
            tracking_label:
              type: string
        
        expiry:
          type: object
          properties:
            default_days:
              type: integer
              minimum: 1
            max_days:
              type: integer
              minimum: 1
            auto_close_on_expiry:
              type: boolean
    
    budget_changes:
      type: object
      properties:
        required_evidence:
          type: array
          items:
            type: string
        required_review:
          type: object
          properties:
            label:
              type: string
            min_approvers:
              type: integer
              minimum: 1
        documentation:
          type: object
          properties:
            changelog_required:
              type: boolean
            adr_required_for_major_changes:
              type: boolean
    
    incidents:
      type: object
      properties:
        triggers:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
              severity:
                type: string
                enum: ["low", "medium", "high", "critical"]
              auto_create_issue:
                type: boolean
        
        issue_template:
          type: object
          properties:
            title_format:
              type: string
            labels:
              type: array
              items:
                type: string
            assignees:
              type: array
              items:
                type: string

---
# Schema: Workload Suites
# File: workload_suites.yaml

schema_workload_suites:
  type: object
  required:
    - schema_version
    - golden_suite
    - canary_suite
    - fuzz_suite
  properties:
    schema_version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+$"
    
    golden_suite:
      $ref: "#/definitions/workload_suite"
    
    canary_suite:
      $ref: "#/definitions/workload_suite"
    
    fuzz_suite:
      $ref: "#/definitions/fuzz_suite"
    
    ci_lanes:
      type: object
      additionalProperties:
        type: object
        properties:
          workload:
            type: string
          mode:
            type: string
            enum: ["synthetic", "real"]
          max_duration_min:
            type: integer
            minimum: 1
          sample_size:
            type: [string, integer]
          backends:
            type: array
            items:
              type: string

definitions:
  workload_suite:
    type: object
    required:
      - description
      - fixture_dir
      - change_policy
      - usage
    properties:
      description:
        type: string
      fixture_dir:
        type: string
      images:
        type: array
        items:
          type: string
      size:
        type: integer
        minimum: 1
      selection_criteria:
        type: array
        items:
          type: string
      change_policy:
        type: object
        properties:
          requires_adr:
            type: boolean
          requires_pr:
            type: boolean
          approval:
            type: string
          min_notice_days:
            type: integer
            minimum: 0
      usage:
        type: array
        items:
          type: string
  
  fuzz_suite:
    type: object
    required:
      - description
      - generation_script
      - usage
    properties:
      description:
        type: string
      generation_script:
        type: string
      scenarios:
        type: array
        items:
          type: string
      usage:
        type: array
        items:
          type: string
