# TODO Priority Schema v2
# ========================
# Defines documented priority levels, categories, and exclusions for TODO governance.
#
# This file is the canonical schema/documentation artifact for TODO taxonomy.
# Update scanner or CI references here only when those tools explicitly load
# this YAML, so comments remain aligned with actual enforcement behavior.

version: 2
last_updated: "2026-06-11"

current_scan_baseline:
  scanner: "scripts/validation/scan_todo_inventory.py"
  snapshot: "docs/analysis/todo_scanner_snapshot.json"
  refresh_command: "python scripts/validation/scan_todo_inventory.py --write-snapshot"
  governance_command: "python scripts/validation/scan_todo_inventory.py --check-governance"
  files_scanned: 1753
  total_items: 25
  ungoverned_items: 0
  by_type:
    NotImplementedError: 25
  notes:
    - "All current items are governed abstract/base-class stubs, phase gates, platform limits, fail-closed dispatch guards, or test protocol stubs."
    - "The scanner excludes docs/ and generated/vendor/runtime directories, so documentation TODO prose remains narrative context rather than CI-enforced backlog."

scan_scope:
  python_roots:
    - "src/"
    - "tests/"
    - "scripts/"
    - "tools/"
  javascript_typescript_root: "web/"
  excluded_self_file: "scripts/validation/scan_todo_inventory.py"

priorities:
  P0:
    definition: "Critical, release blocker"
    sla: "Must resolve before release"
    examples:
      - "Security vulnerabilities"
      - "Data loss risks"
      - "Contract-breaking regressions"
    color: "red"

  P1:
    definition: "High, complete before next release"
    sla: "Within 1 release cycle"
    examples:
      - "Contract-breaking changes"
      - "Governance gaps"
      - "Test coverage gaps for critical paths"
    color: "orange"

  P2:
    definition: "Medium, scheduled"
    sla: "Within 2-3 releases"
    examples:
      - "Feature completeness"
      - "UX improvements"
      - "Documentation updates"
    color: "yellow"

  P3:
    definition: "Low, deferred"
    sla: "Backlog"
    examples:
      - "Experimental features"
      - "Research items"
      - "Technical debt reduction"
    color: "blue"

  P4:
    definition: "Enhancement, nice-to-have"
    sla: "No SLA"
    examples:
      - "Optimization research"
      - "Cosmetic improvements"
      - "Developer ergonomics"
    color: "gray"

categories:
  actionable:
    security:
      description: "Security-related TODOs requiring immediate attention"
      requires_tracking: true

    contract_stability:
      description: "TODOs affecting public API contracts"
      requires_tracking: true

    test_coverage:
      description: "Missing or incomplete test coverage"
      requires_tracking: true

    performance:
      description: "Performance improvements or bottlenecks"
      requires_tracking: true

  non_actionable:
    phase_gated:
      description: "TODOs deliberately deferred to a future phase"
      requires_tracking: true
      tracking_pattern: "TODO(Phase X):"

    inventory_governed:
      description: "Known gaps governed by TODO_INVENTORY.md section references"
      requires_tracking: true
      tracking_pattern: "(TODO_INVENTORY.md) or (TODO_INVENTORY.md §X.Y)"
      note: "Section references are recommended for precision but are not required by current scanner enforcement."

    security_pattern:
      description: "False positives from security regex patterns"
      requires_tracking: false
      examples:
        - "TODO_REPLACE in model_lock.py"

    observational:
      description: "Notes for future consideration, not actionable now"
      requires_tracking: false

    documentation:
      description: "Historical markers in documentation files"
      requires_tracking: false

exclusions:
  # Patterns that are false positives (not actual TODOs)
  patterns:
    - pattern: "TODO_REPLACE"
      reason: "Security scanner pattern for detecting placeholder credentials"
      locations:
        - "src/transformation_portal/core/security/model_lock.py"
        - "src/transformation_portal/preset_governance.py"

  # Paths excluded from TODO scanning
  paths:
    - path: "docs/"
      reason: "Historical documentation markers are informational"

    - path: "scripts/validation/scan_todo_inventory.py"
      reason: "Scanner contains governance examples and CLI documentation"

    - path: "__pycache__/"
      reason: "Generated bytecode"

    - path: "node_modules/"
      reason: "Third-party dependencies"

    - path: ".next/"
      reason: "Generated Next.js build output"

    - path: ".next-build-verify/"
      reason: "Generated frontdoor build verification output"

    - path: ".next-smoke-*/"
      reason: "Generated frontdoor smoke output"

    - path: ".next-codex-*/"
      reason: "Generated Codex frontdoor build output"

    - path: ".venv/"
      reason: "Virtual environment"

    - path: ".git/"
      reason: "Git metadata"

    - path: ".runtime/"
      reason: "Runtime environment"

governance:
  # Reference patterns that indicate proper TODO governance
  tracking_patterns:
    - pattern: "(Phase X)"
      description: "Phase-gated work"
      example: "# TODO(Phase 3): Add support for..."

    - pattern: "(ADR-XXX)"
      description: "ADR-linked work"
      example: "# TODO(ADR-044): Implement marker..."

    - pattern: "(#1234)"
      description: "Issue-linked work"
      example: "# TODO(#1234): Fix edge case..."

    - pattern: "(@owner)"
      description: "Owner-assigned work"
      example: "# TODO(@specialist): Review..."

    - pattern: "(TODO_INVENTORY.md) or (TODO_INVENTORY.md §X.Y)"
      description: "Inventory-linked known gap"
      example: 'raise NotImplementedError("... (TODO_INVENTORY.md §2.4)")'

  # Types of TODO markers recognized
  marker_types:
    - marker: "TODO"
      description: "General task marker"

    - marker: "FIXME"
      description: "Bug or issue that needs fixing"

    - marker: "HACK"
      description: "Workaround that should be improved"

    - marker: "XXX"
      description: "Attention needed, potential problem"

    - marker: "NotImplementedError"
      description: "Unimplemented functionality"

  auto_governed_not_implemented:
    description: "NotImplementedError raises treated as governed when they are idiomatic abstract/base-class stubs."
    examples:
      - "raise NotImplementedError"
      - 'raise NotImplementedError("Subclass must implement process()")'
