name: depth-pro-example
description: "Apple Depth Pro for metric depth estimation (experimental preset)"
tier: experimental
notes: |
  Requires checkpoint: checkpoints/depth_pro.pt (1.9 GB, not in repo)
  Download: https://ml-site.cdn-apple.com/models/depth-pro/depth_pro.pt
  Optimized for Apple Silicon (MPS), fallback to CPU

  WARNING: Experimental tier - for research and evaluation only.
  Use at your own risk. Default backend remains Depth Anything V3.

depth_backend: depth_pro

model:
  variant: depth-pro
  device: mps
  checkpoint_path: checkpoints/depth_pro.pt
  expected_sha256: d6d389aada202b73293019ec01ea89af02c2523b

processing:
  # Depth Pro outputs metric depth, may require different normalization
  apply_bilateral: false
  enable_zone_mapping: false

  pbr:
    enabled: true
    normal_strength: 1.0
    roughness_strength: 1.0
    ao_strength: 1.0

io:
  cache_enabled: true
  output_format: png
  depth_bit_depth: 16
