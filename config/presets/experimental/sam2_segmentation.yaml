# SAM2 Segmentation Preset (Experimental)
#
# Status: EXPERIMENTAL - Development/testing preset
# Stability: experimental
# Last Updated: 2026-02-18
#
# ⚠️  WARNING: This preset is for development and testing only.
# ⚠️  Use sam2_segmentation (stable) or sam2_segmentation_canary for production.
#
# Purpose:
#   Development and testing of new SAM2 features before promotion
#   to canary/stable presets.
#
# Migration Path:
#   experimental → canary → stable
#
# Current Development Features:
#   - Custom material taxonomies
#   - Advanced refinement algorithms
#   - Experimental quality gates
#
# Usage:
#   transformation_portal spatial-ai segment \
#     --preset experimental/sam2_segmentation \
#     --input scene.tiff \
#     --output output/

name: "SAM2 Segmentation (Experimental)"
version: "4.0.0-dev"
tier: "dev"
stability: "experimental"
license: "Apache-2.0"

# Extends stable preset
extends: sam2_segmentation

# Experimental Overrides
# Can test different model sizes and experimental features

# Model Configuration (override stable defaults)
model:
  backend: "sam2"
  model_size: "large"  # Options: "base", "large"
  checkpoint_path: "checkpoints/sam2.1_hiera_large.pt"
  device: "auto"  # Options: "auto", "cuda", "cpu", "mps"

# Segmentation Parameters
segmentation:
  mode: "auto"  # Options: "auto", "points", "bbox", "video"

  # Quality thresholds
  min_area: 100  # Minimum mask area in pixels
  min_stability: 0.5  # Minimum stability score [0, 1]

  # Refinement
  refine_masks: true
  refinement_kernel_size: 3

  # Overlap handling
  resolve_overlaps: true

# Material Classification (Optional)
material_classification:
  enabled: false  # Set to true to enable CLIP classification
  confidence_threshold: 0.3
  classes:
    - "wood floor"
    - "wood panel"
    - "marble surface"
    - "granite stone"
    - "limestone wall"
    - "travertine tile"
    - "brushed steel"
    - "polished brass"
    - "copper metal"
    - "aluminum frame"
    - "clear glass"
    - "frosted glass"
    - "tinted glass"
    - "linen fabric"
    - "velvet upholstery"
    - "silk curtain"
    - "cotton textile"
    - "concrete wall"
    - "concrete floor"
    - "leather furniture"
    - "painted wall"
    - "plaster ceiling"
    - "ceramic tile"
    - "porcelain surface"

# Temporal Tracking (Video Mode)
temporal:
  enabled: false  # Enable for video sequences
  iou_threshold: 0.5  # IoU threshold for tracking

# Input Contract (SpatialCaptureV1)
input:
  gamma: 1.0  # Enforced (linear RGB only)
  dtype: "float32"
  channels: 3
  bit_depth: 32

# Output Configuration
output:
  emit_masks: true  # Save masks as PNG
  emit_metadata: true  # Save JSON metadata
  emit_visualization: true  # Save overlay visualization

# Performance
performance:
  batch_size: 1
  enable_caching: true
  memory_efficient: false

# Validation
validation:
  check_isolation: true  # ADR-023 compliance
  check_contract: true  # SpatialCaptureV1 validation
