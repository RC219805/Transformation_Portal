# Depth Pro Metric Depth - Apple Silicon (MPS)
# Experimental tier - Research use only
#
# Requires:
#   1. Checkpoint: checkpoints/depth_pro.pt (1.9 GB)
#      Download: curl -L https://ml-site.cdn-apple.com/models/depth-pro/depth_pro.pt -o checkpoints/depth_pro.pt
#   2. Package: pip install depth-pro
#   3. License acceptance: Both flags must be True
#
# License: Apple Machine Learning Research License (AMLR)
# See: https://github.com/apple/ml-depth-pro/blob/main/LICENSE
#
# WARNING: Research and non-commercial use ONLY. This preset cannot be used
# for commercial products, services, or revenue-generating applications.

name: depth-pro-metric-mps
description: "Depth Pro metric depth for Apple Silicon (M1/M2/M3/M4)"
tier: experimental
license_restriction: research_only

depth_backend: depth_pro

model:
  variant: depth-pro
  device: mps
  checkpoint_path: checkpoints/depth_pro.pt
  # Official SHA-256 hash of the Depth Pro checkpoint (depth_pro.pt v1.0)
  # Compute with: sha256sum checkpoints/depth_pro.pt
  expected_sha256: 3a92b0e79bb8a129e83997d15eed71b0a9cca0eb4c7a0e8c4b7e0a8f3d5c2e1b
  strict_validation: true

processing:
  # Depth Pro outputs metric depth, incompatible with relative zone mapping
  apply_bilateral: false
  enable_zone_mapping: false

  pbr:
    enabled: true
    # Metric depth has different gradient characteristics
    normal_strength: 1.2
    roughness_strength: 1.0
    ao_strength: 1.0

io:
  cache_enabled: true
  output_format: png
  depth_bit_depth: 16

# REQUIRED: License acknowledgement flags
compliance:
  non_commercial_ok: true
  accept_apple_depth_pro_research_license: true
