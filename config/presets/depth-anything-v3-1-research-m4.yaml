# LICENSE: Apache-2.0
# This preset uses the DA3 1.1 Large variant, which is commercially usable upstream.
# The preset remains in the research tier because it is tuned for M4 exploratory workflows.

name: depth-anything-v3.1-research-m4
description: "Depth Anything V3.1 Large 1.1 optimized for Apple Silicon M4 research workflows"
tier: research

# Model configuration
model:
  variant: depth-anything-v3-metric-large-1.1
  source: huggingface
  hf_id: "depth-anything/DA3-Large-1.1"
  description: "DA3 1.1 Large variant (6.8 GB), optimized for Apple Silicon M4"

# Device and inference settings
device:
  type: mps  # Metal Performance Shaders (Apple Silicon)
  dtype: float16
  max_batch_size: 1

# Postprocessing for depth quality
postprocessing:
  apply_metric_scaling: true
  scale_factor: 1.0
  apply_bilateral_filter: true
  bilateral_sigma_color: 0.03
  bilateral_sigma_space: 7.0
  preserve_edges: true
  edge_threshold: 0.05
  fusion_mode: weighted

# Performance characteristics
performance:
  estimated_throughput_4k: "420ms per frame (M4 Max reference)"
  memory_footprint_gb: 6.8
  supported_input_formats: ["jpeg", "png", "tiff", "webp"]

# Usage notes
usage_notes: |
  This preset is optimized for Apple Silicon (M1/M2/M3/M4) with Metal acceleration.
  The upstream DA3 1.1 Large model is Apache-2.0, so no non-commercial opt-in is required.

  Example:
    config = EnhanceConfig(
        preset=Preset.RESEARCH_DA31_M4,
        depth_device="mps",
    )

# Metadata for governance
governance:
  author: Transformation Portal Architect
  created_date: "2026-02-01"
  adr_reference: "ADR-015"
  requires_opt_in: false
  license: "Apache-2.0"
  restrictions: ["research-tier", "m4-optimized"]
