# Professional Pipeline Configuration
# ===================================
#
# This configuration file defines presets and parameters for the
# Transformation Portal Professional Pipeline.
#
# Usage:
#   python -m transformation_portal.pipelines.pro_pipeline process image.jpg --config pro_pipeline_config.yaml

# Default global settings
global:
  device: auto  # auto, cpu, cuda, mps
  quality: high  # draft, standard, high, ultra
  output_format: tiff  # jpg, png, tiff
  bit_depth: 16  # 8, 16, 32
  preserve_metadata: true
  use_cache: true
  num_workers: 4

# Stage configurations
stages:
  # Stage 1: Depth-Aware Processing
  depth:
    model: depth-anything-v2-base  # small, base, large
    use_coreml: true  # Use Apple Neural Engine on M-series chips
    atmospheric_haze:
      enabled: false
      strength: 0.22
      near: 15.0
      far: 85.0
    clarity:
      enabled: true
      amount: 0.15
      radius: 3
    zone_tone_mapping:
      enabled: false
      operator: agx  # agx, reinhard, filmic

  # Stage 2: AI Enhancement
  ai:
    model: stable-diffusion-xl-1.0  # sdxl, sd-1.5
    controlnet:
      enabled: true
      type: canny  # canny, depth, normal
      conditioning_scale: 0.7
    steps: 30
    guidance_scale: 7.5
    strength: 0.45
    upscale:
      enabled: false
      method: realesrgan  # realesrgan, lanczos, bicubic
      scale: 4

  # Stage 3: Material Response
  material:
    strength: 0.65
    surfaces:
      - wood
      - metal
      - glass
      - fabric
      - stone
    preserve_highlights: true
    micro_contrast: 0.08

  # Stage 4: Color Grading
  grading:
    lut:
      enabled: false
      path: assets/luts/film_emulation/Kodak_2393.cube
      intensity: 0.8
    tone_curve: agx  # agx, agx-high, filmic, reinhard
    exposure: 0.0
    contrast: 1.08
    saturation: 1.08
    vibrance: 0.05
    temperature: 0  # -100 to 100 (warm to cool)
    tint: 0  # -100 to 100 (green to magenta)

  # Stage 5: Finishing
  finishing:
    sharpen:
      enabled: true
      amount: 0.14
      radius: 1.0
      threshold: 0
    clarity:
      enabled: true
      amount: 0.18
      protect_shadows: true
      protect_highlights: true
    micro_contrast:
      enabled: true
      amount: 0.04
      radius: 8
    glow:
      enabled: false
      amount: 0.12
      threshold: 0.8
    vignette:
      enabled: false
      amount: 0.15
      roundness: 1.0

# Preset configurations
presets:
