# Performance tuning
performance:
  # Batch processing
  batch:
    chunk_size: 4
    use_multiprocessing: true
    max_workers: 6

  # Memory management
  memory:
    max_image_size: 8192  # Maximum dimension
    cache_size_mb: 2048
    aggressive_cleanup: false

  # GPU settings
  gpu:
    prefer_fp16: true  # Use half precision for speed
    batch_size: 1
    enable_attention_slicing: true

# Output settings
output:
  # Naming convention
  naming:
    suffix: "_{preset}"  # Can include {preset}, {stage}, {timestamp}
    preserve_original_name: true

  # Quality settings
  jpeg:
    quality: 95
    optimize: true
    progressive: true

  png:
    compress_level: 6
    optimize: true

  tiff:
    compression: tiff_adobe_deflate
    predictor: 2

  # Metadata
  metadata:
    preserve_exif: true
    preserve_iptc: true
    preserve_xmp: true
    add_processing_info: true
