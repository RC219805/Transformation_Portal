# Materials V3 + SAM2 Segmentation Preset
#
# Enables state-of-the-art material segmentation with SAM2 backend and
# material-aware perceptual finishing.
#
# Prerequisites:
#   - transformers and torch installed: pip install transformers torch
#   - SAM2 model auto-downloads on first use (~1.2GB for base model)
#
# Performance:
#   - Segmentation overhead (SAM2-base, CPU): ~3-5s per image
#   - Segmentation overhead (SAM2-base, CUDA): ~1-2s per image
#   - Total pipeline: ~4-7s per image with V2 enhancement
#
# Quality vs EfficientSAM:
#   - Higher mask quality (better boundaries, fewer false positives)
#   - Better handling of complex scenes (multiple materials, reflections)
#   - Larger model (~1.2GB vs ~50MB)
#   - Slower inference (3-5x slower than EfficientSAM on CPU)
#
# Disk Usage:
#   - Temporary masks: ~5-20MB per image (auto-cleaned)
#   - SAM2 base model: ~1.2GB (one-time download)
#   - SAM2 large model: ~2.5GB (one-time download, higher quality)

depth_model:
  variant: "small"  # DA3 small variant for speed
  backend: "pytorch_mps"  # Use MPS on macOS, CUDA on Linux, CPU fallback
  cache_size: 100

processing:
  # Depth map postprocessing
  depth_postprocessing:
    enabled: true
    method: bilateral
    sigma: 4.0
    edge_preserve: 0.12
    preserve_scale: true

  # Depth-aware denoising
  depth_aware_denoise:
    enabled: true
    sigma_spatial: 2.0
    preserve_strength: 0.85

  # Zone-based tone mapping
  zone_tone_mapping:
    enabled: true
    num_zones: 3
    method: "agx"
    zone_params:
      - {contrast: 1.15, saturation: 1.1, exposure: 0.05}  # Foreground
      - {contrast: 1.0, saturation: 1.0, exposure: 0.0}    # Midground
      - {contrast: 0.9, saturation: 0.95, exposure: -0.05} # Background

  # Disable atmospheric effects for clarity
  atmospheric_effects:
    enabled: false

  # Depth-guided filters
  depth_guided_filters:
    enabled: true
    clarity_strength: 0.5

  # Depth of field (optional)
  depth_of_field:
    enabled: false

# ============================================================================
# Materials V3 Configuration with SAM2 Backend
# ============================================================================

materials_v3:
  # Enable Materials V3 surface-aware finishing
  enable_materials_v3: true

  # Enable pixel operations (material-specific enhancements)
  apply_pixel_ops: true

  # Material segmentation backend - SAM2 for highest quality
  enable_material_segmentation: true
  material_segmentation_backend: "sam2"  # State-of-the-art segmentation

  # SAM2 model configuration (if supported by config system)
  # sam2_model_size: "base"  # Options: "base" (1.2GB), "large" (2.5GB)
  # sam2_device: "cuda"      # Options: "cuda", "cpu", "mps" (falls back to CPU)

  # Strict backend mode: fail if SAM2 unavailable
  # Set to false for graceful fallback to stub backend
  strict_backend: false  # Recommended: false for production

  # Material detection thresholds
  min_coverage_px: 500      # Minimum pixels for material detection
  min_mean_conf: 0.20       # Minimum confidence threshold

  # Refinement strategy
  refinement_strategy: "canary"  # Conservative refinements only

  # Glass material response
  glass_response_enabled: true

# ============================================================================
# V2 Enhancement Configuration
# ============================================================================

v2_enhancement:
  # Enable V2 enhancement stage (material-aware perceptual finishing)
  enable_v2: true

  # V2 preset (default is balanced for luxury real estate)
  v2_preset: "default"

  # V2 processing device
  v2_device: "cpu"  # Options: cpu, cuda, mps

  # V2 subprocess timeout (seconds)
  v2_timeout: 120

  # Upscaler backend (optional)
  # v2_upscaler_backend: "esrgan"  # Uncomment to enable upscaling

# ============================================================================
# Output Configuration
# ============================================================================

output:
  # Emit master 16-bit output (linear RGB, archival quality)
  emit_master16: false

  # Emit upscaled 16-bit output
  emit_upscaled16: false

  # PBR map generation
  generate_pbr: false

# ============================================================================
# Performance Optimization
# ============================================================================

optimization:
  production_resolution: 1024  # Max resolution for batch processing
  batch_size: 4                # Parallel processing (if supported)

  # Hash mode for output key generation
  # xxhash: 5x faster than SHA-1 (requires xxhash package)
  # sha1: Standard, always available
  hash_mode: "sha1"  # Change to "xxhash" if installed

# ============================================================================
# Usage Example
# ============================================================================
#
# CLI Usage:
#
#   python -m transformation_portal.lux_depth_v3 \
#     input_images/ \
#     --output-root output/ \
#     --config config/materials_v3_sam2.yaml
#
# Python API:
#
#   from transformation_portal.lux_depth_v3 import EnhanceConfig, EnhanceOrchestrator
#
#   # Load SAM2 config
#   config = EnhanceConfig.from_yaml("config/materials_v3_sam2.yaml")
#
#   orchestrator = EnhanceOrchestrator(config, output_root)
#   orchestrator.process_batch(input_paths)
#
# Performance Comparison (1024×1024, M4 CPU):
#   - Stub backend: ~2s (no segmentation)
#   - EfficientSAM: ~2.5s (50MB model, fast)
#   - SAM2-base: ~5s (1.2GB model, highest quality)
#   - SAM2-large: ~8s (2.5GB model, research quality)
#
# Quality Ranking:
#   1. SAM2-large (best boundaries, complex scenes)
#   2. SAM2-base (excellent quality, production-ready)
#   3. EfficientSAM (good quality, very fast)
#   4. Stub (no segmentation, baseline)
#
