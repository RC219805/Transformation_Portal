# --- 3DGS Artifact Attestation ---
# Note: 3DGS artifacts require source-attestation verification, not just HF model lock.
# These entries track the verification framework; exact artifacts pending Inria release.
artifact_attestation:
  gaussian_splatting:
    backend: inria_graphdeco
    source_type: direct_checkpoint  # git_release | direct_checkpoint | local_import
    source_url: "PENDING_CANONICAL_URL"  # Exact URL pending Inria verification
    source_commit_or_tag: "PENDING_VERIFICATION"
    artifacts:
      - filename: "gaussian_splatting_base.pt"
        sha256: "PENDING_VERIFICATION"
        filesize_bytes: null  # null = not yet verified; validation should fail on null
    verification:
      method: sha256+source_commit  # sha256_only | sha256+source_commit | reproducibility_trial
      required: true
      notes: |
        3DGS revision verification requires verifying the full revision tuple:
        - code revision
        - rasterizer backend revision
        - optimizer behavior
        - serialization format of splat params
        See: scripts/validation/verify_3dgs_artifacts.py
