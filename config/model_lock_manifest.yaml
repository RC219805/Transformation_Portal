# --- 3DGS Source Attestation ---
# Note: The Inria gaussian-splatting upstream distributes source code, not a
# binary checkpoint. There is no "gaussian_splatting_base.pt" artifact released
# by graphdeco-inria. The previous direct_checkpoint entry attesting one was
# inaccurate. This block now attests the source repository commit instead.
artifact_attestation:
  gaussian_splatting:
    backend: inria_graphdeco
    source_type: git_release  # git_release | direct_checkpoint | local_import
    source_url: "https://github.com/graphdeco-inria/gaussian-splatting"
    # Pinned to the upstream main branch commit for source attestation.
    source_commit_or_tag: "54c035f7834b564019656c3e3fcc3646292f727d"
    artifacts: []  # No binary release; source-only attestation
    verification:
      method: source_commit  # sha256_only | sha256+source_commit | source_commit | reproducibility_trial
      required: true
      notes: |
        3DGS source verification pins the upstream code revision. Runtime
        reproducibility additionally depends on:
        - rasterizer backend revision (diff-gaussian-rasterization commit)
        - optimizer behavior (PyTorch + CUDA versions)
        - serialization format of splat params
        See: scripts/validation/verify_3dgs_artifacts.py
