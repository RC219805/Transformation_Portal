version: '3.8'

services:
  # CPU-only service (lightweight)
  transformation-portal-cpu:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-cpu
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.cli serve --host 0.0.0.0 --port 8000
  
  # GPU-enabled service (CUDA)
  transformation-portal-gpu:
    build:
      context: .
      target: gpu
    image: transformation-portal:gpu
    container_name: transformation-portal-gpu
    runtime: nvidia
    ports:
      - "8001:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    environment:
      - DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python -m transformation_portal.cli serve --host 0.0.0.0 --port 8000
  
  # Batch processing worker
  transformation-portal-worker:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-worker
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.cli batch-process /app/input /app/output --preset golden_hour
  
  # Monitoring dashboard (optional)
  transformation-portal-monitor:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-monitor
    ports:
      - "8080:8080"
    volumes:
      - ~/.transformation_portal:/root/.transformation_portal
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.monitoring.dashboard --port 8080

volumes:
  input:
  output:
  config:

networks:
  default:
    name: transformation-portal-network
