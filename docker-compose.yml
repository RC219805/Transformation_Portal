# Compose v2+: the obsolete top-level `version` key has been dropped.
# Secrets and orchestrator toggles live in .env (see .env.example for the contract).
#
# Health probes:
#   - cpu, gpu services: rely on the Dockerfile's HEALTHCHECK directive
#     (port 8000, see Dockerfile). Compose would override the image's
#     HEALTHCHECK if a service-level `healthcheck:` were declared, so we
#     intentionally don't, to keep one source of truth.
#   - monitor service: declares its own `healthcheck:` because it binds
#     port 8080 (different from the image's default 8000), so the image's
#     HEALTHCHECK doesn't fit.
#   - worker service: one-shot batch process; no healthcheck.

services:
  # Bootstrap: ensure the writable host bind-mount target exists and is
  # writable by the container's `tp` user (UID/GID 10001). Runs once per
  # `compose up` and exits; cpu/gpu/worker services gate startup on its
  # successful completion via `depends_on: condition: service_completed_successfully`.
  #
  # The init service is intentionally the ONLY service that runs as root;
  # app services keep the image-level `USER tp` for runtime hardening.
  #
  # Ownership semantics on the host: after first run ./output becomes owned
  # by the configured tp runtime UID/GID (defaults 10001:10001). Input/config
  # stay host-owned and are mounted read-only into the app containers, so
  # tp-init does not mutate tracked repo content or developer-owned input dirs.
  tp-init:
    image: alpine:3.19
    container_name: transformation-portal-init
    user: "0:0"
    environment:
      TP_UID: ${TP_UID:-10001}
      TP_GID: ${TP_GID:-10001}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /init/output
        chown -R "$${TP_UID}:$${TP_GID}" /init/output
        chmod 0775 /init/output
        chmod -R u+rwX,g+rwX /init/output
        echo "tp-init: output bind-mount target ready (owner=$${TP_UID}:$${TP_GID} mode=0775)"
    volumes:
      - ./output:/init/output
    restart: "no"

  # CPU-only service (lightweight)
  transformation-portal-cpu:
    build:
      context: .
      target: cpu
      args:
        TP_UID: ${TP_UID:-10001}
        TP_GID: ${TP_GID:-10001}
    image: transformation-portal:cpu
    container_name: transformation-portal-cpu
    depends_on:
      tp-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./config:/app/config:ro
      # State persists in named volume `tp_state` — Docker-managed ownership
      # inherits the image's tp:tp chown on first use, avoiding bind-mount
      # UID friction on Linux. Use `docker compose cp` for host inspection.
      - tp_state:/home/tp/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.cli serve --host 0.0.0.0 --port 8000

  # GPU-enabled service (CUDA)
  transformation-portal-gpu:
    build:
      context: .
      target: gpu
      args:
        TP_UID: ${TP_UID:-10001}
        TP_GID: ${TP_GID:-10001}
    image: transformation-portal:gpu
    container_name: transformation-portal-gpu
    runtime: nvidia
    depends_on:
      tp-init:
        condition: service_completed_successfully
    ports:
      - "8001:8000"
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./config:/app/config:ro
      # State persists in named volume `tp_state` — see cpu service for rationale.
      - tp_state:/home/tp/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # GPU image installs python3 (no `python` shim). Use python3 here so the
    # command line is consistent with the image's interpreter.
    command: python3 -m transformation_portal.cli serve --host 0.0.0.0 --port 8000

  # Batch processing worker (one-shot; no healthcheck — process exits when batch completes)
  transformation-portal-worker:
    build:
      context: .
      target: cpu
      args:
        TP_UID: ${TP_UID:-10001}
        TP_GID: ${TP_GID:-10001}
    image: transformation-portal:cpu
    container_name: transformation-portal-worker
    depends_on:
      tp-init:
        condition: service_completed_successfully
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./config:/app/config:ro
      # State persists in named volume `tp_state` — see cpu service for rationale.
      - tp_state:/home/tp/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.cli batch-process /app/input /app/output --preset golden_hour

  # Monitoring dashboard (optional). No I/O bind mounts → no tp-init dependency.
  transformation-portal-monitor:
    build:
      context: .
      target: cpu
      args:
        TP_UID: ${TP_UID:-10001}
        TP_GID: ${TP_GID:-10001}
    image: transformation-portal:cpu
    container_name: transformation-portal-monitor
    ports:
      - "8080:8080"
    volumes:
      # State persists in named volume `tp_state` — see cpu service for rationale.
      - tp_state:/home/tp/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: python -m transformation_portal.monitoring.dashboard --port 8080

  # Durable orchestrator state backend (Phase 1.B).
  #
  # Optional service: only required when the orchestrator runs with
  # TP_ORCHESTRATOR_STATE_BACKEND=postgres. The default `memory` backend
  # never touches the database. Start with:
  #
  #     docker compose up -d postgres
  #     make db-upgrade
  #
  # See docs/runtimes/orchestrator-postgres.md for the full operator runbook.
  postgres:
    image: postgres:16-alpine
    container_name: transformation-portal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transformation_portal}
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp_dev_password}
    ports:
      - "${TP_POSTGRES_PUBLIC_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp} -d ${POSTGRES_DB:-transformation_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Durable queue broker backend (Phase 2.B).
  #
  # Optional service: only required when the orchestrator runs with
  # TP_ORCHESTRATOR_QUEUE_BACKEND=redis. The default `memory` backend
  # never touches Redis. Start with:
  #
  #     docker compose up -d redis
  #     TP_TEST_REDIS_URL=redis://127.0.0.1:6379/0 make test-worker-redis-contract
  #
  # AOF is enabled so queued jobs and active leases survive a Redis
  # restart, matching the durable-by-default contract documented in
  # docs/governance/PRODUCTION_HARDENING_GAP_2026-05-13.md §5.2.
  redis:
    image: redis:7-alpine
    container_name: transformation-portal-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - "noeviction"
    ports:
      - "${TP_REDIS_PUBLIC_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Local S3-compatible ArtifactStore backend for Phase 5.A paid-pilot smoke.
  #
  # Optional local-development convenience only; managed pilots should map the
  # same TP_ARTIFACT_* / AWS_* env vars to their real S3/R2/MinIO service.
  # Start with:
  #
  #     docker compose --profile paid-pilot up -d minio minio-create-bucket
  #
  minio:
    image: ${TP_MINIO_IMAGE:-minio/minio:latest}
    container_name: transformation-portal-minio
    profiles: ["paid-pilot"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tp_minio_password}
    ports:
      - "${TP_MINIO_API_PUBLIC_PORT:-127.0.0.1:9000}:9000"
      - "${TP_MINIO_CONSOLE_PUBLIC_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-create-bucket:
    image: ${TP_MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: transformation-portal-minio-create-bucket
    profiles: ["paid-pilot"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tp_minio_password}
      TP_ARTIFACT_BUCKET: ${TP_ARTIFACT_BUCKET:-tp-artifacts-pilot}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb -p "local/$${TP_ARTIFACT_BUCKET}" || true
        mc anonymous set none "local/$${TP_ARTIFACT_BUCKET}" || true

volumes:
  input:
  output:
  config:
  # tp_state holds the runtime user's state cache (plugins, model registry
  # scratch, etc.). Named volume rather than bind so Docker preserves the
  # image's tp:tp ownership and we don't fight host UIDs on Linux.
  tp_state:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: transformation-portal-network
