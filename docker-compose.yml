# Compose v2+: the obsolete top-level `version` key has been dropped.
# Secrets and orchestrator toggles live in .env (see .env.example for the contract).
# Each port-bound service uses the Dockerfile's HEALTHCHECK; the worker is one-shot
# and intentionally has no healthcheck.

services:
  # CPU-only service (lightweight)
  transformation-portal-cpu:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-cpu
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: python -m transformation_portal.cli serve --host 0.0.0.0 --port 8000

  # GPU-enabled service (CUDA)
  transformation-portal-gpu:
    build:
      context: .
      target: gpu
    image: transformation-portal:gpu
    container_name: transformation-portal-gpu
    runtime: nvidia
    ports:
      - "8001:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: python -m transformation_portal.cli serve --host 0.0.0.0 --port 8000

  # Batch processing worker (one-shot; no healthcheck — process exits when batch completes)
  transformation-portal-worker:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-worker
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ~/.transformation_portal:/root/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    command: python -m transformation_portal.cli batch-process /app/input /app/output --preset golden_hour

  # Monitoring dashboard (optional)
  transformation-portal-monitor:
    build:
      context: .
      target: cpu
    image: transformation-portal:cpu
    container_name: transformation-portal-monitor
    ports:
      - "8080:8080"
    volumes:
      - ~/.transformation_portal:/root/.transformation_portal
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: python -m transformation_portal.monitoring.dashboard --port 8080

volumes:
  input:
  output:
  config:

networks:
  default:
    name: transformation-portal-network
